uurvisie waarop deze demo is gebaseerd":"The architecture vision this demo is based on","De assistent is een uitbreiding van het mailprogramma. Hij praat rechtstreeks met ELSA en werkt naast IMAP, niet in plaats daarvan.":"The assistant is an extension of the mail program. It talks directly to ELSA and works alongside IMAP, not instead of it.","De brug leest het bericht uit Kafka en kijkt in het register of de Message-ID er al is. Een verzonden bericht komt zo maar één keer binnen.":"The bridge reads the message from Kafka and checks in the register whether the Message-ID is already there. That way a sent message only comes in once.","De brug pakt het bericht uit: de EML, en elke bijlage als eigen object.":"The bridge unpacks the message: the EML, and each attachment as its own object.","De brug schrijft het bericht en de bijlagen weg zoals een medewerker een bestand opslaat. Vanaf hier loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"The bridge writes the message and the attachments just as an employee saves a file. From here a message follows the same path as a file on a network drive.","De brug schrijft ze in Nextcloud, langs dezelfde weg als een bestand op een netwerkschijf. Nextcloud maakt eerst het record in het register aan.":"The bridge writes them into Nextcloud, along the same path as a file on a network drive. Nextcloud first creates the record in the register.","De hele gemeente":"The whole municipality","De mailstroom loopt door Nextcloud. Een piek mag de medewerker in Files niet raken. Stap 1 is ook de proef daarop.":"The mail flow runs through Nextcloud. A spike must not affect the employee in Files. Step 1 is also the test of that.","De mappen staan in ELSA. Het mailprogramma ziet ze via IMAP.":"The folders are kept in ELSA. Your mail program sees them via IMAP.","De medewerker kiest Persoonlijk in het paneel, of sleept het bericht naar de map Persoonlijk.":"The employee chooses Personal in the pane, or drags the message to the Personal folder.","De medewerker opent in Files de map E-mail, en daarin een dossier of een maand.":"The employee opens the E-mail folder in Files, and within it a file or a month.","De nieuwe Outlook en Outlook op het web laden webinvoegtoepassingen alleen bij een Microsoft-account, en COM-invoegtoepassingen werken daar niet. Wat dan wel werkt:":"The new Outlook and Outlook on the web only load web add-ins for a Microsoft account, and COM add-ins do not work there. What does work:","De nieuwe Outlook heeft geen paneel. Hoe langer Outlook (klassiek) blijft, hoe beter; daarna blijven Thunderbird en de webmail van ELSA.":"The new Outlook has no pane. The longer Outlook (classic) remains, the better; after that, Thunderbird and the ELSA webmail remain.","De opslag levert de EML. Is het bericht persoonlijk, dan ontsleutelt de IMAP-server het met de sleutel van de gebruiker, die pas na aanmelding vrijkomt.":"Storage returns the EML. If the message is personal, the IMAP server decrypts it with the user's key, which is only released after sign-in.","De opslag van de e-mailarchivering komt in de nieuwe Nextcloud-stack. Nextcloud Files biedt WebDAV, geen IMAP. Er komt dus een IMAP-server naast. De vraag is waar de berichten dan staan.":"E-mail archive storage moves into the new Nextcloud stack. Nextcloud Files offers WebDAV, not IMAP. So an IMAP server is added alongside it. The question is where the messages are then kept.","De orchestrator pakt het EML-bestand uit: kop, tekst en bijlagen.":"The orchestrator unpacks the EML file: header, text and attachments.","De persoonlijke sleutel komt pas vrij na aanmelding, alleen voor de sessie van de eigenaar.":"The personal key is only released after sign-in, and only for the owner's session.","De postbus in het mailprogramma":"The mailbox in the mail program","De prijs: een piek in de mailstroom komt bij Nextcloud terecht. Daarom draaien de achtergrondtaken op eigen servers, los van die voor de medewerkers. En wat NiFi per bericht zou vastleggen, controleert ELSA nu zelf.":"The price: a spike in the mail flow lands on Nextcloud. That is why the background jobs run on their own servers, separate from those for staff. And what NiFi would record per message, ELSA now checks itself.","De sleutelkluis met vrijgave per sessie, de procedure van de gemeentesecretaris, de koppeling met de Woo-dossiers in XENA.":"The key vault with release per session, the municipal secretary's procedure, the link with the Woo files in XENA.","De tekst gaat naar de zoekindex. Bijlagen worden eigen objecten, verbonden met het bericht.":"The text goes to the search index. Attachments become separate objects, linked to the message.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"Access applies only to the period stated and expires automatically. Every time a message is opened with this key, it is recorded.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"The work instruction on fees 2026 has been adopted. You can find it in the team's working folder.","De zaak komt uit het zaaksysteem, dat leidend blijft. ELSA legt alleen de koppeling vast, als kenmerk.":"The case comes from the case management system, which remains leading. ELSA only records the link, as an attribute.","De zoekindex van ELSA geeft alleen zakelijke berichten. Vertrouwelijke berichten alleen aan wie daar recht op heeft.":"The ELSA search index returns business messages only. Confidential messages only to those entitled to them.","De zoekindex volgt het register. Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"The search index follows the register. Subject, text and attachments become searchable, only for those with access.","Deel I legt de asynchrone verwerking in ADR-0005 bij NiFi, los van de laag die gebruikers bedient.":"In ADR-0005, Part I assigns asynchronous processing to NiFi, separate from the layer that serves users.","Delegeren aan de concerncontroller":"Delegate to the corporate controller","Demo":"Demo","Demo: {0} dagen later":"Demo: {0} days later","Deze map is leeg.":"This folder is empty.","Dezelfde taal en dezelfde bouwstenen als de rest van XENA, een ruime licentie en een opslaglaag die bedoeld is om te vervangen. Het risico zit in Sieve: ManageSieve staat in de documentatie nog als experimenteel, en ELSA leunt op filters.":"The same language and building blocks as the rest of XENA, a permissive licence and a storage layer designed to be replaced. The risk lies in Sieve: the documentation still lists ManageSieve as experimental, and ELSA relies on filters.","Dit bericht":"This message","Dit bericht is automatisch verstuurd.":"This message was sent automatically.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"This message is stored with your personal key. In storage it is unreadable, even to administrators.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"This message could be either business or personal.","Dit is je eigen vermelding. Aanpassen doe je onder Mijn vermelding.":"This is your own entry. You can change it under My listing.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"If you do nothing, the message counts as business after ten days. Personal means: moved to the Personal folder, encrypted with your own key and outside the search scope for the Woo.","Doorstroom":"Message flow","Doorstroom van een bericht":"How a message flows","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Forwarding is only allowed to an address at a participating municipality.","Dossier of zaak":"Dossier or case","Dossiers":"Files","Dossiersleutels en persoonlijke sleutels":"File keys and personal keys","Dubbele berichten":"Duplicate messages","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"E-mail archiving in XENA: every message in the register, read as usual in your own mail program.","E-mailadres":"E-mail address","E-mailarchivering binnen XENA":"E-mail archiving within XENA","ELSA bij dit bericht":"ELSA for this message","ELSA registreert geen zaken. Het zaaksysteem blijft leidend; ELSA legt de koppeling vast als kenmerk, via de Zaken API.":"ELSA does not register cases. The case management system remains leading; ELSA records the link as an attribute, via the Zaken API.","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA marks unsorted messages as business after ten days","EXPUNGE haalt het bericht uit de map van de medewerker. Het object blijft, zolang de bewaartermijn loopt.":"EXPUNGE removes the message from the employee's folder. The object remains for as long as the retention period runs.","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"An address book of staff at the participating municipalities. Everyone decides for themselves whether to be listed and with which details. Each municipality manages its own part and shares it via CardDAV.","Een bericht kan in meer dossiers zitten. Het dossier verwijst naar het bericht; er wordt niets gekopieerd.":"A message can be in several files. The file refers to the message; nothing is copied.","Een bericht komt binnen":"A message arrives","Een bericht van een winkel over iets privés.":"A message from a shop about something private.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"A daily summary from ELSA of the messages that still need sorting.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"A demo, not a product. All sample data is invented: people, addresses, files and case numbers do not exist. The demo shows what the architecture makes possible; some of the functions are a vision of the future.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"A filter may not move messages to Personal. Whether a message is personal is your own choice, message by message.","Een gewone IMAP-server met eigen opslag op schijf, en daarnaast een kopie van elk bericht in Nextcloud.":"An ordinary IMAP server with its own disk storage, plus a copy of every message in Nextcloud.","Een kleine dienst leest het bericht uit Kafka, kijkt in het register of de Message-ID er al is en pakt het uit: kop, tekst en bijlagen.":"A small service reads the message from Kafka, checks in the register whether the Message-ID is already there, and unpacks it: header, text and attachments.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"A mail program expects deletion to succeed. ELSA removes the message from the folder, but the object is kept for as long as the retention period runs.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"A newsletter: business, with a short retention period.","Een opvolger voor agenda en vrij/bezet, en mailprogramma's die daarmee overweg kunnen.":"A successor for calendar and free/busy, and mail programs that can work with it.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"A personal message stays personal. If you think it is business after all, first choose Business in ELSA.","Een postbus is iets anders dan een archief. Medewerkers verwachten snelheid, zoeken in de eigen mappen en offline werken. De proefgroep in stap 2 moet dat toetsen voordat iedereen overgaat.":"A mailbox is not the same as an archive. Staff expect speed, search in their own folders and offline working. The pilot group in step 2 must test this before everyone moves over.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"A transport rule forwards every message, incoming and outgoing, as EML to Kafka.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"A sent message arrives twice: via the transport rule and as a copy from the mail program. ELSA removes duplicates by Message-ID.","Een zaaksysteem dat op omschrijving kan zoeken, of een eigen index van zaken.":"A case management system that can search by description, or a separate index of cases.","Eerst, naast de bestaande postbus":"First, alongside the existing mailbox","Eerste kandidaat: Apache James.":"First candidate: Apache James.","Eigen opslag aankoppelen":"Plug in custom storage","Elk bericht als EML door, zonder kopie":"Every message forwarded as EML, without a copy","Elk bericht als EML · bekijk de stappen":"Every message as EML · view the steps","Elk bericht gaat via Exchange Online en Kafka naar een kleine brug, die het in Nextcloud wegschrijft. Daarna loopt het langs dezelfde weg als een bestand op een netwerkschijf. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Every message goes through Exchange Online and Kafka to a small bridge, which writes it into Nextcloud. From there it follows the same path as a file on a network drive. Within a second it is in the register, the object storage and the search index. No copy is left behind in Exchange.","Elk bericht gaat via Exchange Online, Kafka en de orchestrator naar ELSA. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Every message goes through Exchange Online, Kafka and the orchestrator to ELSA. Within a second it is in the register, the object storage and the search index. No copy is left behind in Exchange.","Elke IMAP-handeling wordt een WebDAV-aanroep: traag bij grote postbussen.":"Every IMAP action becomes a WebDAV call: slow for large mailboxes.","Elke IMAP-server kan het, ook Dovecot zonder aanpassing.":"Any IMAP server can do it, even Dovecot without modification.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Each attachment is a separate object in storage, linked to the message. This means an attachment can be found, kept and published on its own.","Elke dag: alles wat in Kafka stond, staat ook in het register. Dat vervangt de herkomstregistratie die NiFi zou bieden.":"Every day: everything that was in Kafka is also in the register. This replaces the provenance tracking that NiFi would provide.","Elke ingang doet waar hij goed in is: IMAP voor de postbus, WebDAV voor het dossier.":"Each access route does what it is good at: IMAP for the mailbox, WebDAV for the file.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"A new application has been submitted for the address Kleverlaan 14. The application and the drawings are attached.","Er is één exemplaar van elk bericht. De ingangen verwijzen ernaar; geen ervan houdt een eigen kopie.":"There is one copy of each message. The access routes refer to it; none of them keeps its own copy.","Er is één exemplaar van elk bericht. Metagegevens, bewaartermijn en zoekindex gaan zoals bij de netwerkschijven, via het register en de apps rond Nextcloud. Er is geen aparte orchestrator.":"There is one copy of each message. Metadata, retention period and search index work as for the network drives, through the register and the apps around Nextcloud. There is no separate orchestrator.","Evenementen":"Events","Evenementenbeleid kustgemeenten":"Events policy coastal municipalities","Evenementenvergunning":"Event permit","Evenementenvergunning circuit 2027":"Event permit circuit 2027","Exchange Online":"Exchange Online","Exchange Online ontvangt het bericht via SMTP. Een transport rule stuurt het als EML door naar Kafka en laat geen kopie achter in de postbus.":"Exchange Online receives the message via SMTP. A transport rule forwards it as EML to Kafka and leaves no copy in the mailbox.","Exchange Online verzendt en ontvangt; ELSA bewaart. Alles na de aanvoer staat in de Nextcloud-stack van XENA. Zo kan de mailprovider later worden vervangen zonder dat het archief verhuist.":"Exchange Online sends and receives; ELSA keeps. Everything after intake is in the XENA Nextcloud stack. This way the mail provider can be replaced later without the archive moving.","Extensie of COM-invoegtoepassing, via de API van ELSA":"Extension or COM add-in, via the ELSA API","Eén EML per bericht, onveranderlijk, met bewaarvergrendeling":"One EML per message, immutable, with retention lock","Eén bericht, drie plekken die ernaar kijken":"One message, three places that look at it","Eén exemplaar, onveranderlijk, met bewaarvergrendeling.":"One copy, immutable, with retention lock.","Eén keer verwerken · bekijk de stappen":"Processed once · view the steps","Eén keer wegschrijven · bekijk de stappen":"Written once · view the steps","Eén object in de opslag, twee ingangen":"One object in storage, two access routes","Eén object in de opslag, twee ingangen: IMAP en WebDAV":"One object in storage, two access routes: IMAP and WebDAV","Eén opslag, die Nextcloud beheert.":"One storage, managed by Nextcloud.","Favoriet":"Favourite","Favorieten":"Favourites","Files toont een virtuele map. De inhoud komt uit het register, niet uit een eigen kopie (PROPFIND).":"Files shows a virtual folder. The content comes from the register, not from a copy of its own (PROPFIND).","Filter toegevoegd.":"Filter added.","Filter toevoegen":"Add filter","Filters":"Filters","Filters (Sieve)":"Filters (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Filters run in ELSA itself, at the moment a message arrives. So they work in any mail program and on any device. Some actions are not allowed, because they would bypass the separation between business and personal.","Filters van de medewerker":"Employee's filters","Foto's van de vakantie":"Holiday photos","Functie":"Job title","Geachte aanvrager,":"Dear applicant,","Gedelegeerd":"Delegated","Geen":"None","Geen NiFi: een bewuste afwijking van XENA Deel I":"No NiFi: a deliberate departure from XENA Part I","Geen assistent in Outlook":"No assistant in Outlook","Geen assistent in de nieuwe Outlook":"No assistant in the new Outlook","Geen dossier gevonden.":"No file found.","Geen eigen IMAP-server: alleen de koppelingen eromheen.":"No IMAP server of our own: only the connectors around it.","Geen kopie meer in Exchange, voor de proefgroep":"No more copy in Exchange, for the pilot group","Geen zaak gevonden. Zaken komen uit het zaaksysteem; een nieuwe zaak maak je daar aan.":"No case found. Cases come from the case system; you create a new case there.","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Data at the source: the message is stored once, and whoever needs it refers to it.","Gekoppeld aan een zaak":"Linked to a case","Gekoppeld aan zaak {0}.":"Linked to case {0}.","Gelezen, vlag en label staan alleen in de IMAP-server. Leesstatus is geen archiefgegeven en komt niet in het register.":"Read, flag and label are kept only in the IMAP server. Read status is not archive data and does not go into the register.","Gelezen, vlag, label":"Read, flag, label","Gemaakt door":"Created by","Gemeente":"Municipality","Gemeente Bloemendaal":"Municipality of Bloemendaal","Gemeente Haarlem":"Municipality of Haarlem","Gemeente Heemstede":"Municipality of Heemstede","Gemeente Velsen":"Municipality of Velsen","Gemeente Zandvoort":"Municipality of Zandvoort","Gemeentelijk adresboek":"Municipal address book","Gemeentesecretaris":"Municipal secretary","Gevonden":"Found","Gevonden berichten gaan per verwijzing naar het Woo-dossier in XENA. Er wordt niets gekopieerd.":"Messages found go by reference to the Woo file in XENA. Nothing is copied.","Geweigerd":"Refused","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Good news: the repair is done. You can collect your bike until 18:00.","Gooi weg":"Discard","Groeipad":"Growth path","Groet, Lotte Visser":"Regards, Lotte Visser","Groet, Noor":"Regards, Noor","Haal mij uit het adresboek":"Remove me from the address book","Handeling":"Action","Help":"Help","Herinrichting Houtplein":"Redevelopment of Houtplein","Het Common Ground-team en het samenwerkingsverband OWC":"The Common Ground team and the OWC partnership","Het EML-bestand en de bijlagen gaan de objectopslag in, met versiebeheer.":"The EML file and the attachments go into the object storage, with versioning.","Het Woo-dossier is in Files een map met dezelfde berichten. Na beoordeling gaat de openbare versie naar TINA.":"In Files, the Woo file is a folder with the same messages. After assessment, the public version goes to TINA.","Het adresboek staat ook in het paneel van de assistent.":"The address book is also in the assistant pane.","Het bericht en elke bijlage krijgen een eigen identificatie. De metagegevens worden vastgelegd; de aard is nog open.":"The message and each attachment get their own identifier. The metadata is recorded; the nature is still open.","Het bericht gaat via Exchange Online de deur uit en komt via de transport rule terug in ELSA, onder Verzonden items.":"The message leaves through Exchange Online and returns to ELSA via the transport rule, under Sent Items.","Het bericht komt binnen bij de mailprovider. Een transport rule stuurt het als EML door en houdt geen kopie.":"The message arrives at the mail provider. A transport rule forwards it as EML and keeps no copy.","Het bericht komt op een wachtrij. Zo gaat er niets verloren als een volgende stap even niet bereikbaar is.":"The message is placed on a queue. That way nothing is lost if a next step is briefly unavailable.","Het bericht staat in Postvak IN. Het mailprogramma ziet het bij de volgende synchronisatie.":"The message is in the Inbox. The mail program sees it at the next sync.","Het bericht staat één keer in de objectopslag van XENA, beschreven in het register. De IMAP-server en Nextcloud Files verwijzen er allebei naar.":"The message is stored once in XENA object storage, described in the register. The IMAP server and Nextcloud Files both refer to it.","Het bericht verdwijnt uit de virtuele mappen in Files, en de tekst uit de zoekindex.":"The message disappears from the virtual folders in Files, and its text from the search index.","Het bericht wordt één keer via Nextcloud weggeschreven, zoals een bestand, en staat dan in de objectopslag, beschreven in het register. De IMAP-server leest het via het register uit de opslag; Files toont het.":"The message is written once through Nextcloud, like a file, and then sits in object storage, described in the register. The IMAP server reads it from storage via the register; Files displays it.","Het bericht zelf, zoals het wordt bewaard":"The message itself, as it is kept","Het enige onderdeel dat er voor de mail bij komt. Daarna loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"The only component added for mail. After that a message follows the same path as a file on a network drive.","Het gemeentelijk adresboek":"The municipal address book","Het gemeentelijk adresboek gebruiken in de webmail van ELSA. De nieuwe Outlook kent geen CardDAV.":"Use the municipal address book in the ELSA webmail. The new Outlook does not support CardDAV.","Het gesprek over archiveren van e-mail aan de bron, zonder kopie bij de leverancier van de mailserver":"The conversation about archiving e-mail at the source, without a copy at the mail server vendor","Het mailprogramma haalt berichten op via IMAP4. Inzien, verplaatsen en versleutelen gaan via ELSA; filters draaien als Sieve.":"The mail program retrieves messages via IMAP4. Viewing, moving and encrypting go through ELSA; filters run as Sieve.","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Filters als Sieve.":"The mail program fetches mail from ELSA via IMAP. Sorting within ten days. Filters as Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Your mail program can also manage filters itself via ManageSieve. ELSA checks every script before it is saved.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"The mail program sends a new message via SMTP to Exchange Online.","Het meest compleet uit de doos, met CardDAV voor het adresboek erbij. Maar een eigen opslagkoppeling betekent werken in de code van één bedrijf, en een deel van de functies zit in de betaalde editie.":"The most complete out of the box, with CardDAV for the address book too. But a custom storage connector means working in one company's code, and some functions are in the paid edition.","Het object wordt opnieuw opgeslagen, versleuteld met de persoonlijke sleutel. De onversleutelde versie vervalt. Dat kan, omdat de bewaarvergrendeling pas ingaat als een bericht zakelijk is.":"The object is stored again, encrypted with the personal key. The unencrypted version lapses. This is possible because the retention lock only applies once a message is business.","Het onderwerp noemt een lopend Woo-verzoek.":"The subject mentions an ongoing Woo request.","Het paneel in Thunderbird en Outlook (klassiek): scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"The pane in Thunderbird and Outlook (classic): sort, enrich, link to case and file. The municipal address book.","Het register geeft de berichten en de rechten. Alleen zakelijke berichten waar de medewerker bij mag. Persoonlijke berichten staan er nooit in.":"The register returns the messages and the permissions. Only business messages the employee is allowed to see. Personal messages are never in it.","Het register legt de aard persoonlijk vast, met wie en wanneer. Het bericht valt buiten het zoekbereik voor de Woo.":"The register records the nature as personal, by whom and when. The message falls outside the search scope for the Woo.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd.":"The register records the message: Message-ID, sender, recipients, date and the nature \"still to sort\", with a ten-day cooling-off period.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd. De zoekindex volgt het register.":"The register records the message: Message-ID, sender, recipients, date and the nature \"still to sort\", with a ten-day cooling-off period. The search index follows the register.","Het register meldt elk nieuw bericht aan de IMAP-server, die het in de juiste map zet met een verwijzing naar het object.":"The register notifies the IMAP server of each new message, which puts it in the right folder with a reference to the object.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"The register notifies the IMAP server of the new message. The server keeps no second copy: it refers to the object and tracks only UID, folder and flags.","Het register meldt het nieuwe bericht aan de IMAP-server. Die zet het in Postvak IN, met een verwijzing naar het object.":"The register notifies the IMAP server of the new message. The server puts it in the Inbox, with a reference to the object.","Hetzelfde bericht in Nextcloud Files":"The same message in Nextcloud Files","Hier zijn de foto's.":"Here are the photos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Here is the draft of the project plan. Could you look in particular at the section on permits for terraces?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Hi San, will you bring the cake on Saturday? Grandma is counting on you. Love, Ellen","Hoi Sanne,":"Hi Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP MOVE naar Persoonlijk. De IMAP-server meldt de keuze aan ELSA.":"IMAP MOVE to Personal. The IMAP server reports the choice to ELSA.","IMAP en LMTP; SMTP via Postfix":"IMAP and LMTP; SMTP via Postfix","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP covers mail only. The calendar stays in Exchange for now; the address book goes via CardDAV.","IMAP naast WebDAV":"IMAP alongside WebDAV","IMAP, SMTP, LMTP":"IMAP, SMTP, LMTP","IMAP-server":"IMAP server","IMAP-server naast Nextcloud Files, op dezelfde objectopslag":"IMAP server alongside Nextcloud Files, on the same object storage","IMAP4 en ManageSieve: mappen, vlaggen en filters per gebruiker":"IMAP4 and ManageSieve: folders, flags and filters per user","IMAP4 en Sieve":"IMAP4 and Sieve","IMAP4rev2":"IMAP4rev2","Iedereen over, en andere gemeenten in het adresboek":"Everyone moves over, and other municipalities in the address book","Ik ben afwezig tot maandag.":"I am out of the office until Monday.","In behandeling":"In progress","In de Nextcloud-stack doen het register en de apps rond Nextcloud dat werk al voor de netwerkschijven. ELSA volgt de netwerkschijven: minder onderdelen, één beheerteam, en mail en bestanden langs dezelfde weg.":"In the Nextcloud stack rnet Message Format (EML)":"Internet Message Format (EML)","Is dit bericht zakelijk of persoonlijk?":"Is this message business or personal?","JMAP":"JMAP","Java (vanaf 3.9 Java 21)":"Java (Java 21 from 3.9)","Java-interface in een modulair ontwerp":"Java interface in a modular design","Je fiets is klaar om op te halen":"Your bike is ready for collection","Je kunt je vermelding altijd aanpassen of intrekken. De wijziging gaat via CardDAV naar de andere gemeenten.":"You can change or withdraw your listing at any time. The change goes to the other municipalities via CardDAV.","Je staat in het adresboek":"You are in the address book","Je staat in het gemeentelijk adresboek.":"You are in the municipal address book.","Je staat niet in het adresboek":"You are not in the address book","Je staat nog niet in het adresboek. Collega's van andere gemeenten kunnen je dan niet vinden.":"You are not in the address book yet. This means colleagues at other municipalities cannot find you.","Je vermelding is ingetrokken.":"Your listing has been withdrawn.","Juridische Zaken":"Legal Affairs","Kafka":"Kafka","Kapvergunning Houtplein":"Tree felling permit Houtplein","Kies":"Choose","Kies een bericht.":"Choose a message.","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Choose an action. The steps show which component does what.","Kopieer adres":"Copy address","Koppelen aan een zaak; het zaaksysteem blijft leidend":"Link to a case; the case management system remains leading","Label van ELSA, als IMAP-trefwoord":"ELSA label, as an IMAP keyword","Labels uit het register":"Labels from the register","Later":"Later","Later: een moderne opvolger van IMAP voor webmail en apps":"Later: a modern successor to IMAP for webmail and apps","Leest elk bericht uit Kafka, kijkt in het register of de Message-ID er al is, pakt het uit en schrijft de EML en de bijlagen in Nextcloud. Klein, zonder eigen opslag.":"Reads each message from Kafka, checks in the register whether the Message-ID oek: opname is vrijwillig.":"No one found. This colleague may not be in the address book: being listed is voluntary.","Niet doen":"Do not do","Niet toegestaan: weggooien, verplaatsen naar Persoonlijk, doorsturen naar een adres buiten de gemeenten.":"Not allowed: discarding, moving to Personal, forwarding to an address outside the municipalities.","Niets gevonden.":"Nothing found.","Niets in het mailprogramma. De Woo-coördinator zoekt al in het archief, en zakelijke berichten staan in Files.":"Nothing in the mail program. The Woo coordinator already searches the archive, and business messages are in Files.","Niets, als het goed gaat.":"Nothing, if all goes well.","Niets.":"Nothing.","Niets. Exchange houdt in deze stap nog een kopie in de postbus.":"Nothing. In this step Exchange still keeps a copy in the mailbox.","Niets. Voor de proefgroep laat de transport rule geen kopie meer achter.":"Nothing. For the pilot group the transport rule no longer leaves a copy.","Nieuw bericht":"New message","Nieuwe Outlook":"New Outlook","Nieuwe Outlook en Outlook op het web met een IMAP-account: geen paneel. Scheiden gaat dan door te verplaatsen naar de map Persoonlijk.":"New Outlook and Outlook on the web with an IMAP account: no pane. Separating is then done by moving the message to the Personal folder.","Nieuwe aanvraag omgevingsvergunning Kleverlaan 14":"New environmental permit application Kleverlaan 14","Nog 1 dag om te scheiden":"1 day left to sort","Nog geen favorieten. Open een vermelding en zet er een ster bij.":"No favourites yet. Open an entry and give it a star.","Nog te scheiden":"Still to sort","Nog {0} dagen om te scheiden":"{0} days left to sort","Objectopslag":"Object storage","Objectopslag (S3)":"Object storage (S3)","Om een persoonlijk bericht te tonen, moet de IMAP-server de sleutel van de gebruiker kunnen gebruiken, en alleen in diens sessie. Dat vraagt een koppeling met de sleutelkluis die nog moet worden ontworpen.":"To show a personal message, the IMAP server must be able to use the user's key, and only in that user's session. That requires a link with the key vault that has yet to be designed.","Omdat een EML nooit verandert, kunnen twee ingangen hetzelfde object delen zonder dat ze elkaar in de weg zitten. Ze verschillen alleen in metagegevens, en die hebben elk een eigen eigenaar.":"Because an EML never changes, two access routes can share the same object without getting in each other's way. They differ only in metadata, and each has its own owner.","Omgevingsvergunning":"Environmental permit","Omgevingsvergunning Kleverlaan 14":"Environmental permit Kleverlaan 14","Omgevingsvergunning dakopbouw Kleverlaan 12":"Environmental permit roof extension Kleverlaan 12","Onder de motorkap":"Under the bonnet","Onderdeel":"Component","Onderdeel van XENA, naast de opslag, MIRA en TINA.":"Part of XENA, alongside the storage, MIRA and TINA.","Onderdelen van de assistent":"Parts of the assistant","Onderwerp":"Subject","Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"Subject, text and attachments become searchable, only for those with access.","Onderzoek naar een klacht over integriteit. De persoonlijke berichten kunnen zakelijke berichten bevatten die ten onrechte als persoonlijk zijn aangemerkt.":"Investigation into an integrity complaint. The personal messages may contain business messages that were wrongly marked as personal.","Ontdubbelen, uitpakken en wegschrijven. Geen eigen opslag.":"Deduplicate, unpack and write. No storage of its own.","Ontdubbelen, vastleggen, opslaan, indexeren en afleveren":"Deduplicate, record, store, index and deliver","Ontkoppeld":"Unlinked","Ontkoppeld van {0}.":"Unlinked from {0}.","Ontkoppelen":"Unlink","Ontvangen":"Received","Ontvanger":"Recipient","Ontvangstbevestiging aanvraag Kleverlaan 14":"Acknowledgement of receipt, application Kleverlaan 14","Ook verzonden berichten lopen via deze route. Het mailprogramma bewaart daarnaast zelf een kopie in Verzonden ite es gekopieerd.":"Adresse copiée.","Adresboek":"Annuaire","Adviseur evenementen":"Conseiller manifestations","Afdeling":"Service","Afdeling i-Ontwikkeling, Gemeente Haarlem":"Service i-Ontwikkeling, commune de Haarlem","Afgehandeld":"Clôturé","Afleveren vanuit NiFi":"Remise depuis NiFi","Afstemming evenementenvergunning circuit 2027":"Coordination autorisation de manifestation circuit 2027","Afwezigheidsbericht":"Réponse automatique d'absence","Afzender":"Expéditeur","Afzender is een collega van een andere gemeente, over een vergunning.":"L'expéditeur est un collègue d'une autre commune, au sujet d'une autorisation.","Afzender is een privéadres en het bericht gaat over familie.":"L'expéditeur est une adresse privée et le message parle de famille.","Afzender is het Omgevingsloket.":"L'expéditeur est le Guichet Urbanisme.","Agenda en contacten":"Agenda et contacts","Alle":"Toutes","Alle mail vindbaar voor de Woo, zonder dat iemand anders gaat werken":"Tous les e-mails retrouvables pour la Woo, sans changer la façon de travailler","Alle voorbeeldgegevens zijn verzonnen.":"Toutes les données d'exemple sont fictives.","Alleen lezen. Een bericht wijzigen of verwijderen via WebDAV wordt geweigerd (403): een EML is af.":"Lecture seule. Modifier ou supprimer un message via WebDAV est refusé (403) : un EML est définitif.","Alleen zakelijke berichten":"Messages professionnels uniquement","Alleen zichtbaar voor medewerkers van gemeenten die de Office Assistent gebruiken: {0}.":"Visible uniquement par les agents des communes qui utilisent l'Assistant Office : {0}.","Alles is gescheiden.":"Tout est trié.","Als":"Si","Als {0} {1} \"{2}\"":"Si le champ {0} {1} « {2} »","Andere mailprovider":"Autre fournisseur de messagerie","Annuleren":"Annuler","Apache 2.0":"Apache 2.0","Apache NiFi":"Apache NiFi","Archief en zoeken":"Archive et recherche","Architectuur":"Architecture","Assistent":"Assistant","Assistent en adresboek":"Assistant et annuaire","Assistent van ELSA":"Assistant ELSA","Bekijk als":"Afficher en tant que","Bekijken":"Voir","Beleidsdossier":"Dossier de politique","Beleidsmedewerker leges":"Chargé de mission redevances","Bericht":"Message","Berichten":"Messages","Berichten als bestand, in dossiers":"Les messages comme fichiers, dans des dossiers","Berichtenwachtrij":"File de messages","Bestaande open source IMAP-servers":"Serveurs IMAP open source existants","Bestanden":"Fichiers","Bestanden in Nextcloud zijn te wijzigen; een archief moet dat niet zijn.":"Les fichiers dans Nextcloud sont modifiables ; une archive ne doit pas l'être.","Beste Sanne,":"Chère Sanne,","Beste collega,":"Cher collègue,","Bevoegdheid gedelegeerd aan de concerncontroller, voor dit ene verzoek.":"Pouvoir délégué au contrôleur de gestion, pour cette seule demande.","Bewaard in":"Conservée dans","Bewaartermijn":"Durée de conservation","Bezwaar":"Recours","Bezwaar leges dakkapel Kleverlaan 30":"Recours redevances lucarne Kleverlaan 30","Bezwaar omgevingsvergunning Kleverlaan 12":"Recours permis d'environnement Kleverlaan 12","Bezwaarschrift Kleverlaan 12":"Réclamation Kleverlaan 12","Bezwaarschrift.pdf":"Réclamation.pdf","Bij dit bericht":"Dans ce message","Bij elk opgeslagen Sieve-script: geen discard, geen fileinto naar Persoonlijk, redirect alleen binnen de aangesloten gemeenten.":"À chaque script Sieve enregistré : pas de discard, pas de fileinto vers Personnel, redirect uniquement au sein des communes participantes.","Bijgaand het bezwaarschrift van een omwonende tegen de verleende omgevingsvergunning voor de Kleverlaan 12. Graag je reactie op de gronden vóór 20 oktober.":"Ci-joint la réclamation d'un riverain contre le permis de construire accordé pour le Kleverlaan 12. Merci de me donner ton avis sur les motifs avant le 20 octobre.","Blijvend bewaren":"Conservation définitive","Bron per gemeente: {0}.":"Source par commune : {0}.","Bron: het deel van {0}, via CardDAV. Een favoriet is een verwijzing, geen kopie. Trekt iemand zijn vermelding in, dan verdwijnt hij ook bij jou.":"Source : la partie de {0}, via CardDAV. Un favori est une référence, pas une copie. Si quelqu'un retire sa fiche, elle disparaît aussi chez vous.","Brug":"Passerelle","Brug naar Nextcloud":"Passerelle vers Nextcloud","Brug van Kafka naar Nextcloud":"Passerelle de Kafka vers Nextcloud","Buffert en garandeert aflevering":"Met en tampon et garantit la livraison","C":"C","COM-invoegtoepassing van ELSA (REST, met het token van de gebruiker)":"complément COM d'ELSA (REST, avec le jeton de l'utilisateur)","CardDAV":"CardDAV","CardDAV, CalDAV, WebDAV":"CardDAV, CalDAV, WebDAV","CardDAV-server":"Serveur CardDAV","Cassandra of PostgreSQL":"Cassandra ou PostgreSQL","Classificatie":"Classement","Colofon":"Colophon","Concept projectplan Houtplein, graag reactie vóór vrijdag":"Projet de plan de projet Houtplein, merci de réagir avant vendredi","Concept. Dit is een volgorde, geen planning. Register en objectopslag staan er vanaf stap 1 en veranderen daarna niet meer: het archief verhuist nooit.":"Projet. Ceci est un ordre, pas un calendrier. Le registre et le stockage objet sont en place dès l'étape 1 et ne changent plus ensuite : l'archive ne déménage jamais.","Contact":"Contact","Controle op volledigheid":"Contrôle d'exhaustivité","Copyright":"Droits d'auteur","Dan":"Alors","Dank je wel, Fatima":"Merci beaucoup, Fatima","Database":"Base de données","Datum":"Date","De API van ELSA, CardDAV, opzoeken in het register en via de Zaken API.":"L'API d'ELSA, CardDAV, la consultation du registre et l'API Zaken.","De EML komt één keer in de objectopslag. Het object verandert daarna nooit meer.":"L'EML est déposé une seule fois dans le stockage objet. L'objet ne change plus jamais ensuite.","De IMAP-server bewaart zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Le serveur IMAP conserve ses messages comme fichiers dans Nextcloud Files, via WebDAV.","De IMAP-server heeft een eigen opslagkoppeling nodig.":"Le serveur IMAP a besoin de son propre connecteur de stockage.","De IMAP-server kent de UID en de map, en haalt de inhoud bij de opslag.":"Le serveur IMAP connaît l'UID et le dossier, et récupère le contenu dans le stockage.","De IMAP-server leest de inhoud uit de XENA-objectopslag, via het register. Bij Apache James is dat een eigen BlobStore.":"Le serveur IMAP lit le contenu dans le stockage objet de XENA, via le registre. Avec Apache James, c'est un BlobStore propre.","De IMAP-server leest en schrijft zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Le serveur IMAP lit et écrit ses messages comme fichiers dans Nextcloud Files, via WebDAV.","De IMAP-server met de opslagkoppeling, afleveren vanuit NiFi, de toets op filters.":"Le serveur IMAP avec le connecteur de stockage, la remise depuis NiFi, le contrôle des filtres.","De IMAP-server met de opslagkoppeling, de melding vanuit het register, de toets op filters.":"Le serveur IMAP avec le connecteur de stockage, le signalement depuis le registre, le contrôle des filtres.","De IMAP-server schrijft in Nextcloud":"Le serveur IMAP écrit dans Nextcloud","De IMAP-server werkt via Nextcloud":"Le serveur IMAP passe par Nextcloud","De Woo-coördinator zoekt via SharePoint of Teams, of in Files.":"Le coordinateur Woo recherche via SharePoint ou Teams, ou dans Files.","De architectuurvisie waarop deze demo is gebaseerd":"La vision d'architecture sur laquelle repose cette démo","De assistent is een uitbreiding van het mailprogramma. Hij praat rechtstreeks met ELSA en werkt naast IMAP, niet in plaats daarvan.":"L'assistant est une extension du logiciel de messagerie. Il communique directement avec ELSA et fonctionne à côté d'IMAP, pas à sa place.","De brug leest het bericht uit Kafka en kijkt in het register of de Message-ID er al is. Een verzonden bericht komt zo maar één keer binnen.":"La passerelle lit le message dans Kafka et vérifie dans le registre si le Message-ID existe déjà. Un message envoyé n'entre ainsi qu'une seule fois.","De brug pakt het bericht uit: de EML, en elke bijlage als eigen object.":"La passerelle décompose le message : l'EML, et chaque pièce jointe comme objet distinct.","De brug schrijft het bericht en de bijlagen weg zoals een medewerker een bestand opslaat. Vanaf hier loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"La passerelle écrit le message et les pièces jointes comme un agent enregistre un fichier. À partir d'ici, un message suit le même chemin qu'un fichier sur un lecteur réseau.","De brug schrijft ze in Nextcloud, langs dezelfde weg als een bestand op een netwerkschijf. Nextcloud maakt eerst het record in het register aan.":"La passerelle les écrit dans Nextcloud, par le même chemin qu'un fichier sur un lecteur réseau. Nextcloud crée d'abord l'enregistrement dans le registre.","De hele gemeente":"Toute la commune","De mailstroom loopt door Nextcloud. Een piek mag de medewerker in Files niet raken. Stap 1 is ook de proef daarop.":"Le flux de courrier passe par Nextcloud. Un pic ne doit pas toucher l'agent dans Files. L'étape 1 sert aussi de test à cet égard.","De mappen staan in ELSA. Het mailprogramma ziet ze via IMAP.":"Les dossiers se trouvent dans ELSA. Le logiciel de messagerie les voit via IMAP.","De medewerker kiest Persoonlijk in het paneel, of sleept het bericht naar de map Persoonlijk.":"L'agent choisit Personnel dans le volet, ou fait glisser le message dans le dossier Personnel.","De medewerker opent in Files de map E-mail, en daarin een dossier of een maand.":"L'agent ouvre dans Files le dossier E-mail, puis un dossier de procédure ou un mois.","De nieuwe Outlook en Outlook op het web laden webinvoegtoepassingen alleen bij een Microsoft-account, en COM-invoegtoepassingen werken daar niet. Wat dan wel werkt:":"Le nouvel Outlook et Outlook sur le web ne chargent les compléments web que pour un compte Microsoft, et les compléments COM n'y fonctionnent pas. Ce qui fonctionne :","De nieuwe Outlook heeft geen paneel. Hoe langer Outlook (klassiek) blijft, hoe beter; daarna blijven Thunderbird en de webmail van ELSA.":"Le nouvel Outlook n'a pas de volet. Plus Outlook (classique) reste longtemps, mieux c'est ; ensuite restent Thunderbird et le webmail d'ELSA.","De opslag levert de EML. Is het bericht persoonlijk, dan ontsleutelt de IMAP-server het met de sleutel van de gebruiker, die pas na aanmelding vrijkomt.":"Le stockage fournit l'EML. Si le message est personnel, le serveur IMAP le déchiffre avec la clé de l'utilisateur, libérée seulement après connexion.","De opslag van de e-mailarchivering komt in de nieuwe Nextcloud-stack. Nextcloud Files biedt WebDAV, geen IMAP. Er komt dus een IMAP-server naast. De vraag is waar de berichten dan staan.":"Le stockage de l'archivage des e-mails rejoint la nouvelle pile Nextcloud. Nextcloud Files offre WebDAV, pas IMAP. Un serveur IMAP vient donc s'y ajouter. La question est de savoir où se trouvent alors les messages.","De orchestrator pakt het EML-bestand uit: kop, tekst en bijlagen.":"L'orchestrateur décompose le fichier EML : en-tête, texte et pièces jointes.","De persoonlijke sleutel komt pas vrij na aanmelding, alleen voor de sessie van de eigenaar.":"La clé personnelle n'est libérée qu'après connexion, uniquement pour la session de son titulaire.","De postbus in het mailprogramma":"La boîte aux lettres dans le logiciel de messagerie","De prijs: een piek in de mailstroom komt bij Nextcloud terecht. Daarom draaien de achtergrondtaken op eigen servers, los van die voor de medewerkers. En wat NiFi per bericht zou vastleggen, controleert ELSA nu zelf.":"Le prix : un pic du flux de courrier retombe sur Nextcloud. C'est pourquoi les tâches de fond tournent sur leurs propres serveurs, séparés de ceux des agents. Et ce que NiFi consignerait pour chaque message, ELSA le contrôle désormais lui-même.","De sleutelkluis met vrijgave per sessie, de procedure van de gemeentesecretaris, de koppeling met de Woo-dossiers in XENA.":"Le coffre-fort de clés avec libération par session, la procédure du secrétaire général, le lien avec les dossiers Woo dans XENA.","De tekst gaat naar de zoekindex. Bijlagen worden eigen objecten, verbonden met het bericht.":"Le texte part dans l'index de recherche. Les pièces jointes deviennent des objets distincts, liés au message.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"L'accès ne vaut que pour la période indiquée et expire automatiquement. Chaque ouverture d'un message avec cette clé est consignée.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"Le mode opératoire redevances 2026 a été adopté. Vous le trouverez dans le dossier de travail de l'équipe.","De zaak komt uit het zaaksysteem, dat leidend blijft. ELSA legt alleen de koppeling vast, als kenmerk.":"La procédure vient du système de gestion des procédures, qui reste la référence. ELSA n'enregistre que le lien, comme attribut.","De zoekindex van ELSA geeft alleen zakelijke berichten. Vertrouwelijke berichten alleen aan wie daar recht op heeft.":"L'index de recherche d'ELSA ne renvoie que les messages professionnels. Les messages confidentiels, seulement à ceux qui y ont droit.","De zoekindex volgt het register. Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"L'index de recherche suit le registre. Objet, texte et pièces jointes deviennent consultables, uniquement pour ceux qui y ont accès.","Deel I legt de asynchrone verwerking in ADR-0005 bij NiFi, los van de laag die gebruikers bedient.":"Dans l'ADR-0005, la Partie I confie le traitement asynchrone à NiFi, séparément de la couche qui sert les utilisateurs.","Delegeren aan de concerncontroller":"Déléguer au contrôleur de gestion","Demo":"Démo","Demo: {0} dagen later":"Démo : {0} jours plus tard","Deze map is leeg.":"Ce dossier est vide.","Dezelfde taal en dezelfde bouwstenen als de rest van XENA, een ruime licentie en een opslaglaag die bedoeld is om te vervangen. Het risico zit in Sieve: ManageSieve staat in de documentatie nog als experimenteel, en ELSA leunt op filters.":"Le même langage et les mêmes briques que le reste de XENA, une licence permissive et une couche de stockage conçue pour être remplacée. Le risque est dans Sieve : ManageSieve figure encore comme expérimental dans la documentation, et ELSA repose sur les filtres.","Dit bericht":"Ce message","Dit bericht is automatisch verstuurd.":"Ce message a été envoyé automatiquement.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"Ce message est enregistré avec votre clé personnelle. Dans le stockage, il est illisible, même pour les administrateurs.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"Ce message peut être aussi bien professionnel que personnel.","Dit is je eigen vermelding. Aanpassen doe je onder Mijn vermelding.":"C'est votre propre fiche. Vous la modifiez sous Ma fiche.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"Si vous ne faites rien, le message est considéré comme professionnel au bout de dix jours. Personnel signifie : déplacé dans le dossier Personnel, chiffré avec votre propre clé et exclu du périmètre de recherche Woo.","Doorstroom":"Parcours","Doorstroom van een bericht":"Parcours d'un message","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Le transfert n'est autorisé que vers une adresse d'une commune participante.","Dossier of zaak":"Dossier ou affaire","Dossiers":"Dossiers","Dossiersleutels en persoonlijke sleutels":"Clés de dossier et clés personnelles","Dubbele berichten":"Messages en double","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"Archiver les e-mails dans XENA : chaque message dans le registre, lu tout simplement dans votre propre logiciel de messagerie.","E-mailadres":"Adresse e-mail","E-mailarchivering binnen XENA":"Archivage des e-mails dans XENA","ELSA bij dit bericht":"ELSA pour ce message","ELSA registreert geen zaken. Het zaaksysteem blijft leidend; ELSA legt de koppeling vast als kenmerk, via de Zaken API.":"ELSA n'enregistre pas de procédures. Le système des procédures reste la référence ; ELSA consigne le lien comme attribut, via l'API Zaken.","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA passe les messages non triés en professionnel au bout de dix jours","EXPUNGE haalt het bericht uit de map van de medewerker. Het object blijft, zolang de bewaartermijn loopt.":"EXPUNGE retire le message du dossier de l'agent. L'objet demeure tant que court la durée de conservation.","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"Un annuaire des agents des communes participantes. Chacun décide s'il y figure et avec quelles informations. Chaque commune gère sa propre partie et la partage via CardDAV.","Een bericht kan in meer dossiers zitten. Het dossier verwijst naar het bericht; er wordt niets gekopieerd.":"Un message peut figurer dans plusieurs dossiers. Le dossier renvoie au message ; rien n'est copié.","Een bericht komt binnen":"Un message arrive","Een bericht van een winkel over iets privés.":"Un message d'un magasin sur une affaire privée.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"Un récapitulatif quotidien d'ELSA avec les messages qui restent à trier.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Une démo, pas un produit. Toutes les données d'exemple sont inventées : personnes, adresses, dossiers et numéros de procédure n'existent pas. La démo montre ce que l'architecture rend possible ; une partie des fonctions relève de la vision d'avenir.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"Un filtre ne peut pas déplacer vers Personnel. C'est vous qui décidez, message par message, si un message est personnel.","Een gewone IMAP-server met eigen opslag op schijf, en daarnaast een kopie van elk bericht in Nextcloud.":"Un serveur IMAP ordinaire avec son propre stockage sur disque, et en plus une copie de chaque message dans Nextcloud.","Een kleine dienst leest het bericht uit Kafka, kijkt in het register of de Message-ID er al is en pakt het uit: kop, tekst en bijlagen.":"Un petit service lit le message dans Kafka, vérifie dans le registre si le Message-ID existe déjà et le décompose : en-tête, texte et pièces jointes.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"Un logiciel de messagerie s'attend à ce que la suppression réussisse. ELSA retire le message du dossier, mais l'objet reste conservé tant que court la durée de conservation.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"Une lettre d'information : professionnelle, avec une durée de conservation courte.","Een opvolger voor agenda en vrij/bezet, en mailprogramma's die daarmee overweg kunnen.":"Un successeur pour l'agenda et les disponibilités, et des logiciels de messagerie compatibles.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"Un message personnel reste personnel. Si vous le jugez finalement professionnel, choisissez d'abord Professionnel dans ELSA.","Een postbus is iets anders dan een archief. Medewerkers verwachten snelheid, zoeken in de eigen mappen en offline werken. De proefgroep in stap 2 moet dat toetsen voordat iedereen overgaat.":"Une boîte aux lettres n'est pas une archive. Les agents attendent de la rapidité, la recherche dans leurs propres dossiers et le travail hors ligne. Le groupe pilote de l'étape 2 doit le vérifier avant que tout le monde bascule.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"Une règle de transport transfère chaque message, entrant et sortant, au format EML vers Kafka.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"Un message envoyé arrive deux fois : via la règle de transport et comme copie depuis le logiciel de messagerie. ELSA dédoublonne sur le Message-ID.","Een zaaksysteem dat op omschrijving kan zoeken, of een eigen index van zaken.":"Un système des procédures capable de chercher sur la description, ou un index propre des procédures.","Eerst, naast de bestaande postbus":"D'abord, à côté de la boîte aux lettres existante","Eerste kandidaat: Apache James.":"Premier candidat : Apache James.","Eigen opslag aankoppelen":"Brancher son propre stockage","Elk bericht als EML door, zonder kopie":"Chaque message transféré en EML, sans copie","Elk bericht als EML · bekijk de stappen":"Chaque message en EML · voir les étapes","Elk bericht gaat via Exchange Online en Kafka naar een kleine brug, die het in Nextcloud wegschrijft. Daarna loopt het langs dezelfde weg als een bestand op een netwerkschijf. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Chaque message passe par Exchange Online et Kafka jusqu'à une petite passerelle, qui l'écrit dans Nextcloud. Ensuite, il suit le même chemin qu'un fichier sur un lecteur réseau. En moins d'une seconde, il figure dans le registre, dans le stockage objet et dans l'index de recherche. Aucune copie ne reste dans Exchange.","Elk bericht gaat via Exchange Online, Kafka en de orchestrator naar ELSA. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Chaque message passe par Exchange Online, Kafka et l'orchestrateur pour arriver dans ELSA. En moins d'une seconde, il figure dans le registre, dans le stockage objet et dans l'index de recherche. Aucune copie ne reste dans Exchange.","Elke IMAP-handeling wordt een WebDAV-aanroep: traag bij grote postbussen.":"Chaque opération IMAP devient un appel WebDAV : lent pour les grandes boîtes aux lettres.","Elke IMAP-server kan het, ook Dovecot zonder aanpassing.":"Tout serveur IMAP en est capable, y compris Dovecot sans modification.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Chaque pièce jointe est un objet distinct dans le stockage, relié au message. Une pièce jointe peut ainsi être retrouvée, conservée et publiée séparément.","Elke dag: alles wat in Kafka stond, staat ook in het register. Dat vervangt de herkomstregistratie die NiFi zou bieden.":"Chaque jour : tout ce qui était dans Kafka figure aussi dans le registre. Cela remplace la traçabilité de provenance qu'offrirait NiFi.","Elke ingang doet waar hij goed in is: IMAP voor de postbus, WebDAV voor het dossier.":"Chaque point d'accès fait ce qu'il fait de mieux : IMAP pour la boîte aux lettres, WebDAV pour le dossier.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"Une nouvelle demande a été déposée pour l'adresse Kleverlaan 14. La demande et les plans sont joints.","Er is één exemplaar van elk bericht. De ingangen verwijzen ernaar; geen ervan houdt een eigen kopie.":"Il existe un seul exemplaire de chaque message. Les points d'accès y renvoient ; aucun n'en garde sa propre copie.","Er is één exemplaar van elk bericht. Metagegevens, bewaartermijn en zoekindex gaan zoals bij de netwerkschijven, via het register en de apps rond Nextcloud. Er is geen aparte orchestrator.":"Il existe un seul exemplaire de chaque message. Métadonnées, durée de conservation et index de recherche fonctionnent comme pour les lecteurs réseau, via le registre et les applis autour de Nextcloud. Il n'y a pas d'orchestrateur distinct.","Evenementen":"Manifestations","Evenementenbeleid kustgemeenten":"Politique événementielle des communes côtières","Evenementenvergunning":"Autorisation de manifestation","Evenementenvergunning circuit 2027":"Autorisation de manifestation circuit 2027","Exchange Online":"Exchange Online","Exchange Online ontvangt het bericht via SMTP. Een transport rule stuurt het als EML door naar Kafka en laat geen kopie achter in de postbus.":"Exchange Online reçoit le message via SMTP. Une règle de transport le transfère au format EML vers Kafka et ne laisse aucune copie dans la boîte aux lettres.","Exchange Online verzendt en ontvangt; ELSA bewaart. Alles na de aanvoer staat in de Nextcloud-stack van XENA. Zo kan de mailprovider later worden vervangen zonder dat het archief verhuist.":"Exchange Online envoie et reçoit ; ELSA conserve. Tout ce qui suit l'alimentation se trouve dans la pile Nextcloud de XENA. Le fournisseur de messagerie peut ainsi être remplacé plus tard sans que l'archive déménage.","Extensie of COM-invoegtoepassing, via de API van ELSA":"Extension ou complément COM, via l'API d'ELSA","Eén EML per bericht, onveranderlijk, met bewaarvergrendeling":"Un EML par message, immuable, avec verrouillage de conservation","Eén bericht, drie plekken die ernaar kijken":"Un message, trois endroits qui le consultent","Eén exemplaar, onveranderlijk, met bewaarvergrendeling.":"Un seul exemplaire, immuable, avec verrouillage de conservation.","Eén keer verwerken · bekijk de stappen":"Traité une seule fois · voir les étapes","Eén keer wegschrijven · bekijk de stappen":"Écrit une seule fois · voir les étapes","Eén object in de opslag, twee ingangen":"Un objet dans le stockage, deux points d'accès","Eén object in de opslag, twee ingangen: IMAP en WebDAV":"Un objet dans le stockage, deux points d'accès : IMAP et WebDAV","Eén opslag, die Nextcloud beheert.":"Un seul stockage, géré par Nextcloud.","Favoriet":"Favori","Favorieten":"Favoris","Files toont een virtuele map. De inhoud komt uit het register, niet uit een eigen kopie (PROPFIND).":"Files affiche un dossier virtuel. Le contenu vient du registre, pas d'une copie propre (PROPFIND).","Filter toegevoegd.":"Filtre ajouté.","Filter toevoegen":"Ajouter un filtre","Filters":"Filtres","Filters (Sieve)":"Filtres (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Les filtres s'exécutent dans ELSA même, au moment où un message arrive. Ils fonctionnent donc dans tous les logiciels de messagerie et sur tous les appareils. Certaines actions ne sont pas autorisées, car elles contourneraient la séparation entre professionnel et personnel.","Filters van de medewerker":"Filtres de l'agent","Foto's van de vakantie":"Photos des vacances","Functie":"Fonction","Geachte aanvrager,":"Madame, Monsieur,","Gedelegeerd":"Délégué","Geen":"Aucun","Geen NiFi: een bewuste afwijking van XENA Deel I":"Pas de NiFi : un écart délibéré par rapport à XENA Partie I","Geen assistent in Outlook":"Pas d'assistant dans Outlook","Geen assistent in de nieuwe Outlook":"Pas d'assistant dans le nouvel Outlook","Geen dossier gevonden.":"Aucun dossier trouvé.","Geen eigen IMAP-server: alleen de koppelingen eromheen.":"Pas de serveur IMAP propre : seulement les connecteurs autour.","Geen kopie meer in Exchange, voor de proefgroep":"Plus de copie dans Exchange, pour le groupe pilote","Geen zaak gevonden. Zaken komen uit het zaaksysteem; een nieuwe zaak maak je daar aan.":"Aucune procédure trouvée. Les procédures viennent du système des procédures ; c'est là qu'on en crée une nouvelle.","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Données à la source : le message existe une fois, et qui en a besoin y renvoie.","Gekoppeld aan een zaak":"Lié à une procédure","Gekoppeld aan zaak {0}.":"Lié à la procédure {0}.","Gelezen, vlag en label staan alleen in de IMAP-server. Leesstatus is geen archiefgegeven en komt niet in het register.":"Lu, drapeau et étiquette ne sont que dans le serveur IMAP. L'état de lecture n'est pas une donnée d'archive et n'entre pas dans le registre.","Gelezen, vlag, label":"Lu, drapeau, étiquette","Gemaakt door":"Réalisé par","Gemeente":"Commune","Gemeente Bloemendaal":"Commune de Bloemendaal","Gemeente Haarlem":"Commune de Haarlem","Gemeente Heemstede":"Commune de Heemstede","Gemeente Velsen":"Commune de Velsen","Gemeente Zandvoort":"Commune de Zandvoort","Gemeentelijk adresboek":"Annuaire intercommunal","Gemeentesecretaris":"Secrétaire général","Gevonden":"Trouvés","Gevonden berichten gaan per verwijzing naar het Woo-dossier in XENA. Er wordt niets gekopieerd.":"Les messages trouvés sont ajoutés par référence au dossier Woo dans XENA. Rien n'est copié.","Geweigerd":"Refusé","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Bonne nouvelle : la réparation est terminée. Vous pouvez venir chercher votre vélo jusqu'à 18h00.","Gooi weg":"Jeter","Groeipad":"Trajectoire","Groet, Lotte Visser":"Cordialement, Lotte Visser","Groet, Noor":"Bien à toi, Noor","Haal mij uit het adresboek":"Me retirer de l'annuaire","Handeling":"Opération","Help":"Aide","Herinrichting Houtplein":"Réaménagement du Houtplein","Het Common Ground-team en het samenwerkingsverband OWC":"L'équipe Common Ground et le partenariat OWC","Het EML-bestand en de bijlagen gaan de objectopslag in, met versiebeheer.":"Le fichier EML et les pièces jointes entrent dans le stockage objet, avec gestion des versions.","Het Woo-dossier is in Files een map met dezelfde berichten. Na beoordeling gaat de openbare versie naar TINA.":"Dans Files, le dossier Woo est un répertoire contenant les mêmes messages. Après examen, la version publique part vers TINA.","Het adresboek staat ook in het paneel van de assistent.":"Le carnet d'adresses figure aussi dans le volet de l'assistant.","Het bericht en elke bijlage krijgen een eigen identificatie. De metagegevens worden vastgelegd; de aard is nog open.":"Le message et chaque pièce jointe reçoivent leur propre identifiant. Les métadonnées sont consignées ; la nature reste à déterminer.","Het bericht gaat via Exchange Online de deur uit en komt via de transport rule terug in ELSA, onder Verzonden items.":"Le message part via Exchange Online et revient dans ELSA via la règle de transport, sous Éléments envoyés.","Het bericht komt binnen bij de mailprovider. Een transport rule stuurt het als EML door en houdt geen kopie.":"Le message arrive chez le fournisseur de messagerie. Une règle de transport le transfère au format EML et n'en garde aucune copie.","Het bericht komt op een wachtrij. Zo gaat er niets verloren als een volgende stap even niet bereikbaar is.":"Le message est placé dans une file d'attente. Ainsi, rien ne se perd si une étape suivante est momentanément indisponible.","Het bericht staat in Postvak IN. Het mailprogramma ziet het bij de volgende synchronisatie.":"Le message se trouve dans la Boîte de réception. Le logiciel de messagerie le voit à la prochaine synchronisation.","Het bericht staat één keer in de objectopslag van XENA, beschreven in het register. De IMAP-server en Nextcloud Files verwijzen er allebei naar.":"Le message est stocké une seule fois dans le stockage objet de XENA, décrit dans le registre. Le serveur IMAP et Nextcloud Files y renvoient tous deux.","Het bericht verdwijnt uit de virtuele mappen in Files, en de tekst uit de zoekindex.":"Le message disparaît des dossiers virtuels de Files, et son texte de l'index de recherche.","Het bericht wordt één keer via Nextcloud weggeschreven, zoals een bestand, en staat dan in de objectopslag, beschreven in het register. De IMAP-server leest het via het register uit de opslag; Files toont het.":"Le message est écrit une seule fois via Nextcloud, comme un fichier, puis se trouve dans le stockage objet, décrit dans le registre. Le serveur IMAP le lit dans le stockage via le registre ; Files l'affiche.","Het bericht zelf, zoals het wordt bewaard":"Le message lui-même, tel qu'il est conservé","Het enige onderdeel dat er voor de mail bij komt. Daarna loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"Le seul composant ajouté pour le courrier. Ensuite, un message suit le même chemin qu'un fichier sur un lecteur réseau.","Het gemeentelijk adresboek":"L'annuaire intercommunal","Het gemeentelijk adresboek gebruiken in de webmail van ELSA. De nieuwe Outlook kent geen CardDAV.":"Utiliser le carnet d'adresses communal dans le webmail d'ELSA. Le nouvel Outlook ne prend pas en charge CardDAV.","Het gesprek over archiveren van e-mail aan de bron, zonder kopie bij de leverancier van de mailserver":"La réflexion sur l'archivage des e-mails à la source, sans copie chez le fournisseur du serveur de messagerie","Het mailprogramma haalt berichten op via IMAP4. Inzien, verplaatsen en versleutelen gaan via ELSA; filters draaien als Sieve.":"Le logiciel de messagerie récupère les messages via IMAP4. La consultation, le déplacement et le chiffrement passent par ELSA ; les filtres s'exécutent en Sieve.","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Filters als Sieve.":"Le logiciel de messagerie récupère le courrier dans ELSA via IMAP. Tri sous dix jours. Filtres en Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Le logiciel de messagerie peut aussi gérer lui-même les filtres via ManageSieve. ELSA vérifie chaque script avant de l'enregistrer.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"Le logiciel de messagerie envoie un nouveau message via SMTP à Exchange Online.","Het meest compleet uit de doos, met CardDAV voor het adresboek erbij. Maar een eigen opslagkoppeling betekent werken in de code van één bedrijf, en een deel van de functies zit in de betaalde editie.":"Le plus complet clé en main, avec CardDAV pour l'annuaire en prime. Mais un connecteur de stockage propre implique de travailler dans le code d'une seule entreprise, et une partie des fonctions est réservée à l'édition payante.","Het object wordt opnieuw opgeslagen, versleuteld met de persoonlijke sleutel. De onversleutelde versie vervalt. Dat kan, omdat de bewaarvergrendeling pas ingaat als een bericht zakelijk is.":"L'objet est enregistré à nouveau, chiffré avec la clé personnelle. La version non chiffrée est supprimée. C'est possible parce que le verrouillage de conservation ne s'applique qu'une fois le message professionnel.","Het onderwerp noemt een lopend Woo-verzoek.":"L'objet mentionne une demande Woo en cours.","Het paneel in Thunderbird en Outlook (klassiek): scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"Le volet dans Thunderbird et Outlook (classique) : trier, compléter, lier à une procédure et à un dossier. L'annuaire intercommunal.","Het register geeft de berichten en de rechten. Alleen zakelijke berichten waar de medewerker bij mag. Persoonlijke berichten staan er nooit in.":"Le registre fournit les messages et les droits. Seulement les messages professionnels auxquels l'agent a accès. Les messages personnels n'y figurent jamais.","Het register legt de aard persoonlijk vast, met wie en wanneer. Het bericht valt buiten het zoekbereik voor de Woo.":"Le registre consigne la nature personnelle, par qui et quand. Le message sort du périmètre de recherche pour la Woo.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd.":"Le registre consigne le message : Message-ID, expéditeur, destinataires, date et la nature « à trier », avec dix jours de réflexion.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd. De zoekindex volgt het register.":"Le registre consigne le message : Message-ID, expéditeur, destinataires, date et la nature « à trier », avec dix jours de réflexion. L'index de recherche suit le registre.","Het register meldt elk nieuw bericht aan de IMAP-server, die het in de juiste map zet met een verwijzing naar het object.":"Le registre signale chaque nouveau message au serveur IMAP, qui le place dans le bon dossier avec un renvoi vers l'objet.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"Le registre signale le nouveau message au serveur IMAP. Celui-ci ne conserve pas de seconde copie : il renvoie vers l'objet et ne gère que l'UID, le dossier et les drapeaux.","Het register meldt het nieuwe bericht aan de IMAP-server. Die zet het in Postvak IN, met een verwijzing naar het object.":"Le registre signale le nouveau message au serveur IMAP. Celui-ci le place dans la Boîte de réception, avec un renvoi vers l'objet.","Hetzelfde bericht in Nextcloud Files":"Le même message dans Nextcloud Files","Hier zijn de foto's.":"Voici les photos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Voici le projet de plan de projet. Peux-tu regarder surtout le paragraphe sur les autorisations de terrasses ?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Coucou San, c'est toi qui apportes le gâteau samedi ? Mamie compte sur toi. Bisous, Ellen","Hoi Sanne,":"Bonjour Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP MOVE naar Persoonlijk. De IMAP-server meldt de keuze aan ELSA.":"IMAP MOVE vers Personnel. Le serveur IMAP signale le choix à ELSA.","IMAP en LMTP; SMTP via Postfix":"IMAP et LMTP ; SMTP via Postfix","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP ne concerne que la messagerie. L'agenda reste pour l'instant dans Exchange ; l'annuaire passe par CardDAV.","IMAP naast WebDAV":"IMAP à côté de WebDAV","IMAP, SMTP, LMTP":"IMAP, SMTP, LMTP","IMAP-server":"Serveur IMAP","IMAP-server naast Nextcloud Files, op dezelfde objectopslag":"Serveur IMAP à côté de Nextcloud Files, sur le même stockage objet","IMAP4 en ManageSieve: mappen, vlaggen en filters per gebruiker":"IMAP4 et ManageSieve : dossiers, drapeaux et filtres par utilisateur","IMAP4 en Sieve":"IMAP4 et Sieve","IMAP4rev2":"IMAP4rev2","Iedereen over, en andere gemeenten in het adresboek":"Tout le monde bascule, et d'autres communes dans l'annuaire","Ik ben afwezig tot maandag.":"Je suis absent jusqu'à lundi.","In behandeling":"En cours","In de Nextcloud-stack doen het register en de apps rond Nextcloud dat werk al voor de netwerkschijven. ELSA volgt de netwerkschijven: minder onderdelen, één beheerteam, en mail en bestanden langs dezelfde weg.":"Dans la pile Nextcloud, le registre et les applis autour de Nextcloud font déjà ce travail pour les lecteurs réseau. ELSA suit les lecteurs réseau : moins de composants, une seule équipe d'exploitation, et courrier et fichiers par le même chemin.","In de browser of de bureaubladapp, via WebDAV":"Dans le navigateur ou l'application de bureau, via WebDAV","In de schets staat GreenMail. Dat is een testserver. Voor productie ligt een volwaardige IMAP-server met Sieve voor de hand, bijvoorbeeld Dovecot met Pigeonhole.":"Le schéma mentionne GreenMail. C'est un serveur de test. Pour la production, un serveur IMAP complet avec Sieve s'impose, par exemple Dovecot avec Pigeonhole.","In deze nieuwsbrief: de nieuwe handreiking voor actieve openbaarmaking, een webinar over de Omgevingswet en het laatste nieuws uit de regio.":"Dans cette lettre d'information : le nouveau guide sur la publication active, un webinaire sur l'Omgevingswet et les dernières nouvelles de la région.","In het echte systeem opent hier de webmail van ELSA, met hetzelfde paneel.":"Dans le vrai système, le webmail ELSA s'ouvre ici, avec le même panneau.","In het paneel: zoeken, een bericht beginnen en je eigen vermelding beheren, in elk mailprogramma met de assistent.":"Dans le volet : rechercher, commencer un message et gérer votre fiche, dans chaque logiciel de messagerie avec l'assistant.","In stap 1 staat de mail nog in Exchange. Dat is een tussenstap, geen eindbeeld: hij is er om te leren zonder dat iemand anders hoeft te werken.":"À l'étape 1, le courrier est encore dans Exchange. C'est une étape intermédiaire, pas la cible : elle sert à apprendre sans que quiconque change sa façon de travailler.","In vijf stappen, waarvan vier zonder de markt":"En cinq étapes, dont quatre sans le marché","Informatiebeheer":"Gestion de l'information","Informatiebeheerder":"Gestionnaire de l'information","Inhoud (EML)":"Contenu (EML)","Interactieve demo, versie {0}":"Démo interactive, version {0}","Intergemeentelijke samenwerking":"Coopération intercommunale","Intern":"Interne","Interne bedrijfsvoering":"Fonctionnement interne","Internet Message Format (EML)":"Internet Message Format (EML)","Is dit bericht zakelijk of persoonlijk?":"Ce message est-il professionnel ou personnel ?","JMAP":"JMAP","Java (vanaf 3.9 Java 21)":"Java (Java 21 à partir de 3.9)","Java-interface in een modulair ontwerp":"Interface Java dans une conception modulaire","Je fiets is klaar om op te halen":"Votre vélo est prêt","Je kunt je vermelding altijd aanpassen of intrekken. De wijziging gaat via CardDAV naar de andere gemeenten.":"Vous pouvez à tout moment modifier ou retirer votre fiche. La modification est transmise aux autres communes via CardDAV.","Je staat in het adresboek":"Vous figurez dans l'annuaire","Je staat in het gemeentelijk adresboek.":"Vous figurez dans l'annuaire intercommunal.","Je staat niet in het adresboek":"Vous n'êtes pas dans le carnet d'adresses","Je staat nog niet in het adresboek. Collega's van andere gemeenten kunnen je dan niet vinden.":"Vous ne figurez pas encore dans l'annuaire. Les collègues d'autres communes ne peuvent donc pas vous trouver.","Je vermelding is ingetrokken.":"Votre fiche a été retirée.","Juridische Zaken":"Affaires juridiques","Kafka":"Kafka","Kapvergunning Houtplein":"Permis d'abattage Houtplein","Kies":"Choisir","Kies een bericht.":"Choisissez un message.","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Choisissez une opération. Les étapes montrent quel composant fait quoi.","Kopieer adres":"Copier l'adresse","Koppelen aan een zaak; het zaaksysteem blijft leidend":"Lier à une procédure ; le système des procédures reste la référence","Label van ELSA, als IMAP-trefwoord":"Étiquette ELSA, sous forme de mot-clé IMAP","Labels uit het register":"Étiquettes issues du registre","Later":"Plus tard","Later: een moderne opvolger van IMAP voor webmail en apps":"Plus tard : un successeur moderne d'IMAP pour le webmail et les applis","Leest elk bericht uit Kafka, kijkt in het register of de Message-ID er al is, pakt het uit en schrijft de EML en de bijlagen in Nextcloud. Klein, zonder eigen opslag.":"Lit chaque message dans Kafka, vérifie dans le registre si le Message-ID existe déjà, le décompose et écrit l'EML et les pièces jointes dans Nextcloud. Petit, sans stockage propre.","Legesverordening 2026":"Règlement des redevances 2026","Lezen in het mailprogramma":"Lire dans le logiciel de messagerie","Licentie":"Licence","Liever niet":"Plutôt pas","Logboek":"Journal","Lunch vrijdag?":"Déjeuner vendredi ?","MIT en LGPL 2.1":"MIT et LGPL 2.1","Mail en bestanden lopen langs dezelfde weg, met dezelfde regels.":"Courrier et fichiers suivent le même chemin, avec les mêmes règles.","Mailprogramma":"Logiciel de messagerie","Mailprovider vervangen zonder dat het archief verhuist":"Remplacer le fournisseur de messagerie sans que l'archive
