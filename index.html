<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="generator" content="ELSA (e-mailarchief), demo versie 7, 13-10-2026">
<title>ELSA</title>
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: demokader met tabbladen; in Postbus een mailprogramma in drie kolommen dat via IMAP uit ELSA leest, met de assistent boven het bericht. Vormtaal gelijk aan XENA, MIRA en TINA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5; --blue:#2c5c9c; --blue-soft:#e1eaf7;
  --app:#0f6cbd; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1360px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.regie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;font-size:12.5px;color:var(--muted)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .seg button{padding:3px 10px;font-size:12.5px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.page{padding:20px 22px 26px;display:grid;gap:16px}
.page h2{font-size:19px;font-weight:600;text-wrap:balance}
.lead{max-width:72ch;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.n-amber{background:var(--amber-soft);color:var(--amber)} .n-violet{background:var(--violet-soft);color:var(--violet)} .n-green{background:var(--green-soft);color:var(--green)} .n-grey{background:var(--surface2);color:var(--fg)} .n-red{background:var(--red-soft);color:var(--red)}
.note span{color:var(--fg)} .note svg{margin-top:2px}

/* mailprogramma */
.mc-top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--app);color:#fff;font-size:12.5px;flex-wrap:wrap}
.mc-top b{font-weight:600}.mc-top .acc{margin-left:auto;opacity:.92}
.mc-bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.tb{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;font-size:12.5px;color:var(--fg)}
.tb:hover:not(:disabled){background:var(--sel)} .tb:disabled{opacity:.45;cursor:default} .tb svg{color:var(--app)}
.mc-bar select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.mc-bar input[type=search]{flex:1 1 200px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mc{display:grid;grid-template-columns:190px 290px minmax(0,1fr) 340px;min-height:580px}.mc.nopane{grid-template-columns:190px 300px minmax(0,1fr)}
.tag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-violet{color:var(--violet)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ap{display:flex;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 30%,var(--surface));min-width:0;max-height:640px}
.ap.off{display:block;background:var(--surface2);overflow:auto}
.apm{flex:1;min-width:0;overflow:auto}
.aph{position:sticky;top:0;display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);z-index:1}
.aph h3{font-size:13.5px}.aph p{font-size:11.5px;color:var(--muted)}.aph svg{color:var(--accent)}
.apb{padding:12px 14px;display:grid;gap:10px;font-size:13px}.apb h3{font-size:14px}.apb h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px}.apb h4 b{color:var(--fg)}
.apl{display:grid;gap:4px}.apl button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.apl button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apl button:hover{border-color:var(--accent)}
.apl .gn{display:grid;gap:1px;text-align:left}.apl .gn small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apl .gs{color:var(--amber);flex:none}
.gchips{display:flex;flex-wrap:wrap;gap:4px}.gchips button{padding:2px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px}.gchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.gme{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gme svg{color:var(--accent);flex:none}.gme div{flex:1;min-width:0;display:grid}.gme span{font-size:12px;color:var(--muted)}.gme .btn{padding:4px 10px;font-size:12.5px}
.gback{justify-self:start;color:var(--accent);font-size:12.5px;padding:2px 0}.gback:hover{text-decoration:underline}
.gcard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gav{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.gcard h3{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.gcard p{font-size:12.5px;color:var(--muted)}
.gdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}.gdl dt{color:var(--muted)}.gdl dd{margin:0;overflow-wrap:anywhere}
.gact{display:flex;flex-wrap:wrap;gap:6px}.gact .btn{padding:5px 10px;font-size:12.5px}.gact [aria-pressed="true"] path{fill:currentColor}.gact [aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.gsh{display:grid;gap:6px}.gsh label{display:flex;gap:8px;align-items:center;font-size:13px}.gsh input{accent-color:var(--accent)}
.apr{width:44px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:2px;padding:6px 0}
.apr button{position:relative;height:38px;display:grid;place-items:center;color:var(--accent)}.apr button:hover{background:var(--surface)}
.apr button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.apr i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9.5px;font-weight:600;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 4px}
.ap .el{border:0;background:none;padding:12px 14px}.ap .meta{grid-template-columns:minmax(0,1fr)}.ap .el .q{flex-direction:column;align-items:stretch}.ap .el .q .btn{justify-content:center}
.fold{border-right:1px solid var(--line);padding:8px 0;background:var(--surface2);font-size:13px}
.fold h4{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 14px 4px;font-weight:600}
.fold button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px}
.fold button:hover{background:var(--sel)} .fold button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fold button span{flex:1;min-width:0} .fold button b{font-size:11.5px;font-weight:600;color:var(--app)}
.fold .gr{padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.list{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.mi{display:grid;gap:2px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left}
.mi:hover{background:var(--surface2)} .mi[aria-current="true"]{background:var(--sel);border-left-color:var(--app)}
.mi .r1{display:flex;gap:6px;align-items:baseline}.mi .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mi.read .r1 b{font-weight:500}
.mi .r1 time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mi .sj{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.empty{padding:30px 16px;color:var(--muted);text-align:center;font-size:13px}
.read-p{overflow:auto;max-height:640px;display:flex;flex-direction:column}
.el{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));padding:10px 16px;display:grid;gap:8px}
.el .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.el .h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.el .q{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.el .q strong{font-weight:600}
.el .sug{font-size:12.5px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fld{display:grid;gap:3px;font-size:12.5px}
.fld label{font-weight:500}
.fld select,.fld input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.fld .ro{padding:5px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.msg{padding:16px 18px 22px;display:grid;gap:10px}
.msg h2{font-size:18px;font-weight:600;text-wrap:balance}
.mh{display:grid;grid-template-columns:70px minmax(0,1fr);gap:3px 10px;font-size:13px}
.mh dt{color:var(--muted)} .mh dd{overflow-wrap:anywhere}
.body{font-family:var(--serif);font-size:14.5px;line-height:1.6;max-width:66ch;display:grid;gap:8px}
.enc{border:1px dashed var(--violet);border-radius:8px;padding:16px;color:var(--violet);display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--violet-soft)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11px}
.ref{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}

/* doorstroom */
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.stp .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;background:var(--surface)}
.stp.done .dot{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.stp.now .dot{border-color:var(--accent);color:var(--accent)}
.stp b{font-size:14px}.stp p{font-size:12.5px;color:var(--muted)}
.stp time{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.stp code{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;background:var(--surface2);border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}

/* filters */
.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.rule .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rule .r1 b{flex:1;min-width:0}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
pre.sv{margin:0;font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.rules{display:grid;gap:8px}
.lim{display:grid;gap:6px;font-size:13px}.lim li{display:flex;gap:8px;align-items:flex-start}

/* adresboek */
.ab{width:100%;border-collapse:collapse;font-size:13px}
.ab th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 10px;background:var(--surface2);white-space:nowrap}
.ab td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.ab td small{display:block;color:var(--muted);font-size:11.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.share{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.share label{display:flex;gap:8px;align-items:center;font-size:13px}
.share input{accent-color:var(--accent)}
.srch{display:flex;gap:8px;flex-wrap:wrap}.srch input{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* sleutels */
.req{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;justify-items:start}.req dl{justify-self:stretch}
.req dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:3px 10px;font-size:13px}.req dt{color:var(--muted)}
.log{display:grid;gap:4px;font-size:12.5px}.log li{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px}.log time{color:var(--muted);font-family:var(--mono);font-size:11.5px}

/* architectuur */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.zone>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.bx{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--blue-soft);display:grid;gap:2px}
.bx b{font-size:13.5px}.bx small{font-size:12px;color:var(--muted)}
.bx.u{background:var(--surface2)}
.flow{display:grid;gap:6px;font-size:13px}.flow li{display:flex;gap:10px;align-items:baseline}.flow li i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none;width:22px}
.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.open div{border-left:3px solid var(--amber);padding:2px 0 2px 12px;display:grid;gap:3px}.open b{font-size:14px}.open span{font-size:13px;color:var(--muted)}

.hood{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:6px 12px}
.hood b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex:none}
.hood code{flex:1 1 300px;min-width:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.foot{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:20;max-width:min(400px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(8,24,28,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:600px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:grid;gap:12px}
.dlg h2{font-size:16px}
/* colofon */

speicher stehen ab Schritt 1 und ändern sich danach nicht mehr: Das Archiv zieht nie um.","Contact":"Kontakt","Controle op volledigheid":"Vollständigkeitsprüfung","Copyright":"Urheberrecht","Dan":"Dann","Dank je wel, Fatima":"Vielen Dank, Fatima","Database":"Datenbank","Datum":"Datum","De API van ELSA, CardDAV, opzoeken in het register en via de Zaken API.":"Die API von ELSA, CardDAV, Nachschlagen im Register und über die Zaken API.","De EML komt één keer in de objectopslag. Het object verandert daarna nooit meer.":"Die EML kommt einmal in den Objektspeicher. Das Objekt ändert sich danach nie mehr.","De IMAP-server bewaart zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Der IMAP-Server speichert seine Nachrichten als Dateien in Nextcloud Files, über WebDAV.","De IMAP-server heeft een eigen opslagkoppeling nodig.":"Der IMAP-Server braucht eine eigene Speicheranbindung.","De IMAP-server kent de UID en de map, en haalt de inhoud bij de opslag.":"Der IMAP-Server kennt die UID und den Ordner und holt den Inhalt aus dem Speicher.","De IMAP-server leest de inhoud uit de XENA-objectopslag, via het register. Bij Apache James is dat een eigen BlobStore.":"Der IMAP-Server liest den Inhalt aus dem XENA-Objektspeicher, über das Register. Bei Apache James ist das ein eigener BlobStore.","De IMAP-server leest en schrijft zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Der IMAP-Server liest und schreibt seine Nachrichten als Dateien in Nextcloud Files, über WebDAV.","De IMAP-server met de opslagkoppeling, afleveren vanuit NiFi, de toets op filters.":"Der IMAP-Server mit der Speicheranbindung, die Zustellung aus NiFi, die Prüfung der Filter.","De IMAP-server met de opslagkoppeling, de melding vanuit het register, de toets op filters.":"Der IMAP-Server mit der Speicheranbindung, die Meldung aus dem Register, die Prüfung der Filter.","De IMAP-server schrijft in Nextcloud":"Der IMAP-Server schreibt in Nextcloud","De IMAP-server werkt via Nextcloud":"Der IMAP-Server arbeitet über Nextcloud","De Woo-coördinator zoekt via SharePoint of Teams, of in Files.":"Die Woo-Koordinatorin sucht über SharePoint oder Teams oder in Files.","De architectuurvisie waarop deze demo is gebaseerd":"Die Architekturvision, auf der diese Demo beruht","De assistent is een uitbreiding van het mailprogramma. Hij praat rechtstreeks met ELSA en werkt naast IMAP, niet in plaats daarvan.":"Der Assistent ist eine Erweiterung des Mailprogramms. Er spricht direkt mit ELSA und arbeitet neben IMAP, nicht an seiner Stelle.","De brug leest het bericht uit Kafka en kijkt in het register of de Message-ID er al is. Een verzonden bericht komt zo maar één keer binnen.":"Die Brücke liest die Nachricht aus Kafka und prüft im Register, ob die Message-ID schon vorhanden ist. So kommt eine gesendete Nachricht nur einmal an.","De brug pakt het bericht uit: de EML, en elke bijlage als eigen object.":"Die Brücke packt die Nachricht aus: die EML und jeden Anhang als eigenes Objekt.","De brug schrijft het bericht en de bijlagen weg zoals een medewerker een bestand opslaat. Vanaf hier loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"Die Brücke schreibt die Nachricht und die Anhänge so weg, wie eine Mitarbeiterin eine Datei speichert. Ab hier nimmt eine Nachricht denselben Weg wie eine Datei auf einem Netzlaufwerk.","De brug schrijft ze in Nextcloud, langs dezelfde weg als een bestand op een netwerkschijf. Nextcloud maakt eerst het record in het register aan.":"Die Brücke schreibt sie in Nextcloud, auf demselben Weg wie eine Datei auf einem Netzlaufwerk. Nextcloud legt zuerst den Datensatz im Register an.","De hele gemeente":"Die ganze Gemeinde","De mailstroom loopt door Nextcloud. Een piek mag de medewerker in Files niet raken. Stap 1 is ook de proef daarop.":"Der Mailstrom läuft durch Nextcloud. Eine Spitze darf die Mitarbeiterin in Files nicht treffen. Schritt 1 ist zugleich der Test dafür.","De mappen staan in ELSA. Het mailprogramma ziet ze via IMAP.":"Die Ordner liegen in ELSA. Das Mailprogramm sieht sie über IMAP.","De medewerker kiest Persoonlijk in het paneel, of sleept het bericht naar de map Persoonlijk.":"Die Mitarbeiterin wählt „Persönlich“ im Bereich oder zieht die Nachricht in den Ordner „Persönlich“.","De medewerker opent in Files de map E-mail, en daarin een dossier of een maand.":"Die Mitarbeiterin öffnet in Files den Ordner E-Mail und darin eine Akte oder einen Monat.","De nieuwe Outlook en Outlook op het web laden webinvoegtoepassingen alleen bij een Microsoft-account, en COM-invoegtoepassingen werken daar niet. Wat dan wel werkt:":"Das neue Outlook und Outlook im Web laden Web-Add-ins nur bei einem Microsoft-Konto, und COM-Add-ins funktionieren dort nicht. Was stattdessen funktioniert:","De nieuwe Outlook heeft geen paneel. Hoe langer Outlook (klassiek) blijft, hoe beter; daarna blijven Thunderbird en de webmail van ELSA.":"Das neue Outlook hat keinen Bereich. Je länger Outlook (klassisch) bleibt, desto besser; danach bleiben Thunderbird und die Webmail von ELSA.","De opslag levert de EML. Is het bericht persoonlijk, dan ontsleutelt de IMAP-server het met de sleutel van de gebruiker, die pas na aanmelding vrijkomt.":"Der Speicher liefert die EML. Ist die Nachricht persönlich, entschlüsselt der IMAP-Server sie mit dem Schlüssel des Benutzers, der erst nach der Anmeldung freigegeben wird.","De opslag van de e-mailarchivering komt in de nieuwe Nextcloud-stack. Nextcloud Files biedt WebDAV, geen IMAP. Er komt dus een IMAP-server naast. De vraag is waar de berichten dan staan.":"Der Speicher der E-Mail-Archivierung kommt in den neuen Nextcloud-Stack. Nextcloud Files bietet WebDAV, kein IMAP. Daneben kommt also ein IMAP-Server. Die Frage ist, wo die Nachrichten dann liegen.","De orchestrator pakt het EML-bestand uit: kop, tekst en bijlagen.":"Der Orchestrator packt die EML-Datei aus: Kopfzeilen, Text und Anhänge.","De persoonlijke sleutel komt pas vrij na aanmelding, alleen voor de sessie van de eigenaar.":"Der persönliche Schlüssel wird erst nach der Anmeldung freigegeben, nur für die Sitzung des Eigentümers.","De postbus in het mailprogramma":"Das Postfach im Mailprogramm","De prijs: een piek in de mailstroom komt bij Nextcloud terecht. Daarom draaien de achtergrondtaken op eigen servers, los van die voor de medewerkers. En wat NiFi per bericht zou vastleggen, controleert ELSA nu zelf.":"Der Preis: Eine Spitze im Mailstrom landet bei Nextcloud. Deshalb laufen die Hintergrundaufgaben auf eigenen Servern, getrennt von denen für die Beschäftigten. Und was NiFi je Nachricht festhalten würde, prüft ELSA jetzt selbst.","De sleutelkluis met vrijgave per sessie, de procedure van de gemeentesecretaris, de koppeling met de Woo-dossiers in XENA.":"Der Schlüsseltresor mit Freigabe je Sitzung, das Verfahren des Gemeindesekretärs, die Verknüpfung mit den Woo-Akten in XENA.","De tekst gaat naar de zoekindex. Bijlagen worden eigen objecten, verbonden met het bericht.":"Der Text geht in den Suchindex. Anhänge werden eigene Objekte, verbunden mit der Nachricht.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"Der Zugriff gilt nur für den genannten Zeitraum und erlischt automatisch. Jedes Öffnen einer Nachricht mit diesem Schlüssel wird protokolliert.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"Die Arbeitsanweisung Gebühren 2026 ist freigegeben. Sie finden sie im Arbeitsordner des Teams.","De zaak komt uit het zaaksysteem, dat leidend blijft. ELSA legt alleen de koppeling vast, als kenmerk.":"Der Vorgang stammt aus dem Vorgangssystem, das maßgeblich bleibt. ELSA speichert nur die Verknüpfung, als Merkmal.","De zoekindex van ELSA geeft alleen zakelijke berichten. Vertrouwelijke berichten alleen aan wie daar recht op heeft.":"Der Suchindex von ELSA liefert nur dienstliche Nachrichten. Vertrauliche Nachrichten nur an Berechtigte.","De zoekindex volgt het register. Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"Der Suchindex folgt dem Register. Betreff, Text und Anhänge werden durchsuchbar, nur für Berechtigte.","Deel I legt de asynchrone verwerking in ADR-0005 bij NiFi, los van de laag die gebruikers bedient.":"Teil I weist die asynchrone Verarbeitung in ADR-0005 NiFi zu, getrennt von der Schicht, die die Nutzer bedient.","Delegeren aan de concerncontroller":"An den Konzerncontroller delegieren","Demo":"Demo","Demo: {0} dagen later":"Demo: {0} Tage später","Deze map is leeg.":"Dieser Ordner ist leer.","Dezelfde taal en dezelfde bouwstenen als de rest van XENA, een ruime licentie en een opslaglaag die bedoeld is om te vervangen. Het risico zit in Sieve: ManageSieve staat in de documentatie nog als experimenteel, en ELSA leunt op filters.":"Dieselbe Sprache und dieselben Bausteine wie der Rest von XENA, eine großzügige Lizenz und eine Speicherschicht, die zum Austauschen gedacht ist. Das Risiko liegt bei Sieve: ManageSieve gilt in der Dokumentation noch als experimentell, und ELSA stützt sich auf Filter.","Dit bericht":"Diese Nachricht","Dit bericht is automatisch verstuurd.":"Diese Nachricht wurde automatisch versendet.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"Diese Nachricht ist mit Ihrem persönlichen Schlüssel gespeichert. Im Speicher ist sie unlesbar, auch für Administratoren.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"Diese Nachricht kann sowohl dienstlich als auch persönlich sein.","Dit is je eigen vermelding. Aanpassen doe je onder Mijn vermelding.":"Das ist Ihr eigener Eintrag. Ändern können Sie ihn unter Mein Eintrag.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"Wenn Sie nichts tun, gilt die Nachricht nach zehn Tagen als dienstlich. Persönlich bedeutet: in den Ordner Persönlich verschoben, mit Ihrem eigenen Schlüssel verschlüsselt und außerhalb des Suchbereichs für die Woo.","Doorstroom":"Weg","Doorstroom van een bericht":"Weg einer Nachricht","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Weiterleiten ist nur an eine Adresse einer angeschlossenen Gemeinde erlaubt.","Dossier of zaak":"Akte oder Vorgang","Dossiers":"Akten","Dossiersleutels en persoonlijke sleutels":"Aktenschlüssel und persönliche Schlüssel","Dubbele berichten":"Doppelte Nachrichten","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"E-Mails in XENA archivieren: jede Nachricht im Register, ganz normal lesbar im eigenen Mailprogramm.","E-mailadres":"E-Mail-Adresse","E-mailarchivering binnen XENA":"E-Mail-Archivierung in XENA","ELSA bij dit bericht":"ELSA zu dieser Nachricht","ELSA registreert geen zaken. Het zaaksysteem blijft leidend; ELSA legt de koppeling vast als kenmerk, via de Zaken API.":"ELSA registriert keine Vorgänge. Das Vorgangssystem bleibt maßgeblich; ELSA speichert die Verknüpfung als Merkmal, über die Zaken API.","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA setzt nicht zugeordnete Nachrichten nach zehn Tagen auf dienstlich","EXPUNGE haalt het bericht uit de map van de medewerker. Het object blijft, zolang de bewaartermijn loopt.":"EXPUNGE nimmt die Nachricht aus dem Ordner der Mitarbeiterin. Das Objekt bleibt, solange die Aufbewahrungsfrist läuft.","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"Ein Adressbuch der Mitarbeitenden der angeschlossenen Gemeinden. Alle entscheiden selbst, ob und mit welchen Angaben sie darin stehen. Jede Gemeinde verwaltet ihren eigenen Teil und teilt ihn über CardDAV.","Een bericht kan in meer dossiers zitten. Het dossier verwijst naar het bericht; er wordt niets gekopieerd.":"Eine Nachricht kann in mehreren Akten liegen. Die Akte verweist auf die Nachricht; es wird nichts kopiert.","Een bericht komt binnen":"Eine Nachricht kommt an","Een bericht van een winkel over iets privés.":"Eine Nachricht eines Geschäfts zu etwas Privatem.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"Eine tägliche Übersicht von ELSA mit den Nachrichten, die noch zugeordnet werden müssen.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Eine Demo, kein Produkt. Alle Beispieldaten sind erfunden: Personen, Adressen, Akten und Vorgangsnummern existieren nicht. Die Demo zeigt, was die Architektur ermöglicht; ein Teil der Funktionen ist Zukunftsbild.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"Ein Filter darf nicht nach „Persönlich“ verschieben. Ob eine Nachricht persönlich ist, entscheiden Sie selbst, für jede Nachricht einzeln.","Een gewone IMAP-server met eigen opslag op schijf, en daarnaast een kopie van elk bericht in Nextcloud.":"Ein gewöhnlicher IMAP-Server mit eigenem Speicher auf der Festplatte und daneben eine Kopie jeder Nachricht in Nextcloud.","Een kleine dienst leest het bericht uit Kafka, kijkt in het register of de Message-ID er al is en pakt het uit: kop, tekst en bijlagen.":"Ein kleiner Dienst liest die Nachricht aus Kafka, prüft im Register, ob die Message-ID schon vorhanden ist, und packt sie aus: Kopfzeilen, Text und Anhänge.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"Ein Mailprogramm erwartet, dass Löschen gelingt. ELSA nimmt die Nachricht aus dem Ordner, das Objekt bleibt aber erhalten, solange die Aufbewahrungsfrist läuft.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"Ein Newsletter: dienstlich, mit kurzer Aufbewahrungsfrist.","Een opvolger voor agenda en vrij/bezet, en mailprogramma's die daarmee overweg kunnen.":"Ein Nachfolger für Kalender und Frei/Gebucht sowie Mailprogramme, die damit umgehen können.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"Eine persönliche Nachricht bleibt persönlich. Halten Sie sie doch für dienstlich, wählen Sie zuerst Dienstlich in ELSA.","Een postbus is iets anders dan een archief. Medewerkers verwachten snelheid, zoeken in de eigen mappen en offline werken. De proefgroep in stap 2 moet dat toetsen voordat iedereen overgaat.":"Ein Postfach ist etwas anderes als ein Archiv. Beschäftigte erwarten Geschwindigkeit, Suche in den eigenen Ordnern und Offline-Arbeit. Die Pilotgruppe in Schritt 2 muss das prüfen, bevor alle umsteigen.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"Eine Transportregel leitet jede Nachricht, ein- und ausgehend, als EML an Kafka weiter.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"Eine gesendete Nachricht kommt zweimal an: über die Transportregel und als Kopie aus dem Mailprogramm. ELSA entfernt Duplikate anhand der Message-ID.","Een zaaksysteem dat op omschrijving kan zoeken, of een eigen index van zaken.":"Ein Vorgangssystem, das nach Beschreibung suchen kann, oder ein eigener Index der Vorgänge.","Eerst, naast de bestaande postbus":"Zuerst, neben dem bestehenden Postfach","Eerste kandidaat: Apache James.":"Erster Kandidat: Apache James.","Eigen opslag aankoppelen":"Eigenen Speicher anbinden","Elk bericht als EML door, zonder kopie":"Jede Nachricht als EML weiter, ohne Kopie","Elk bericht als EML · bekijk de stappen":"Jede Nachricht als EML · Schritte ansehen","Elk bericht gaat via Exchange Online en Kafka naar een kleine brug, die het in Nextcloud wegschrijft. Daarna loopt het langs dezelfde weg als een bestand op een netwerkschijf. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Jede Nachricht gelangt über Exchange Online und Kafka zu einer kleinen Brücke, die sie in Nextcloud schreibt. Danach nimmt sie denselben Weg wie eine Datei auf einem Netzlaufwerk. Innerhalb einer Sekunde steht sie im Register, im Objektspeicher und im Suchindex. In Exchange bleibt keine Kopie zurück.","Elk bericht gaat via Exchange Online, Kafka en de orchestrator naar ELSA. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Jede Nachricht gelangt über Exchange Online, Kafka und den Orchestrator zu ELSA. Innerhalb einer Sekunde steht sie im Register, im Objektspeicher und im Suchindex. In Exchange bleibt keine Kopie zurück.","Elke IMAP-handeling wordt een WebDAV-aanroep: traag bij grote postbussen.":"Jede IMAP-Aktion wird ein WebDAV-Aufruf: langsam bei großen Postfächern.","Elke IMAP-server kan het, ook Dovecot zonder aanpassing.":"Jeder IMAP-Server kann das, auch Dovecot ohne Anpassung.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Jeder Anhang ist ein eigenes Objekt im Speicher, verbunden mit der Nachricht. So lässt sich ein Anhang einzeln finden, aufbewahren und veröffentlichen.","Elke dag: alles wat in Kafka stond, staat ook in het register. Dat vervangt de herkomstregistratie die NiFi zou bieden.":"Täglich: Alles, was in Kafka stand, steht auch im Register. Das ersetzt den Herkunftsnachweis, den NiFi bieten würde.","Elke ingang doet waar hij goed in is: IMAP voor de postbus, WebDAV voor het dossier.":"Jeder Zugang tut, was er gut kann: IMAP für das Postfach, WebDAV für die Akte.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"Für die Adresse Kleverlaan 14 wurde ein neuer Antrag eingereicht. Der Antrag und die Zeichnungen sind als Anhang beigefügt.","Er is één exemplaar van elk bericht. De ingangen verwijzen ernaar; geen ervan houdt een eigen kopie.":"Es gibt ein Exemplar jeder Nachricht. Die Zugänge verweisen darauf; keiner hält eine eigene Kopie.","Er is één exemplaar van elk bericht. Metagegevens, bewaartermijn en zoekindex gaan zoals bij de netwerkschijven, via het register en de apps rond Nextcloud. Er is geen aparte orchestrator.":"Es gibt ein Exemplar jeder Nachricht. Metadaten, Aufbewahrungsfrist und Suchindex laufen wie bei den Netzlaufwerken, über das Register und die Apps rund um Nextcloud. Es gibt keinen eigenen Orchestrator.","Evenementen":"Veranstaltungen","Evenementenbeleid kustgemeenten":"Veranstaltungspolitik Küstengemeinden","Evenementenvergunning":"Veranstaltungsgenehmigung","Evenementenvergunning circuit 2027":"Veranstaltungsgenehmigung Rennstrecke 2027","Exchange Online":"Exchange Online","Exchange Online ontvangt het bericht via SMTP. Een transport rule stuurt het als EML door naar Kafka en laat geen kopie achter in de postbus.":"Exchange Online empfängt die Nachricht über SMTP. Eine Transportregel leitet sie als EML an Kafka weiter und lässt keine Kopie im Postfach zurück.","Exchange Online verzendt en ontvangt; ELSA bewaart. Alles na de aanvoer staat in de Nextcloud-stack van XENA. Zo kan de mailprovider later worden vervangen zonder dat het archief verhuist.":"Exchange Online sendet und empfängt; ELSA bewahrt auf. Alles nach der Zulieferung liegt im Nextcloud-Stack von XENA. So lässt sich der Mailanbieter später ersetzen, ohne dass das Archiv umzieht.","Extensie of COM-invoegtoepassing, via de API van ELSA":"Erweiterung oder COM-Add-in, über die API von ELSA","Eén EML per bericht, onveranderlijk, met bewaarvergrendeling":"Eine EML je Nachricht, unveränderlich, mit Aufbewahrungssperre","Eén bericht, drie plekken die ernaar kijken":"Eine Nachricht, drei Stellen, die darauf blicken","Eén exemplaar, onveranderlijk, met bewaarvergrendeling.":"Ein Exemplar, unveränderlich, mit Aufbewahrungssperre.","Eén keer verwerken · bekijk de stappen":"Einmal verarbeiten · Schritte ansehen","Eén keer wegschrijven · bekijk de stappen":"Einmal wegschreiben · Schritte ansehen","Eén object in de opslag, twee ingangen":"Ein Objekt im Speicher, zwei Zugänge","Eén object in de opslag, twee ingangen: IMAP en WebDAV":"Ein Objekt im Speicher, zwei Zugänge: IMAP und WebDAV","Eén opslag, die Nextcloud beheert.":"Ein Speicher, den Nextcloud verwaltet.","Favoriet":"Favorit","Favorieten":"Favoriten","Files toont een virtuele map. De inhoud komt uit het register, niet uit een eigen kopie (PROPFIND).":"Files zeigt einen virtuellen Ordner. Der Inhalt kommt aus dem Register, nicht aus einer eigenen Kopie (PROPFIND).","Filter toegevoegd.":"Filter hinzugefügt.","Filter toevoegen":"Filter hinzufügen","Filters":"Filter","Filters (Sieve)":"Filter (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Filter laufen in ELSA selbst, sobald eine Nachricht eingeht. Sie wirken also in jedem Mailprogramm und auf jedem Gerät. Manche Aktionen sind nicht erlaubt, weil sie die Trennung zwischen dienstlich und persönlich umgehen würden.","Filters van de medewerker":"Filter der Mitarbeitenden","Foto's van de vakantie":"Urlaubsfotos","Functie":"Funktion","Geachte aanvrager,":"Sehr geehrte Antragstellerin, sehr geehrter Antragsteller,","Gedelegeerd":"Delegiert","Geen":"Keine","Geen NiFi: een bewuste afwijking van XENA Deel I":"Kein NiFi: eine bewusste Abweichung von XENA Teil I","Geen assistent in Outlook":"Kein Assistent in Outlook","Geen assistent in de nieuwe Outlook":"Kein Assistent im neuen Outlook","Geen dossier gevonden.":"Keine Akte gefunden.","Geen eigen IMAP-server: alleen de koppelingen eromheen.":"Kein eigener IMAP-Server: nur die Anbindungen drumherum.","Geen kopie meer in Exchange, voor de proefgroep":"Keine Kopie mehr in Exchange, für die Pilotgruppe","Geen zaak gevonden. Zaken komen uit het zaaksysteem; een nieuwe zaak maak je daar aan.":"Kein Vorgang gefunden. Vorgänge kommen aus dem Vorgangssystem; einen neuen Vorgang legen Sie dort an.","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Daten an der Quelle: Die Nachricht liegt einmal vor, und wer sie braucht, verweist darauf.","Gekoppeld aan een zaak":"Mit einem Vorgang verknüpft","Gekoppeld aan zaak {0}.":"Mit Vorgang {0} verknüpft.","Gelezen, vlag en label staan alleen in de IMAP-server. Leesstatus is geen archiefgegeven en komt niet in het register.":"Gelesen, Markierung und Schlagwort liegen nur im IMAP-Server. Der Lesestatus ist keine Archivangabe und kommt nicht ins Register.","Gelezen, vlag, label":"Gelesen, Markierung, Schlagwort","Gemaakt door":"Erstellt von","Gemeente":"Gemeinde","Gemeente Bloemendaal":"Gemeinde Bloemendaal","Gemeente Haarlem":"Stadt Haarlem","Gemeente Heemstede":"Gemeinde Heemstede","Gemeente Velsen":"Gemeinde Velsen","Gemeente Zandvoort":"Gemeinde Zandvoort","Gemeentelijk adresboek":"Kommunales Adressbuch","Gemeentesecretaris":"Gemeindesekretär","Gevonden":"Gefunden","Gevonden berichten gaan per verwijzing naar het Woo-dossier in XENA. Er wordt niets gekopieerd.":"Gefundene Nachrichten gehen per Verweis in die Woo-Akte in XENA. Es wird nichts kopiert.","Geweigerd":"Abgelehnt","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Gute Nachricht: Die Reparatur ist fertig. Sie können Ihr Fahrrad bis 18:00 Uhr abholen.","Gooi weg":"Löschen","Groeipad":"Ausbaupfad","Groet, Lotte Visser":"Viele Grüße, Lotte Visser","Groet, Noor":"Gruß, Noor","Haal mij uit het adresboek":"Mich aus dem Adressbuch entfernen","Handeling":"Aktion","Help":"Hilfe","Herinrichting Houtplein":"Umgestaltung Houtplein","Het Common Ground-team en het samenwerkingsverband OWC":"Das Common-Ground-Team und den Verbund OWC","Het EML-bestand en de bijlagen gaan de objectopslag in, met versiebeheer.":"Die EML-Datei und die Anhänge gehen in den Objektspeicher, mit Versionsverwaltung.","Het Woo-dossier is in Files een map met dezelfde berichten. Na beoordeling gaat de openbare versie naar TINA.":"Die Woo-Akte ist in Files ein Ordner mit denselben Nachrichten. Nach der Prüfung geht die öffentliche Fassung an TINA.","Het adresboek staat ook in het paneel van de assistent.":"Das Adressbuch steht auch im Bereich des Assistenten.","Het bericht en elke bijlage krijgen een eigen identificatie. De metagegevens worden vastgelegd; de aard is nog open.":"Die Nachricht und jeder Anhang erhalten eine eigene Kennung. Die Metadaten werden festgehalten, die Art ist noch offen.","Het bericht gaat via Exchange Online de deur uit en komt via de transport rule terug in ELSA, onder Verzonden items.":"Die Nachricht verlässt das Haus über Exchange Online und kommt über die Transportregel zurück in ELSA, unter Gesendete Elemente.","Het bericht komt binnen bij de mailprovider. Een transport rule stuurt het als EML door en houdt geen kopie.":"Die Nachricht kommt beim Mailanbieter an. Eine Transportregel leitet sie als EML weiter und behält keine Kopie.","Het bericht komt op een wachtrij. Zo gaat er niets verloren als een volgende stap even niet bereikbaar is.":"Die Nachricht landet in einer Warteschlange. So geht nichts verloren, wenn ein nächster Schritt kurz nicht erreichbar ist.","Het bericht staat in Postvak IN. Het mailprogramma ziet het bij de volgende synchronisatie.":"Die Nachricht liegt im Posteingang. Das Mailprogramm sieht sie bei der nächsten Synchronisierung.","Het bericht staat één keer in de objectopslag van XENA, beschreven in het register. De IMAP-server en Nextcloud Files verwijzen er allebei naar.":"Die Nachricht liegt einmal im Objektspeicher von XENA, beschrieben im Register. Der IMAP-Server und Nextcloud Files verweisen beide darauf.","Het bericht verdwijnt uit de virtuele mappen in Files, en de tekst uit de zoekindex.":"Die Nachricht verschwindet aus den virtuellen Ordnern in Files und der Text aus dem Suchindex.","Het bericht wordt één keer via Nextcloud weggeschreven, zoals een bestand, en staat dan in de objectopslag, beschreven in het register. De IMAP-server leest het via het register uit de opslag; Files toont het.":"Die Nachricht wird einmal über Nextcloud weggeschrieben, wie eine Datei, und liegt dann im Objektspeicher, beschrieben im Register. Der IMAP-Server liest sie über das Register aus dem Speicher; Files zeigt sie an.","Het bericht zelf, zoals het wordt bewaard":"Die Nachricht selbst, so wie sie aufbewahrt wird","Het enige onderdeel dat er voor de mail bij komt. Daarna loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"Der einzige Baustein, der für die E-Mail hinzukommt. Danach nimmt eine Nachricht denselben Weg wie eine Datei auf einem Netzlaufwerk.","Het gemeentelijk adresboek":"Das Gemeindeadressbuch","Het gemeentelijk adresboek gebruiken in de webmail van ELSA. De nieuwe Outlook kent geen CardDAV.":"Das Gemeindeadressbuch im Webmail von ELSA nutzen. Das neue Outlook unterstützt kein CardDAV.","Het gesprek over archiveren van e-mail aan de bron, zonder kopie bij de leverancier van de mailserver":"Das Gespräch über die Archivierung von E-Mail an der Quelle, ohne Kopie beim Anbieter des Mailservers","Het mailprogramma haalt berichten op via IMAP4. Inzien, verplaatsen en versleutelen gaan via ELSA; filters draaien als Sieve.":"Das Mailprogramm ruft Nachrichten über IMAP4 ab. Lesen, Verschieben und Verschlüsseln laufen über ELSA, Filter laufen als Sieve.","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Filters als Sieve.":"Das Mailprogramm holt die E-Mails über IMAP aus ELSA. Zuordnen innerhalb von zehn Tagen. Filter als Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Das Mailprogramm kann Filter auch selbst über ManageSieve verwalten. ELSA prüft jedes Skript, bevor es gespeichert wird.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"Das Mailprogramm sendet eine neue Nachricht über SMTP an Exchange Online.","Het meest compleet uit de doos, met CardDAV voor het adresboek erbij. Maar een eigen opslagkoppeling betekent werken in de code van één bedrijf, en een deel van de functies zit in de betaalde editie.":"Am vollständigsten ab Werk, mit CardDAV für das Adressbuch dazu. Aber eine eigene Speicheranbindung bedeutet Arbeit im Code eines einzigen Unternehmens, und ein Teil der Funktionen steckt in der kostenpflichtigen Edition.","Het object wordt opnieuw opgeslagen, versleuteld met de persoonlijke sleutel. De onversleutelde versie vervalt. Dat kan, omdat de bewaarvergrendeling pas ingaat als een bericht zakelijk is.":"Das Objekt wird neu gespeichert, verschlüsselt mit dem persönlichen Schlüssel. Die unverschlüsselte Fassung entfällt. Das ist möglich, weil die Aufbewahrungssperre erst greift, wenn eine Nachricht dienstlich ist.","Het onderwerp noemt een lopend Woo-verzoek.":"Der Betreff nennt einen laufenden Woo-Antrag.","Het paneel in Thunderbird en Outlook (klassiek): scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"Der Bereich in Thunderbird und Outlook (klassisch): zuordnen, ergänzen, mit Vorgang und Akte verknüpfen. Das Gemeindeadressbuch.","Het register geeft de berichten en de rechten. Alleen zakelijke berichten waar de medewerker bij mag. Persoonlijke berichten staan er nooit in.":"Das Register liefert die Nachrichten und die Rechte. Nur dienstliche Nachrichten, auf die die Mitarbeiterin Zugriff hat. Persönliche Nachrichten stehen nie darin.","Het register legt de aard persoonlijk vast, met wie en wanneer. Het bericht valt buiten het zoekbereik voor de Woo.":"Das Register hält die Art „persönlich“ fest, durch wen und wann. Die Nachricht fällt aus dem Suchbereich für die Woo.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd.":"Das Register hält die Nachricht fest: Message-ID, Absender, Empfänger, Datum und die Art „noch zuzuordnen“, mit zehn Tagen Bedenkzeit.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd. De zoekindex volgt het register.":"Das Register hält die Nachricht fest: Message-ID, Absender, Empfänger, Datum und die Art „noch zuzuordnen“, mit zehn Tagen Bedenkzeit. Der Suchindex folgt dem Register.","Het register meldt elk nieuw bericht aan de IMAP-server, die het in de juiste map zet met een verwijzing naar het object.":"Das Register meldet jede neue Nachricht an den IMAP-Server, der sie in den richtigen Ordner legt, mit einem Verweis auf das Objekt.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"Das Register meldet die neue Nachricht an den IMAP-Server. Dieser speichert keine zweite Kopie: Er verweist auf das Objekt und führt nur UID, Ordner und Markierungen.","Het register meldt het nieuwe bericht aan de IMAP-server. Die zet het in Postvak IN, met een verwijzing naar het object.":"Das Register meldet die neue Nachricht an den IMAP-Server. Dieser legt sie im Posteingang ab, mit einem Verweis auf das Objekt.","Hetzelfde bericht in Nextcloud Files":"Dieselbe Nachricht in Nextcloud Files","Hier zijn de foto's.":"Hier sind die Fotos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Anbei der Entwurf des Projektplans. Kannst du dir vor allem den Abschnitt über Genehmigungen für Terrassen ansehen?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Hallo San, bringst du am Samstag den Kuchen mit? Oma zählt auf dich. Liebe Grüße, Ellen","Hoi Sanne,":"Hallo Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP MOVE naar Persoonlijk. De IMAP-server meldt de keuze aan ELSA.":"IMAP MOVE nach „Persönlich“. Der IMAP-Server meldet die Wahl an ELSA.","IMAP en LMTP; SMTP via Postfix":"IMAP und LMTP; SMTP über Postfix","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP betrifft nur Mail. Der Kalender bleibt vorerst in Exchange, das Adressbuch läuft über CardDAV.","IMAP naast WebDAV":"IMAP neben WebDAV","IMAP, SMTP, LMTP":"IMAP, SMTP, LMTP","IMAP-server":"IMAP-Server","IMAP-server naast Nextcloud Files, op dezelfde objectopslag":"IMAP-Server neben Nextcloud Files, auf demselben Objektspeicher","IMAP4 en ManageSieve: mappen, vlaggen en filters per gebruiker":"IMAP4 und ManageSieve: Ordner, Markierungen und Filter je Benutzer","IMAP4 en Sieve":"IMAP4 und Sieve","IMAP4rev2":"IMAP4rev2","Iedereen over, en andere gemeenten in het adresboek":"Alle steigen um, und weitere Gemeinden im Adressbuch","Ik ben afwezig tot maandag.":"Ich bin bis Montag abwesend.","In behandeling":"In Bearbeitung","In de Nextcloud-stack doen het register en de apps rond Nextcloud dat werk al voor de netwerkschijven. ELSA volgt de netwerkschijven: minder onderdelen, één beheerteam, en mail en bestanden langs dezelfde weg.":"Im Nextcloud-Stack erledigen das Register und die Apps rund um Nextcloud diese Arbeit bereits für die Netzlaufwerke. ELSA folgt den Netzlaufwerken: weniger Bausteine, ein Betriebsteam, und E-Mails und Dateien auf demselben Weg.","In de browser of de bureaubladapp, via WebDAV":"Im Browser oder in der Desktop-App, über WebDAV","In de schets staat GreenMail. Dat is een testserver. Voor productie ligt een volwaardige IMAP-server met Sieve voor de hand, bijvoorbeeld Dovecot met Pigeonhole.":"In der Skizze steht GreenMail. Das ist ein Testserver. Für den Produktivbetrieb liegt ein vollwertiger IMAP-Server mit Sieve nahe, zum Beispiel Dovecot mit Pigeonhole.","In deze nieuwsbrief: de nieuwe handreiking voor actieve openbaarmaking, een webinar over de Omgevingswet en het laatste nieuws uit de regio.":"In diesem Newsletter: die neue Handreichung zur aktiven Veröffentlichung, ein Webinar zum Umweltgesetz (Omgevingswet) und das Neueste aus der Region.","In het echte systeem opent hier de webmail van ELSA, met hetzelfde paneel.":"Im echten System öffnet sich hier die Webmail von ELSA, mit demselben Bereich.","In het paneel: zoeken, een bericht beginnen en je eigen vermelding beheren, in elk mailprogramma met de assistent.":"Im Bereich: suchen, eine Nachricht beginnen und den eigenen Eintrag verwalten, in jedem Mailprogramm mit dem Assistenten.","In stap 1 staat de mail nog in Exchange. Dat is een tussenstap, geen eindbeeld: hij is er om te leren zonder dat iemand anders hoeft te werken.":"In Schritt 1 liegen die E-Mails noch in Exchange. Das ist ein Zwischenschritt, kein Zielbild: Er dient zum Lernen, ohne dass jemand anders arbeiten muss.","In vijf stappen, waarvan vier zonder de markt":"In fünf Schritten, davon vier ohne den Markt","Informatiebeheer":"Records Management","Informatiebeheerder":"Records Manager","Inhoud (EML)":"Inhalt (EML)","Interactieve demo, versie {0}":"Interaktive Demo, Version {0}","Intergemeentelijke samenwerking":"Interkommunale Zusammenarbeit","Intern":"Intern","Interne bedrijfsvoering":"Interner Dienstbetrieb","Internet Message Format (EML)":"Internet Message Format (EML)","Is dit bericht zakelijk of persoonlijk?":"Ist diese Nachricht dienstlich oder persönlich?","JMAP":"JMAP","Java (vanaf 3.9 Java 21)":"Java (ab 3.9 Java 21)","Java-interface in een modulair ontwerp":"Java-Schnittstelle in einem modularen Entwurf","Je fiets is klaar om op te halen":"Ihr Fahrrad ist abholbereit","Je kunt je vermelding altijd aanpassen of intrekken. De wijziging gaat via CardDAV naar de andere gemeenten.":"Sie können Ihren Eintrag jederzeit ändern oder zurückziehen. Die Änderung geht über CardDAV an die anderen Gemeinden.","Je staat in het adresboek":"Sie stehen im Adressbuch","Je staat in het gemeentelijk adresboek.":"Sie stehen im kommunalen Adressbuch.","Je staat niet in het adresboek":"Sie stehen nicht im Adressbuch","Je staat nog niet in het adresboek. Collega's van andere gemeenten kunnen je dan niet vinden.":"Sie stehen noch nicht im Adressbuch. Kolleginnen und Kollegen anderer Gemeinden können Sie dann nicht finden.","Je vermelding is ingetrokken.":"Ihr Eintrag wurde zurückgezogen.","Juridische Zaken":"Rechtsamt","Kafka":"Kafka","Kapvergunning Houtplein":"Fällgenehmigung Houtplein","Kies":"Wählen","Kies een bericht.":"Wählen Sie eine Nachricht.","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Wählen Sie eine Aktion. Die Schritte zeigen, welcher Baustein was tut.","Kopieer adres":"Adresse kopieren","Koppelen aan een zaak; het zaaksysteem blijft leidend":"Mit einem Vorgang verknüpfen; das Vorgangssystem bleibt maßgeblich","Label van ELSA, als IMAP-trefwoord":"Schlagwort von ELSA, als IMAP-Keyword","Labels uit het register":"Schlagwörter aus dem Register","Later":"Später","Later: een moderne opvolger van IMAP voor webmail en apps":"Später: ein moderner Nachfolger von IMAP für Webmail und Apps","Leest elk bericht uit Kafka, kijkt in het register of de Message-ID er al is, pakt het uit en schrijft de EML en de bijlagen in Nextcloud. Klein, zonder eigen opslag.":"Liest jede Nachricht aus Kafka, prüft im Register, ob die Message-ID schon vorhanden ist, packt sie aus und schreibt die EML und die Anhänge in Nextcloud. Klein, ohne eigenen Speicher.","Legesverordening 2026":"Gebührensatzung 2026","Lezen in het mailprogramma":"Lesen im Mailprogramm","Licentie":"Lizenz","Liever niet":"Lieber nicht","Logboek":"Protokoll","Lunch vrijdag?":"Mittagessen am Freitag?","MIT en LGPL 2.1":"MIT und LGPL 2.1","Mail en bestanden lopen langs dezelfde weg, met dezelfde regels.":"E-Mails und Dateien nehmen denselben Weg, mit denselben Regeln.","Mailprogramma":"Mailprogramm","Mailprovider vervangen zonder dat het archief verhuist":"Mailanbieter ersetzen, ohne dass das Archiv umzieht","Map":"Ordner","Mappen":"Ordner","Markeer":"Markieren","Medewerker":"Mitarbeiterin","Medewerkers, informatiebeheerders en architecten van de gemeenten Haarlem en Zandvoort":"Beschäftigte, Records Manager und Architekten der Gemeinden Haarlem und Zandvoort","Melding":"Meldung","Melding aan de IMAP-server":"Meldung an den IMAP-Server","Melding openbare ruimte Kleverlaan":"Meldung öffentlicher Raum Kleverlaan","Memo parkeerdruk voor het Woo-verzoek Houtplein":"Memo Parkdruck für den Woo-Antrag Houtplein","Met assistentie van":"Mit Unterstützung von","Met een proefgroep":"Mit einer Pilotgruppe","Met vriendelijke groet, Jeroen Kramer":"Mit freundlichen Grüßen, Jeroen Kramer","Met vriendelijke groet, Sanne de Vries, Team Vergunningen":"Mit freundlichen Grüßen, Sanne de Vries, Team Genehmigungen","Metagegevens":"Metadaten","Metagegevens (register)":"Metadaten (Register)","Metagegevens aangevuld":"Metadaten ergänzt","Metagegevens aanvullen in de webmail van ELSA.":"Metadaten in der Webmail von ELSA ergänzen.","Metagegevens, aard, zaak en dossiers, rechten":"Metadaten, Art, Vorgang und Akten, Rechte","Metagegevens, aard, zaak en dossiers, rechten. Zet de bewaartermijn op de opslag.":"Metadaten, Art, Vorgang und Akten, Rechte. Setzt die Aufbewahrungsfrist im Speicher.","Mijn sleutel":"Mein Schlüssel","Mijn vermelding":"Mein Eintrag","Na tien dagen automatisch zakelijk":"Nach zehn Tagen automatisch dienstlich","Na tien dagen wordt een bericht zakelijk. Vul daarna de classificatie aan, zodat de bewaartermijn vastligt.":"Nach zehn Tagen gilt eine Nachricht als dienstlich. Ergänzen Sie dann die Klassifikation, damit die Aufbewahrungsfrist feststeht.","Naam":"Name","Naam en e-mailadres zijn nodig om je te kunnen vinden. De rest kies je zelf.":"Name und E-Mail-Adresse sind nötig, damit man Sie finden kann. Den Rest wählen Sie selbst.","Neem mij op in het adresboek":"Mich in das Adressbuch aufnehmen","Nextcloud":"Nextcloud","Nextcloud Files":"Nextcloud Files","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Een andere toepassing kan die objecten dus niet zomaar delen. Daarom loopt het delen in optie C via het register, en niet via de opslag van Nextcloud zelf.":"Nextcloud speichert Dateien im Objektspeicher unter einer eigenen internen Nummer, nicht unter ihrem Namen. Eine andere Anwendung kann diese Objekte also nicht ohne Weiteres mitnutzen. Deshalb läuft die gemeinsame Nutzung in Option C über das Register und nicht über den Speicher von Nextcloud selbst.","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Het register kent dat nummer en het versie-id, omdat Nextcloud ze na elke schrijfactie terugmeldt. Zo vindt de IMAP-server het object zonder via Nextcloud te lezen.":"Nextcloud speichert Dateien im Objektspeicher unter einer eigenen internen Nummer, nicht unter ihrem Namen. Das Register kennt diese Nummer und die Versions-ID, weil Nextcloud sie nach jedem Schreibvorgang zurückmeldet. So findet der IMAP-Server das Objekt, ohne über Nextcloud zu lesen.","Nextcloud heeft een app nodig die de virtuele map E-mail uit het register toont.":"Nextcloud braucht eine App, die den virtuellen Ordner E-Mail aus dem Register anzeigt.","Nextcloud maakt eerst het record in het register aan. Het bericht en elke bijlage krijgen een eigen identificatie; de aard is nog open.":"Nextcloud legt zuerst den Datensatz im Register an. Die Nachricht und jeder Anhang erhalten eine eigene Kennung; die Art ist noch offen.","Nextcloud moet de mailstroom aankunnen naast het werk van de medewerkers.":"Nextcloud muss den Mailstrom neben der Arbeit der Beschäftigten bewältigen.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug aan het register.":"Nextcloud schreibt den Inhalt über S3 weg und meldet die Versions-ID an das Register zurück.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug. De EML staat er één keer en verandert daarna nooit meer.":"Nextcloud schreibt den Inhalt über S3 weg und meldet die Versions-ID zurück. Die EML liegt dort einmal und ändert sich danach nie mehr.","Nextcloud wordt een knelpunt voor de mail.":"Nextcloud wird zum Engpass für die E-Mail.","Nextcloud-app E-mail":"Nextcloud-App E-Mail","Nextcloud-stack van XENA":"Nextcloud-Stack von XENA","NiFi":"NiFi","NiFi leest het bericht uit Kafka, berekent de hash en kijkt op Message-ID of het er al is. Een verzonden bericht komt zo maar één keer binnen.":"NiFi liest die Nachricht aus Kafka, berechnet den Hash und prüft anhand der Message-ID, ob sie schon vorhanden ist. Eine gesendete Nachricht kommt so nur einmal an.","NiFi levert elk bericht bij de IMAP-server af, met een verwijzing naar het object in plaats van de inhoud.":"NiFi stellt jede Nachricht beim IMAP-Server zu, mit einem Verweis auf das Objekt statt des Inhalts.","NiFi levert het bericht af bij de IMAP-server (LMTP). De IMAP-server bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"NiFi stellt die Nachricht beim IMAP-Server zu (LMTP). Der IMAP-Server speichert keine zweite Kopie: Er verweist auf das Objekt und führt nur UID, Ordner und Markierungen.","NiFi slaat het bericht real time op (binnen een seconde): metagegevens in het register, de inhoud in de objectopslag, de tekst in de zoekmachine.":"NiFi speichert die Nachricht in Echtzeit (innerhalb einer Sekunde): Metadaten im Register, Inhalt im Objektspeicher, Text in der Suchmaschine.","Niemand gevonden. Misschien staat deze collega niet in het adresboek: opname is vrijwillig.":"Niemand gefunden. Vielleicht steht diese Person nicht im Adressbuch: Die Aufnahme ist freiwillig.","Niet doen":"Nicht tun","Niet toegestaan: weggooien, verplaatsen naar Persoonlijk, doorsturen naar een adres buiten de ge
