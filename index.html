cloud","Nextcloud Files":"Nextcloud Files","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Een andere toepassing kan die objecten dus niet zomaar delen. Daarom loopt het delen in optie C via het register, en niet via de opslag van Nextcloud zelf.":"Nextcloud conserve les fichiers dans le stockage objet sous un numéro interne propre, pas sous leur nom. Une autre application ne peut donc pas simplement partager ces objets. C'est pourquoi, dans l'option C, le partage passe par le registre, et non par le stockage de Nextcloud lui-même.","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Het register kent dat nummer en het versie-id, omdat Nextcloud ze na elke schrijfactie terugmeldt. Zo vindt de IMAP-server het object zonder via Nextcloud te lezen.":"Nextcloud stocke les fichiers dans le stockage objet sous un numéro interne propre, et non sous leur nom. Le registre connaît ce numéro et l'identifiant de version, car Nextcloud les lui renvoie après chaque écriture. Le serveur IMAP trouve ainsi l'objet sans lire via Nextcloud.","Nextcloud heeft een app nodig die de virtuele map E-mail uit het register toont.":"Nextcloud a besoin d'une appli qui affiche le dossier virtuel E-mail à partir du registre.","Nextcloud maakt eerst het record in het register aan. Het bericht en elke bijlage krijgen een eigen identificatie; de aard is nog open.":"Nextcloud crée d'abord l'enregistrement dans le registre. Le message et chaque pièce jointe reçoivent leur propre identifiant ; la nature reste à déterminer.","Nextcloud moet de mailstroom aankunnen naast het werk van de medewerkers.":"Nextcloud doit absorber le flux de courrier en plus du travail des agents.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug aan het register.":"Nextcloud écrit le contenu via S3 et renvoie l'identifiant de version au registre.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug. De EML staat er één keer en verandert daarna nooit meer.":"Nextcloud écrit le contenu via S3 et renvoie l'identifiant de version. L'EML y est déposé une seule fois et ne change plus jamais ensuite.","Nextcloud wordt een knelpunt voor de mail.":"Nextcloud devient un goulot d'étranglement pour le courrier.","Nextcloud-app E-mail":"Appli Nextcloud E-mail","Nextcloud-stack van XENA":"Pile Nextcloud de XENA","NiFi":"NiFi","NiFi leest het bericht uit Kafka, berekent de hash en kijkt op Message-ID of het er al is. Een verzonden bericht komt zo maar één keer binnen.":"NiFi lit le message dans Kafka, calcule le hash et vérifie sur le Message-ID s'il existe déjà. Un message envoyé n'entre ainsi qu'une seule fois.","NiFi levert elk bericht bij de IMAP-server af, met een verwijzing naar het object in plaats van de inhoud.":"NiFi remet chaque message au serveur IMAP, avec une référence à l'objet au lieu du contenu.","NiFi levert het bericht af bij de IMAP-server (LMTP). De IMAP-server bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"NiFi remet le message au serveur IMAP (LMTP). Le serveur IMAP ne garde pas de seconde copie : il renvoie à l'objet et ne tient que l'UID, le dossier et les drapeaux.","NiFi slaat het bericht real time op (binnen een seconde): metagegevens in het register, de inhoud in de objectopslag, de tekst in de zoekmachine.":"NiFi enregistre le message en temps réel (en moins d'une seconde) : les métadonnées dans le registre, le contenu dans le stockage objet, le texte dans le moteur de recherche.","Niemand gevonden. Misschien staat deze collega niet in het adresboek: opname is vrijwillig.":"Personne trouvé. Ce collègue n'est peut-être pas dans le carnet d'adresses : l'inscription est volontaire.","Niet doen":"À éviter","Niet toegestaan: weggooien, verplaatsen naar Persoonlijk, doorsturen naar een adres buiten de gemeenten.":"Non autorisé : jeter, déplacer vers Personnel, transférer vers une adresse extérieure aux communes.","Niets gevonden.":"Aucun résultat.","Niets in het mailprogramma. De Woo-coördinator zoekt al in het archief, en zakelijke berichten staan in Files.":"Rien dans le logiciel de messagerie. Le coordinateur Woo cherche déjà dans l'archive, et les messages professionnels sont dans Files.","Niets, als het goed gaat.":"Rien, si tout va bien.","Niets.":"Rien.","Niets. Exchange houdt in deze stap nog een kopie in de postbus.":"Rien. À cette étape, Exchange garde encore une copie dans la boîte aux lettres.","Niets. Voor de proefgroep laat de transport rule geen kopie meer achter.":"Rien. Pour le groupe pilote, la règle de transport ne laisse plus de copie.","Nieuw bericht":"Nouveau message","Nieuwe Outlook":"Nouvel Outlook","Nieuwe Outlook en Outlook op het web met een IMAP-account: geen paneel. Scheiden gaat dan door te verplaatsen naar de map Persoonlijk.":"Nouvel Outlook et Outlook sur le web avec un compte IMAP : pas de volet. La séparation se fait alors en déplaçant le message dans le dossier Personnel.","Nieuwe aanvraag omgevingsvergunning Kleverlaan 14":"Nouvelle demande de permis de construire Kleverlaan 14","Nog 1 dag om te scheiden":"Plus qu'un jour pour trier","Nog geen favorieten. Open een vermelding en zet er een ster bij.":"Pas encore de favoris. Ouvrez une fiche et ajoutez une étoile.","Nog te scheiden":"Encore à trier","Nog {0} dagen om te scheiden":"Plus que {0} jours pour trier","Objectopslag":"Stockage objet","Objectopslag (S3)":"Stockage objet (S3)","Om een persoonlijk bericht te tonen, moet de IMAP-server de sleutel van de gebruiker kunnen gebruiken, en alleen in diens sessie. Dat vraagt een koppeling met de sleutelkluis die nog moet worden ontworpen.":"Pour afficher un message personnel, le serveur IMAP doit pouvoir utiliser la clé de l'utilisateur, et uniquement dans sa session. Cela demande un lien avec le coffre-fort de clés, qui reste à concevoir.","Omdat een EML nooit verandert, kunnen twee ingangen hetzelfde object delen zonder dat ze elkaar in de weg zitten. Ze verschillen alleen in metagegevens, en die hebben elk een eigen eigenaar.":"Comme un EML ne change jamais, deux points d'accès peuvent partager le même objet sans se gêner. Ils ne diffèrent que par les métadonnées, qui ont chacune leur propre responsable.","Omgevingsvergunning":"Permis d'environnement","Omgevingsvergunning Kleverlaan 14":"Permis d'environnement Kleverlaan 14","Omgevingsvergunning dakopbouw Kleverlaan 12":"Permis d'environnement surélévation Kleverlaan 12","Onder de motorkap":"Sous le capot","Onderdeel":"Composant","Onderdeel van XENA, naast de opslag, MIRA en TINA.":"Fait partie de XENA, aux côtés du stockage, de MIRA et de TINA.","Onderdelen van de assistent":"Rubriques de l'assistant","Onderwerp":"Objet","Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"L'objet, le texte et les pièces jointes deviennent consultables par recherche, uniquement pour les personnes autorisées.","Onderzoek naar een klacht over integriteit. De persoonlijke berichten kunnen zakelijke berichten bevatten die ten onrechte als persoonlijk zijn aangemerkt.":"Enquête sur une plainte relative à l'intégrité. Les messages personnels peuvent contenir des messages professionnels marqués à tort comme personnels.","Ontdubbelen, uitpakken en wegschrijven. Geen eigen opslag.":"Dédoublonner, décomposer et écrire. Pas de stockage propre.","Ontdubbelen, vastleggen, opslaan, indexeren en afleveren":"Dédoublonner, consigner, stocker, indexer et remettre","Ontkoppeld":"Dissocié","Ontkoppeld van {0}.":"Dissocié de {0}.","Ontkoppelen":"Dissocier","Ontvangen":"Reçu","Ontvanger":"Destinataire","Ontvangstbevestiging aanvraag Kleverlaan 14":"Accusé de réception demande Kleverlaan 14","Ook verzonden berichten lopen via deze route. Het mailprogramma bewaart daarnaast zelf een kopie in Verzonden items via IMAP. ELSA herkent de dubbele aan de Message-ID en bewaart het bericht één keer.":"Les messages envoyés suivent aussi ce chemi var FLD={from:'Afzender',subject:'Onderwerp',to:'Ontvanger'},OPS={contains:'bevat',is:'is gelijk aan'};

function ruleCheck(r){
  if(r.act==='discard')return 'Weggooien is niet toegestaan: een zakelijk bericht moet bewaard blijven. Verplaats het naar een map.';
  if(r.act==='fileinto'&&/persoonlijk/i.test(r.arg))return 'Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.';
  if(r.act==='redirect'&&!/@[a-z]+\.gemeente\.org$/i.test(r.arg||''))return 'Doorsturen mag alleen naar een adres van een aangesloten gemeente.';
  if(!r.v)return 'Vul in waarop het filter moet letten.';
  return '';
}
function sieve(){
  var L=['require ["fileinto","imap4flags","vacation"];',''];
  S.rules.forEach(function(r){var c='if header :'+r.op+' "'+r.f+'" "'+r.v+'" {';L.push(c);
    L.push(r.act==='fileinto'?'  fileinto "'+(r.arg==='Postvak IN'?'INBOX':r.arg)+'";':r.act==='addflag'?'  addflag "\\\\Flagged";':r.act==='redirect'?'  redirect "'+r.arg+'";':r.act==='vacation'?'  vacation :days 1 "'+r.arg+'";':'  discard;');L.push('}')});
  return L.join('\n');
}
