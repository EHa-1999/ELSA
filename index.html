 Assistent gebruiken: {0}.":"Only visible to staff of municipalities that use the Office Assistant: {0}.","Alles is gescheiden.":"Everything has been sorted.","Als":"If","Als {0} {1} \"{2}\"":"If the {0} {1} \"{2}\"","Altijd, zolang je afwezig bent":"Always, as long as you are away","Andere mailprovider":"Another mail provider","Annuleren":"Cancel","Apache 2.0":"Apache 2.0","Apache NiFi":"Apache NiFi","Archief en zoeken":"Archive and search","Architectuur":"Architecture","Assistent":"Assistant","Assistent en adresboek":"Assistant and address book","Assistent van ELSA":"ELSA assistant","Bedenktijd en afwezigheid":"Cooling-off period and absence","Bedenktijd staat stil: je bent afwezig":"Cooling-off period paused: you are away","Bekijk als":"View as","Bekijken":"View","Beleidsdossier":"Policy file","Beleidsmedewerker leges":"Policy officer, fees","Bereikbaarheidsgegevens":"Contact details","Bericht":"Message","Berichten":"Messages","Berichten als bestand, in dossiers":"Messages as files, in case files","Berichtenwachtrij":"Message queue","Beschikkingen":"Decisions on individual cases (beschikkingen)","Bestaande open source IMAP-servers":"Existing open source IMAP servers","Bestanden":"Files","Bestanden in Nextcloud zijn te wijzigen; een archief moet dat niet zijn.":"Files in Nextcloud can be changed; an archive should not be.","Beste Sanne,":"Dear Sanne,","Beste collega,":"Dear colleague,","Bevestigen als tweede beoordelaar":"Confirm as second reviewer","Bevoegdheid gedelegeerd aan de concerncontroller, voor dit ene verzoek.":"Authority delegated to the corporate controller, for this one request only.","Bewaard in":"Kept in","Bewaartermijn":"Retention period","Bezwaar":"Objection","Bezwaar leges dakkapel Kleverlaan 30":"Objection fees dormer Kleverlaan 30","Bezwaar omgevingsvergunning Kleverlaan 12":"Objection environmental permit Kleverlaan 12","Bezwaarschrift Kleverlaan 12":"Objection Kleverlaan 12","Bezwaarschrift.pdf":"Objection.pdf","Bij dit bericht":"In this message","Bij elk opgeslagen Sieve-script: geen discard, geen fileinto naar Persoonlijk, redirect alleen binnen de aangesloten gemeenten.":"For every saved Sieve script: no discard, no fileinto to Personal, redirect only within the participating municipalities.","Bij vertegenwoordigende organen ingekomen stukken":"Documents received by representative bodies","Bijgaand het bezwaarschrift van een omwonende tegen de verleende omgevingsvergunning voor de Kleverlaan 12. Graag je reactie op de gronden vóór 20 oktober.":"Please find attached the objection from a local resident to the environmental permit granted for Kleverlaan 12. I would appreciate your response on the grounds before 20 October.","Binnen twee weken na vaststelling":"Within two weeks of finalisation","Binnen twee weken na verzending":"Within two weeks of sending","Blijvend bewaren":"Retain permanently","Bron per gemeente: {0}.":"Source per municipality: {0}.","Bron: het deel van {0}, via CardDAV. Een favoriet is een verwijzing, geen kopie. Trekt iemand zijn vermelding in, dan verdwijnt hij ook bij jou.":"Source: the part kept by {0}, via CardDAV. A favourite is a reference, not a copy. If someone withdraws their entry, it disappears for you too.","Brug":"Bridge","Brug naar Nextcloud":"Bridge to Nextcloud","Brug van Kafka naar Nextcloud":"Bridge from Kafka to Nextcloud","Buffert en garandeert aflevering":"Buffers and guarantees delivery","C":"C","COM-adapter van de Office Assistent, via de integratielaag":"COM adapter of the Office Assistant, via the integration layer","COM-invoegtoepassing":"COM add-in","COM-invoegtoepassing van ELSA (REST, met het token van de gebruiker)":"ELSA COM add-in (REST, with the user's token)","CardDAV":"CardDAV","CardDAV, CalDAV, WebDAV":"CardDAV, CalDAV, WebDAV","CardDAV-server":"CardDAV server","Cassandra of PostgreSQL":"Cassandra or PostgreSQL","Categorie uit documenttype, zaak of dossier; termijn uit vaststelling of ontvangst":"Category from document type, case or file; deadline from finalisation or receipt","Classificatie":"Classification","Colofon":"Colophon","Concept projectplan Houtplein, graag reactie vóór vrijdag":"Draft project plan Houtplein, comments before Friday please","Concept. Dit is een volgorde, geen planning. Register en objectopslag staan er vanaf stap 1 en veranderen daarna niet meer: het archief verhuist nooit.":"Draft. This is a sequence, not a schedule. The register and object storage are in place from step 1 and do not change after that: the archive never moves.","Contact":"Contact","Controle bij verzenden":"Check on sending","Controle op volledigheid":"Completeness check","Convenanten":"Covenants (convenanten)","Copyright":"Copyright","Dan":"Then","Dank je wel, Fatima":"Thank you, Fatima","Dat is in feite een archiefstuk onttrekken. Het kan alleen op verzoek, met twee beoordelaars, en het register houdt vast dat het bericht bestond. Of dit past binnen de Archiefwet en de selectielijst, moet de archivaris beoordelen.":"In effect, this means removing an archival record. It is only possible on request, with two reviewers, and the register records that the message existed. Whether this fits within the Archiefwet and the selection list is for the archivist to assess.","Dat kan nog 1 dag. Daarna wordt het bericht vergrendeld.":"You can still do this for 1 day. After that the message will be locked.","Dat kan nog {0} dagen. Daarna wordt het bericht vergrendeld.":"You can still do this for {0} days. After that the message will be locked.","Database":"Database","Datum":"Date","De API van ELSA achter de integratielaag van de Office Assistent, CardDAV, opzoeken in het register en via de Zaken API.":"The ELSA API behind the Office Assistant's integration layer, CardDAV, lookup in the register and via the Zaken API.","De API van ELSA, CardDAV, opzoeken in het register en via de Zaken API.":"The ELSA API, CardDAV, lookup in the register and via the Zaken API.","De EML komt één keer in de objectopslag. Het object verandert daarna nooit meer.":"The EML goes into object storage once. After that the object never changes.","De IMAP-server bewaart zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"The IMAP server keeps its messages as files in Nextcloud Files, via WebDAV.","De IMAP-server heeft een eigen opslagkoppeling nodig.":"The IMAP server needs its own storage connector.","De IMAP-server kent de UID en de map, en haalt de inhoud bij de opslag.":"The IMAP server knows the UID and the folder, and fetches the content from storage.","De IMAP-server leest de inhoud uit de XENA-objectopslag, via het register. Bij Apache James is dat een eigen BlobStore.":"The IMAP server reads the content from XENA object storage, via the register. In Apache James this is a custom BlobStore.","De IMAP-server leest en schrijft zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"The IMAP server reads and writes its messages as files in Nextcloud Files, via WebDAV.","De IMAP-server met de opslagkoppeling, afleveren vanuit NiFi, de toets op filters.":"The IMAP server with the storage connector, delivery from NiFi, the filter check.","De IMAP-server met de opslagkoppeling, de melding vanuit het register, de toets op filters.":"The IMAP server with the storage connector, the notification from the register, the filter check.","De IMAP-server schrijft in Nextcloud":"The IMAP server writes to Nextcloud","De IMAP-server werkt via Nextcloud":"The IMAP server works through Nextcloud","De Office Assistent in Thunderbird en Outlook (klassiek), met de module E-mailarchivering: scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"The Office Assistant in Thunderbird and Outlook (classic), with the E-mail archiving module: sort, enrich, link to case and file. The municipal address book.","De Office Assistent roept ELSA aan via dezelfde integratielaag als in de kantoorpakketten. In het mailprogramma staat geen token.":"The Office Assistant calls ELSA via the same integration layer as in the office suites. No token is stored in the mail program.","De Woo-coördinator zoekt in de samenwerkomgeving van de gemeente, of in Files.":"The Woo coordinator searches in the municipality's collaboration environment, or in Files.","De Woo-coördinator zoekt via SharePoint of Teams, of in Files.":"The Woo coordinator searches via SharePoint or Teams, or in Files.","De architectuurvisie waarop deze demo is gebaseerd":"The architecture vision this demo is based on","De assistent is een uitbreiding van het mailprogramma. Hij praat rechtstreeks met ELSA en werkt naast IMAP, niet in plaats daarvan.":"The assistant is an extension of the mail program. It talks directly to ELSA and works alongside IMAP, not instead of it.","De bedenktijd loopt tot":"The cooling-off period runs until","De bedenktijd loopt tot {0}; daarna gaat het bericht naar het publicatiedepot, na anonimiseren en beoordeling.":"The cooling-off period runs until {0}; after that, the message goes to the publication repository, once anonymised and reviewed.","De bedenktijd staat stil zolang je afwezig bent.":"The reflection period is paused while you are away.","De brug leest het bericht uit Kafka en kijkt in het register of de Message-ID er al is. Een verzonden bericht komt zo maar één keer binnen.":"The bridge reads the message from Kafka and checks in the register whether the Message-ID is already there. That way a sent message only comes in once.","De brug pakt het bericht uit: de EML, en elke bijlage als eigen object.":"The bridge unpacks the message: the EML, and each attachment as its own object.","De brug schrijft het bericht en de bijlagen weg zoals een medewerker een bestand opslaat. Vanaf hier loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"The bridge writes the message and the attachments just as an employee saves a file. From here a message follows the same path as a file on a network drive.","De brug schrijft ze in Nextcloud, langs dezelfde weg als een bestand op een netwerkschijf. Nextcloud maakt eerst het record in het register aan.":"The bridge writes them into Nextcloud, along the same path as a file on a network drive. Nextcloud first creates the record in the register.","De datum volgt zodra de metagegevens zijn vastgelegd.":"The date follows once the metadata have been recorded.","De datum volgt zodra het bericht is verzonden.":"The date follows once the message has been sent.","De datum volgt zodra het stuk is vastgesteld.":"The date follows once the document has been finalised.","De hele gemeente":"The whole municipality","De informatiebeheerder beoordeelt het verzoek, met een tweede beoordelaar. Je krijgt bericht.":"The records manager assesses the request, with a second reviewer. You will be notified.","De informatiebeheerder heeft het verzoek geweigerd. Het bericht blijft zakelijk.":"The records manager has refused the request. The message remains business.","De koppeling met R-{0}-{1}.":"The link with R-{0}-{1}.","De koppeling met Z-{0}-{1}.":"The link with Z-{0}-{1}.","De mailstroom loopt door Nextcloud. Een piek mag de medewerker in Files niet raken. Stap 1 is ook de proef daarop.":"The mail flow runs through Nextcloud. A spike must not affect the employee in Files. Step 1 is also the test of that.","De mappen staan in ELSA. Het mailprogramma ziet ze via IMAP.":"The folders are kept in ELSA. Your mail program sees them via IMAP.","De medewerker kiest Persoonlijk in het paneel, of sleept het bericht naar de map Persoonlijk.":"The employee chooses Personal in the pane, or drags the message to the Personal folder.","De medewerker opent in Files de map E-mail, en daarin een dossier of een maand.":"The employee opens the E-mail folder in Files, and within it a file or a month.","De nieuwe Outlook en Outlook op het web laden webinvoegtoepassingen alleen bij een Microsoft-account, en COM-invoegtoepassingen werken daar niet. Wat dan wel werkt:":"The new Outlook and Outlook on the web only load web add-ins for a Microsoft account, and COM add-ins do not work there. What does work:","De nieuwe Outlook heeft geen paneel. Hoe langer Outlook (klassiek) blijft, hoe beter; daarna blijven Thunderbird en de webmail van ELSA.":"The new Outlook has no pane. The longer Outlook (classic) remains, the better; after that, Thunderbird and the ELSA webmail remain.","De opslag levert de EML. Is het bericht persoonlijk, dan ontsleutelt de IMAP-server het met de sleutel van de gebruiker, die pas na aanmelding vrijkomt.":"Storage returns the EML. If the message is personal, the IMAP server decrypts it with the user's key, which is only released after sign-in.","De opslag van de e-mailarchivering komt in de nieuwe Nextcloud-stack. Nextcloud Files biedt WebDAV, geen IMAP. Er komt dus een IMAP-server naast. De vraag is waar de berichten dan staan.":"E-mail archive storage moves into the new Nextcloud stack. Nextcloud Files offers WebDAV, not IMAP. So an IMAP server is added alongside it. The question is where the messages are then kept.","De opsteller kiest of het stuk onder een Woo-categorie valt.":"The author chooses whether the document falls under a Woo category.","De orchestrator pakt het EML-bestand uit: kop, tekst en bijlagen.":"The orchestrator unpacks the EML file: header, text and attachments.","De persoonlijke sleutel komt pas vrij na aanmelding, alleen voor de sessie van de eigenaar.":"The personal key is only released after sign-in, and only for the owner's session.","De postbus in het mailprogramma":"The mailbox in the mail program","De prijs: een piek in de mailstroom komt bij Nextcloud terecht. Daarom draaien de achtergrondtaken op eigen servers, los van die voor de medewerkers. En wat NiFi per bericht zou vastleggen, controleert ELSA nu zelf.":"The price: a spike in the mail flow lands on Nextcloud. That is why the background jobs run on their own servers, separate from those for staff. And what NiFi would record per message, ELSA now checks itself.","De sleutelkluis met vrijgave per sessie en een sleutel per object, de procedures van de gemeentesecretaris en de informatiebeheerder, de koppeling met de Woo-dossiers in XENA.":"The key vault with release per session and a key per object, the procedures of the municipal secretary and the records manager, the link with the Woo files in XENA.","De sleutelkluis met vrijgave per sessie, de procedure van de gemeentesecretaris, de koppeling met de Woo-dossiers in XENA.":"The key vault with release per session, the municipal secretary's procedure, the link with the Woo files in XENA.","De tekst gaat naar de zoekindex. Bijlagen worden eigen objecten, verbonden met het bericht.":"The text goes to the search index. Attachments become separate objects, linked to the message.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"Access applies only to the period stated and expires automatically. Every time a message is opened with this key, it is recorded.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"The work instruction on fees 2026 has been adopted. You can find it in the team's working folder.","De zaak komt uit het zaaksysteem, dat leidend blijft. ELSA legt alleen de koppeling vast, als kenmerk.":"The case comes from the case management system, which remains leading. ELSA only records the link, as an attribute.","De zoekindex van ELSA geeft alleen zakelijke berichten. Vertrouwelijke berichten alleen aan wie daar recht op heeft.":"The ELSA search index returns business messages only. Confidential messages only to those entitled to them.","De zoekindex volgt het register. Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"The search index follows the register. Subject, text and attachments become searchable, only for those with access.","Deel I legt de asynchrone verwerking in ADR-0005 bij NiFi, los van de laag die gebruikers bedient.":"In ADR-0005, Part I assigns asynchronous processing to NiFi, separate from the layer that serves users.","Delegeren aan de concerncontroller":"Delegate to the corporate controller","Demo":"Demo","Demo: {0} dagen later":"Demo: {0} days later","Deze map is leeg.":"This folder is empty.","Dezelfde laag als voor de kantoorpakketten. Het mailprogramma zelf praat rechtstreeks IMAP; de assistent alleen via deze laag.":"The same layer as for the office suites. The mail program itself speaks IMAP directly; the assistant only via this layer.","Dezelfde taal en dezelfde bouwstenen als de rest van XENA, een ruime licentie en een opslaglaag die bedoeld is om te vervangen. Het risico zit in Sieve: ManageSieve staat in de documentatie nog als experimenteel, en ELSA leunt op filters.":"The same language and building blocks as the rest of XENA, a permissive licence and a storage layer designed to be replaced. The risk lies in Sieve: the documentation still lists ManageSieve as experimental, and ELSA relies on filters.","Dit bericht":"This message","Dit bericht is automatisch verstuurd.":"This message was sent automatically.","Dit bericht is gekoppeld aan een zaak of dossier. Ontkoppel eerst.":"This message is linked to a case or file. Unlink it first.","Dit bericht is na de bedenktijd op verzoek persoonlijk gemaakt. Het register houdt vast dat het bestond, met afzender, datum en het besluit. De vergrendelde versie is onleesbaar.":"This message was made personal on request after the cooling-off period. The register records that it existed, with sender, date and the decision. The locked version is unreadable.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"This message is stored with your personal key. In storage it is unreadable, even to administrators.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"This message could be either business or personal.","Dit bericht valt onder een lopend Woo-verzoek en kan niet persoonlijk worden.":"This message falls under an ongoing Woo request and cannot become personal.","Dit bericht valt onder een lopend Woo-verzoek. Zolang dat loopt, kan het niet persoonlijk worden, ook niet op verzoek.":"This message falls under an ongoing Woo request. While that is under way, it cannot become personal, not even on request.","Dit is de Office Assistent in de mailomgeving, met de module E-mailarchivering. Het is dezelfde assistent als in de kantoorpakketten. Hij roept ELSA aan via de integratielaag en werkt naast IMAP, niet in plaats daarvan.":"This is the Office Assistant in the mail environment, with the E-mail archiving module. It is the same assistant as in the office suites. It calls ELSA through the integration layer and works alongside IMAP, not instead of it.","Dit is je eigen vermelding. Aanpassen doe je onder Mijn vermelding.":"This is your own entry. You can change it under My listing.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"If you do nothing, the message counts as business after ten days. Personal means: moved to the Personal folder, encrypted with your own key and outside the search scope for the Woo.","Doorgeven":"Forwarding","Doorstroom":"Message flow","Doorstroom van een bericht":"How a message flows","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Forwarding is only allowed to an address at a participating municipality.","Dossier R-{0}-{1}":"File R-{0}-{1}","Dossier of zaak":"Dossier or case","Dossiers":"Files","Dossiersleutels en persoonlijke sleutels":"File keys and personal keys","Dubbele berichten":"Duplicate messages","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"E-mail archiving in XENA: every message in the register, read as usual in your own mail program.","E-mailadres":"E-mail address","E-mailarchivering binnen XENA":"E-mail archiving within XENA","ELSA":"ELSA","ELSA bij dit bericht":"ELSA for this message","ELSA registreert geen zaken. Het zaaksysteem blijft leidend; ELSA legt de koppeling vast als kenmerk, via de Zaken API.":"ELSA does not register cases. The case management system remains leading; ELSA records the link as an attribute, via the Zaken API.","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA marks unsorted messages as business after ten days","EXPUNGE haalt het bericht uit de map van de medewerker. Het object blijft, zolang de bewaartermijn loopt.":"EXPUNGE removes the message from the employee's folder. The object remains for as long as the retention period runs.","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"An address book of staff at the participating municipalities. Everyone decides for themselves whether to be listed and with which details. Each municipality manages its own part and shares it via CardDAV.","Een bericht kan in meer dossiers zitten. Het dossier verwijst naar het bericht; er wordt niets gekopieerd.":"A message can be in several files. The file refers to the message; nothing is copied.","Een bericht komt binnen":"A message arrives","Een bericht van een winkel over iets privés.":"A message from a shop about something private.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"A daily summary from ELSA of the messages that still need sorting.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"A demo, not a product. All sample data is invented: people, addresses, files and case numbers do not exist. The demo shows what the architecture makes possible; some of the functions are a vision of the future.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"A filter may not move messages to Personal. Whether a message is personal is your own choice, message by message.","Een gewone IMAP-server met eigen opslag op schijf, en daarnaast een kopie van elk bericht in Nextcloud.":"An ordinary IMAP server with its own disk storage, plus a copy of every message in Nextcloud.","Een kleine dienst leest het bericht uit Kafka, kijkt in het register of de Message-ID er al is en pakt het uit: kop, tekst en bijlagen.":"A small service reads the message from Kafka, checks in the register whether the Message-ID is already there, and unpacks it: header, text and attachments.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"A mail program expects deletion to succeed. ELSA removes the message from the folder, but the object is kept for as long as the retention period runs.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"A newsletter: business, with a short retention period.","Een opvolger voor agenda en vrij/bezet, en mailprogramma's die daarmee overweg kunnen.":"A successor for calendar and free/busy, and mail programs that can work with it.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"A personal message stays personal. If you think it is business after all, first choose Business in ELSA.","Een postbus is iets anders dan een archief. Medewerkers verwachten snelheid, zoeken in de eigen mappen en offline werken. De proefgroep in stap 2 moet dat toetsen voordat iedereen overgaat.":"A mailbox is not the same as an archive. Staff expect speed, search in their own folders and offline working. The pilot group in step 2 must test this before everyone moves over.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"A transport rule forwards every message, incoming and outgoing, as EML to Kafka.","Een verzoek is niet mogelijk zolang er een Woo-verzoek loopt waar het bericht onder valt. Elk besluit, en elke vernietigde sleutel, staat in het logboek, dat de archivaris kan inzien.":"A request is not possible while there is an ongoing Woo request that the message falls under. Every decision, and every destroyed key, is in the log, which the archivist can inspect.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"A sent message arrives twice: via the transport rule and as a copy from the mail program. ELSA removes duplicates by Message-ID.","Een zaak of dossier met een Woo-categorie gaat voor op een eigen keuze.":"A case or file with a Woo category takes precedence over your own choice.","Een zaak of dossier met een categorie gaat voor op een eigen keuze. Gelijk aan de demo over e-mailarchivering.":"A case or file with a category takes precedence over your own choice. The same as in the email archiving demo.","Een zaaksysteem dat op omschrijving kan zoeken, of een eigen index van zaken.":"A case management system that can search by description, or a separate index of cases.","Eerst, naast de bestaande postbus":"First, alongside the existing mailbox","Eerste beoordeling: toekennen":"First review: grant","Eerste beoordeling: toekennen. Wacht op de tweede beoordelaar.":"First review: grant. Waiting for the second reviewer.","Eerste kandidaat: Apache James.":"First candidate: Apache James.","Eigen keuze, vervangen door de categorie van de zaak of het dossier.":"Own choice, replaced by the category of the case or file.","Eigen opslag aankoppelen":"Plug in custom storage","Elk bericht als EML door, zonder kopie":"Every message forwarded as EML, without a copy","Elk bericht als EML · bekijk de stappen":"Every message as EML · view the steps","Elk bericht gaat via Exchange Online en Kafka naar een kleine brug, die het in Nextcloud wegschrijft. Daarna loopt het langs dezelfde weg als een bestand op een netwerkschijf. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Every message goes through Exchange Online and Kafka to a small bridge, which writes it into Nextcloud. From there it follows the same path as a file on a network drive. Within a second it is in the register, the object storage and the search index. No copy is left behind in Exchange.","Elk bericht gaat via Exchange Online, Kafka en de orchestrator naar ELSA. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Every message goes through Exchange Online, Kafka and the orchestrator to ELSA. Within a second it is in the register, the object storage and the search index. No copy is left behind in Exchange.","Elk zakelijk bericht krijgt een eigen sleutel in de sleutelkluis. Zo kan een vergrendelde versie onleesbaar worden gemaakt zonder hem te verwijderen, als een verzoek om hem persoonlijk te maken wordt toegekend.":"Every business message gets its own key in the key vault. That way a locked version can be made unreadable without deleting it, if a request to make it personal is granted.","Elke IMAP-handeling wordt een WebDAV-aanroep: traag bij grote postbussen.":"Every IMAP action becomes a WebDAV call: slow for large mailboxes.","Elke IMAP-server kan het, ook Dovecot zonder aanpassing.":"Any IMAP server can do it, even Dovecot without modification.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Each attachment is a separate object in storage, linked to the message. This means an attachment can be found, kept and published on its own.","Elke dag: alles wat in Kafka stond, staat ook in het register. Dat vervangt de herkomstregistratie die NiFi zou bieden.":"Every day: everything that was in Kafka is also in the register. This replaces the provenance tracking that NiFi would provide.","Elke ingang doet waar hij goed in is: IMAP voor de postbus, WebDAV voor het dossier.":"Each access route does what it is good at: IMAP for the mailbox, WebDAV for the file.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"A new application has been submitted for the address Kleverlaan 14. The application and the drawings are attached.","Er is één exemplaar van elk bericht. De ingangen verwijzen ernaar; geen ervan houdt een eigen kopie.":"There is one copy of each message. The access routes refer to it; none of them keeps its own copy.","Er is één exemplaar van elk bericht. Metagegevens, bewaartermijn en zoekindex gaan zoals bij de netwerkschijven, via het register en de apps rond Nextcloud. Er is geen aparte orchestrator.":"There is one copy of each message. Metadata, retention period and search index work as for the network drives, through the register and the apps around Nextcloud. There is no separate orchestrator.","Evenementen":"Events","Evenementenbeleid kustgemeenten":"Events policy coastal municipalities","Evenementenvergunning":"Event permit","Evenementenvergunning circuit 2027":"Event permit circuit 2027","Exchange":"Exchange","Exchange Online":"Exchange Online","Exchange Online ontvangt het bericht via SMTP. Een transport rule stuurt het als EML door naar Kafka en laat geen kopie achter in de postbus.":"Exchange Online receives the message via SMTP. A transport rule forwards it as EML to Kafka and leaves no copy in the mailbox.","Exchange Online verzendt en ontvangt; ELSA bewaart. Alles na de aanvoer staat in de Nextcloud-stack van XENA. Zo kan de mailprovider later worden vervangen zonder dat het archief verhuist.":"Exchange Online sends and receives; ELSA keeps. Everything after intake is in the XENA Nextcloud stack. This way the mail provider can be replaced later without the archive moving.","Extensie of COM-invoegtoepassing, via de API van ELSA":"Extension or COM add-in, via the ELSA API","Eén EML per bericht, onveranderlijk, met bewaarvergrendeling":"One EML per message, immutable, with retention lock","Eén bericht, drie plekken die ernaar kijken":"One message, three places that look at it","Eén exemplaar, onveranderlijk, met bewaarvergrendeling.":"One copy, immutable, with retention lock.","Eén keer verwerken · bekijk de stappen":"Processed once · view the steps","Eén keer wegschrijven · bekijk de stappen":"Written once · view the steps","Eén object in de opslag, twee ingangen":"One object in storage, two access routes","Eén object in de opslag, twee ingangen: IMAP en WebDAV":"One object in storage, two access routes: IMAP and WebDAV","Eén opslag, die Nextcloud beheert.":"One storage, managed by Nextcloud.","Favoriet":"Favourite","Favorieten":"Favourites","Files toont een virtuele map. De inhoud komt uit het register, niet uit een eigen kopie (PROPFIND).":"Files shows a virtual folder. The content comes from the register, not from a copy of its own (PROPFIND).","Filter toegevoegd.":"Filter added.","Filter toevoegen":"Add filter","Filters":"Filters","Filters (Sieve)":"Filters (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Filters run in ELSA itself, at the moment a message arrives. So they work in any mail program and on any device. Some actions are not allowed, because they would bypass the separation between business and personal.","Filters van de medewerker":"Employee's filters","Foto's van de vakantie":"Holiday photos","Functie":"Job title","Geachte aanvrager,":"Dear applicant,","Gedelegeerd":"Delegated","Geef een reden op.":"Please give a reason.","Geen":"None","Geen NiFi: een bewuste afwijking van XENA Deel I":"No NiFi: a deliberate departure from XENA Part I","Geen assistent in Outlook":"No assistant in Outlook","Geen assistent in de nieuwe Outlook":"No assistant in the new Outlook","Geen categorie":"No category","Geen categorie: alleen openbaar op verzoek":"No category: public on request only","Geen dossier gevonden.":"No file found.","Geen eigen IMAP-server: alleen de koppelingen eromheen.":"No IMAP server of our own: only the connectors around it.","Geen kopie meer in Exchange, voor de proefgroep":"No more copy in Exchange, for the pilot group","Geen verzoeken.":"No requests.","Geen zaak gevonden. Zaken komen uit het zaaksysteem; een nieuwe zaak maak je daar aan.":"No case found. Cases come from the case system; you create a new case there.","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Data at the source: the message is stored once, and whoever needs it refers to it.","Geheimen":"Secrets","Gekoppeld aan een zaak":"Linked to a case","Gekoppeld aan zaak {0}.":"Linked to case {0}.","Gekoppeld aan {0}. Ontkoppel eerst; ook dat wordt vastgelegd.":"Linked to {0}. Unlink it first; that is recorded too.","Gekozen, nog te herzien":"Chosen, still revisable","Gelezen, vlag en label staan alleen in de IMAP-server. Leesstatus is geen archiefgegeven en komt niet in het register.":"Read, flag and label are kept only in the IMAP server. Read status is not archive data and does not go into the register.","Gelezen, vlag, label":"Read, flag, label","Gemaakt door":"Created by","Gemeente":"Municipality","Gemeente Bloemendaal":"Municipality of Bloemendaal","Gemeente Haarlem":"Municipality of Haarlem","Gemeente Heemstede":"Municipality of Heemstede","Gemeente Velsen":"Municipality of Velsen","Gemeente Zandvoort":"Municipality of Zandvoort","Gemeentelijk adresboek":"Municipal address book","Gemeentesecretaris":"Municipal secretary","Gevonden":"Found","Gevonden berichten gaan per verwijzing naar het Woo-dossier in XENA. Er wordt niets gekopieerd.":"Messages found go by reference to the Woo file in XENA. Nothing is copied.","Geweigerd":"Refused","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Good news: the repair is done. You can collect your bike until 18:00.","Gooi weg":"Discard","Groeipad":"Growth path","Groet, Lotte Visser":"Regards, Lotte Visser","Groet, Noor":"Regards, Noor","Haal mij uit het adresboek":"Remove me from the address book","Handeling":"Action","Help":"Help","Herinrichting Houtplein":"Redevelopment of Houtplein","Herzien kan tot {0}.":"You can revise this until {0}.","Het Common Ground-team en het samenwerkingsverband OWC":"The Common Ground team and the OWC partnership","Het EML-bestand en de bijlagen gaan de objectopslag in, met versiebeheer.":"The EML file and the attachments go into the object storage, with versioning.","Het Woo-dossier is in Files een map met dezelfde berichten. Na beoordeling gaat de openbare versie naar TINA.":"In Files, the Woo file is a folder with the same messages. After assessment, the public version goes to TINA.","Het adresboek staat ook in het paneel van de assistent.":"The address book is also in the assistant pane.","Het bericht en elke bijlage krijgen een eigen identificatie. De metagegevens worden vastgelegd; de aard is nog open.":"The message and each attachment get their own identifier. The metadata is recorded; the nature is still open.","Het bericht gaat via Exchange Online de deur uit en komt via de transport rule terug in ELSA, onder Verzonden items.":"The message leaves through Exchange Online and returns to ELSA via the transport rule, under Sent Items.","Het bericht is vergrendeld. Persoonlijk maken kan alleen op verzoek, bij de informatiebeheerder.":"The message is locked. Making it personal is only possible on request, via the records manager.","Het bericht komt binnen bij de mailprovider. Een transport rule stuurt het als EML door en houdt geen kopie.":"The message arrives at the mail provider. A transport rule forwards it as EML and keeps no copy.","Het bericht komt op een wachtrij. Zo gaat er niets verloren als een volgende stap even niet bereikbaar is.":"The message is placed on a queue. That way nothing is lost if a next step is briefly unavailable.","Het bericht staat in Postvak IN. Het mailprogramma ziet het bij de volgende synchronisatie.":"The message is in the Inbox. The mail program sees it at the next sync.","Het bericht staat één keer in de objectopslag van XENA, beschreven in het register. De IMAP-server en Nextcloud Files verwijzen er allebei naar.":"The message is stored once in XENA object storage, described in the register. The IMAP server and Nextcloud Files both refer to it.","Het bericht verdwijnt uit de virtuele mappen in Files, en de tekst uit de zoekindex.":"The message disappears from the virtual folders in Files, and its text from the search index.","Het bericht wordt één keer via Nextcloud weggeschreven, zoals een bestand, en staat dan in de objectopslag, beschreven in het register. De IMAP-server leest het via het register uit de opslag; Files toont het.":"The message is written once through Nextcloud, like a file, and then sits in object storage, described in the register. The IMAP server reads it from storage via the register; Files displays it.","Het bericht zelf, zoals het wordt bewaard":"The message itself, as it is kept","Het documenttype bepaalt de Woo-categorie, tot de opsteller kiest of koppelt.":"The document type determines the Woo category until the author chooses or links.","Het enige onderdeel dat er voor de mail bij komt. Daarna loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"The only component added for mail. After that a message follows the same path as a file on a network drive.","Het gemeentelijk adresboek":"The municipal address book","Het gemeentelijk adresboek gebruiken in de webmail van ELSA. De nieuwe Outlook kent geen CardDAV.":"Use the municipal address book in the ELSA webmail. The new Outlook does not support CardDAV.","Het gesprek over archiveren van e-mail aan de bron, zonder kopie bij de leverancier van de mailserver":"The conversation about archiving e-mail at the source, without a copy at the mail server vendor","Het mailprogramma haalt berichten op via IMAP4. Inzien, verplaatsen en versleutelen gaan via ELSA; filters draaien als Sieve.":"The mail program retrieves messages via IMAP4. Viewing, moving and encrypting go through ELSA; filters run as Sieve.","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Filters als Sieve.":"The mail program fetches mail from ELSA via IMAP. Sorting within ten days. Filters as Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Your mail program can also manage filters itself via ManageSieve. ELSA checks every script before it is saved.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"The mail program sends a new message via SMTP to Exchange Online.","Het meest compleet uit de doos, met CardDAV voor het adresboek erbij. Maar een eigen opslagkoppeling betekent werken in de code van één bedrijf, en een deel van de functies zit in de betaalde editie.":"The most complete out of the box, with CardDAV for the address book too. But a custom storage connector means working in one company's code, and some functions are in the paid edition.","Het object wordt opnieuw opgeslagen, versleuteld met de persoonlijke sleutel. De onversleutelde versie vervalt. Dat kan, omdat de bewaarvergrendeling pas ingaat als een bericht zakelijk is.":"The object is stored again, encrypted with the personal key. The unencrypted version lapses. This is possible because the retention lock only applies once a message is business.","Het onderwerp noemt een lopend Woo-verzoek.":"The subject mentions an ongoing Woo request.","Het paneel in Thunderbird en Outlook (klassiek): scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"The pane in Thunderbird and Outlook (classic): sort, enrich, link to case and file. The municipal address book.","Het register geeft de berichten en de rechten. Alleen zakelijke berichten waar de medewerker bij mag. Persoonlijke berichten staan er nooit in.":"The register returns the messages and the permissions. Only business messages the employee is allowed to see. Personal messages are never in it.","Het register legt de aard persoonlijk vast, met wie en wanneer. Het bericht valt buiten het zoekbereik voor de Woo.":"The register records the nature as personal, by whom and when. The message falls outside the search scope for the Woo.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd.":"The register records the message: Message-ID, sender, recipients, date and the nature \"still to sort\", with a ten-day cooling-off period.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd. De zoekindex volgt het register.":"The register records the message: Message-ID, sender, recipients, date and the nature \"still to sort\", with a ten-day cooling-off period. The search index follows the register.","Het register meldt elk nieuw bericht aan de IMAP-server, die het in de juiste map zet met een verwijzing naar het object.":"The register notifies the IMAP server of each new message, which puts it in the right folder with a reference to the object.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"The register notifies the IMAP server of the new message. The server keeps no second copy: it refers to the object and tracks only UID, folder and flags.","Het register meldt het nieuwe bericht aan de IMAP-server. Die zet het in Postvak IN, met een verwijzing naar het object.":"The register notifies the IMAP server of the new message. The server puts it in the Inbox, with a reference to the object.","Hetzelfde bericht in Nextcloud Files":"The same message in Nextcloud Files","Hier zijn de foto's.":"Here are the photos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Here is the draft of the project plan. Could you look in particular at the section on permits for terraces?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Hi San, will you bring the cake on Saturday? Grandma is counting on you. Love, Ellen","Hoi Sanne,":"Hi Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP MOVE naar Persoonlijk. De IMAP-server meldt de keuze aan ELSA.":"IMAP MOVE to Personal. The IMAP server reports the choice to ELSA.","IMAP en LMTP; SMTP via Postfix":"IMAP and LMTP; SMTP via Postfix","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP covers mail only. The calendar stays in Exchange for now; the address book goes via CardDAV.","IMAP naast WebDAV":"IMAP alongside WebDAV","IMAP, SMTP, LMTP":"IMAP, SMTP, LMTP","IMAP, uit ELSA":"IMAP, from ELSA","IMAP-server":"IMAP server","IMAP-server naast Nextcloud Files, op dezelfde objectopslag":"IMAP server alongside Nextcloud Files, on the same object storage","IMAP-trefwoorden":"IMAP keywords","IMAP4 en ManageSieve: mappen, vlaggen en filters per gebruiker":"IMAP4 and ManageSieve: folders, flags and filters per user","IMAP4 en Sieve":"IMAP4 and Sieve","IMAP4rev2":"IMAP4rev2","Iedereen over, en andere gemeenten in het adresboek":"Everyone moves over, and other municipalities in the address book","Ik ben afwezig":"I am away","Ik ben afwezig tot maandag.":"I am out of the office until Monday.","Ik ben afwezig. Je bericht wordt na mijn terugkomst gelezen.":"I am away. Your message will be read when I return.","Ik ben terug":"I am back","Ik was op vakantie. Het gaat om een inzameling onder collega's, niet over werk.":"I was on holiday. It is about a collection among colleagues, not about work.","In behandeling":"In progress","In de Nextcloud-stack doen het register en de apps rond Nextcloud dat werk al voor de netwerkschijven. ELSA volgt de netwerkschijven: minder onderdelen, één beheerteam, en mail en bestanden langs dezelfde weg.":"In the Nextcloud stack, the register and the apps around Nextcloud already do that work for the network drives. ELSA follows the network drives: fewer components, one operations team, and mail and files along the same path.","In de browser of de bureaubladapp, via WebDAV":"In the browser or the desktop app, via WebDAV","In de schets staat GreenMail. Dat is een testserver. Voor productie ligt een volwaardige IMAP-server met Sieve voor de hand, bijvoorbeeld Dovecot met Pigeonhole.":"The sketch shows GreenMail. That is a test server. For production, a full IMAP server with Sieve is the obvious choice, for example Dovecot with Pigeonhole.","In deze nieuwsbrief: de nieuwe handreiking voor actieve openbaarmaking, een webinar over de Omgevingswet en het laatste nieuws uit de regio.":"In this newsletter: the new guidance on proactive disclosure, a webinar on the Environment and Planning Act and the latest news from the region.","In het echte systeem opent hier de webmail van ELSA, met hetzelfde paneel.":"In the real system the ELSA webmail opens here, with the same panel.","In het paneel: zoeken, een bericht beginnen en je eigen vermelding beheren, in elk mailprogramma met de assistent.":"In the pane: search, start a message and manage your own entry, in every mail program with the assistant.","In stap 1 staat de mail nog in Exchange. Dat is een tussenstap, geen eindbeeld: hij is er om te leren zonder dat iemand anders hoeft te werken.":"In step 1 the mail is still in Exchange. That is an intermediate step, not the end state: it exists to learn without anyone having to change how they work.","In vijf stappen, waarvan vier zonder de markt":"In five steps, four of them without the market","Informatiebeheer":"Records Management","Informatiebeheerder":"Records manager","Inhoud (EML)":"Content (EML)","Integratielaag, aan de serverkant":"Integration layer, on the server side","Interactieve demo, versie {0}":"Interactive demo, version {0}","Intergemeentelijke samenwerking":"Inter-municipal collaboration","Intern":"Internal","Interne bedrijfsvoering":"Internal operations","Internet Message Format (EML)":"Internet Message Format (EML)","Is dit bericht zakelijk of persoonlijk?":"Is this message business or personal?","JMAP":"JMAP","Jaarplannen en jaarverslagen":"Annual plans and annual reports","Java (vanaf 3.9 Java 21)":"Java (Java 21 from 3.9)","Java-interface in een modulair ontwerp":"Java interface in a modular design","Je eigen keuze vervalt.":"Your own choice lapses.","Je fiets is klaar om op te halen":"Your bike is ready for collection","Je kunt je vermelding altijd aanpassen of intrekken. De wijziging gaat via CardDAV naar de andere gemeenten.":"You can change or withdraw your listing at any time. The change goes to the other municipalities via CardDAV.","Je kunt zelf kiezen, of koppelen aan een zaak of dossier met een categorie. Die gaat dan voor.":"You can choose yourself, or link to a case or file with a category. That then takes precedence.","Je staat in het adresboek":"You are in the address book","Je staat in het gemeentelijk adresboek.":"You are in the municipal address book.","Je staat niet in het adresboek":"You are not in the address book","Je staat nog niet in het adresboek. Collega's van andere gemeenten kunnen je dan niet vinden.":"You are not in the address book yet. This means colleagues at other municipalities cannot find you.","Je vermelding is ingetrokken.":"Your listing has been withdrawn.","Juridische Zaken":"Legal Affairs","Kafka":"Kafka","Kapvergunning Houtplein":"Tree felling permit Houtplein","Kies":"Choose","Kies een bericht.":"Choose a messa ze laag.":"Runs only between back-end systems, never through the workplace. If another service replaces Exchange, only this layer changes.","Lunch vrijdag?":"Lunch on Friday?","MIT en LGPL 2.1":"MIT and LGPL 2.1","Mail en bestanden lopen langs dezelfde weg, met dezelfde regels.":"Mail and files follow the same path, under the same rules.","Mailomgeving":"Mail environment","Mailprogramma":"Mail program","Mailprovider vervangen zonder dat het archief verhuist":"Replace the mail provider without the archive moving","Map":"Folder","Mappen":"Folders","Markeer":"Flag","Medewerker":"Employee","Medewerkers, informatiebeheerders en architecten van de gemeenten Haarlem en Zandvoort":"Staff, records managers and architects of the municipalities of Haarlem and Zandvoort","Melding":"Report","Melding aan de IMAP-server":"Notification to the IMAP server","Melding openbare ruimte Kleverlaan":"Public space report Kleverlaan","Memo parkeerdruk voor het Woo-verzoek Houtplein":"Parking pressure memo for the Houtplein Woo request","Met assistentie van":"With assistance from","Met een Exchange-postbus werkt de webinvoegtoepassing in elke Outlook, maar dan staat de mail bij Microsoft. Dat past niet bij de keuze voor een postbus in eigen beheer. Met ELSA blijft voor Outlook alleen de COM-invoegtoepassing in Outlook (klassiek) over.":"With an Exchange mailbox the web add-in works in every Outlook, but then the mail sits with Microsoft. That does not fit the choice for a mailbox under the municipality's own control. With ELSA, the only option left for Outlook is the COM add-in in Outlook (classic).","Met een proefgroep":"With a pilot group","Met vriendelijke groet, Jeroen Kramer":"Kind regards, Jeroen Kramer","Met vriendelijke groet, Sanne de Vries, Team Vergunningen":"Kind regards, Sanne de Vries, Permits Team","Metagegevens":"Metadata","Metagegevens (register)":"Metadata (register)","Metagegevens aangevuld":"Metadata completed","Metagegevens aanvullen in de webmail van ELSA.":"Complete the API van ELSA en het register":"To the ELSA API and the register","Neem mij op in het adresboek":"Add me to the address book","Nextcloud":"Nextcloud","Nextcloud Files":"Nextcloud Files","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Een andere toepassing kan die objecten dus niet zomaar delen. Daarom loopt het delen in optie C via het register, en niet via de opslag van Nextcloud zelf.":"Nextcloud stores files in object storage under its own internal number, not under their name. So another application cannot simply share those objects. That is why sharing in option C goes via the register, and not via Nextcloud's own storage.","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Het register kent dat nummer en het versie-id, omdat Nextcloud ze na elke schrijfactie terugmeldt. Zo vindt de IMAP-server het object zonder via Nextcloud te lezen.":"Nextcloud stores files in object storage under its own internal number, not under their name. The register knows that number and the version ID, because Nextcloud reports them back after every write. That way the IMAP server finds the object without reading through Nextcloud.","Nextcloud heeft een app nodig die de virtuele map E-mail uit het register toont.":"Nextcloud needs an app that shows the virtual E-mail folder from the register.","Nextcloud maakt eerst het record in het register aan. Het bericht en elke bijlage krijgen een eigen identificatie; de aard is nog open.":"Nextcloud first creates the record in the register. The message and each attachment get their own identifier; the nature is still open.","Nextcloud moet de mailstroom aankunnen naast het werk van de medewerkers.":"Nextcloud must handle the mail flow alongside the staff's own work.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug aan het register.":"Nextcloud writes the content via S3 and reports the version ID back to the register.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug. De EML staat er één keer en verandert daarna nooit meer.":"Nextcloud writes the content via S3 and reports the version ID back. The EML is stored once and never changes after that.","Nextcloud wordt een knelpunt voor de mail.":"Nextcloud becomes a bottleneck for mail.","Nextcloud-app E-mail":"Nextcloud E-mail app","Nextcloud-stack van XENA":"XENA Nextcloud stack","NiFi":"NiFi","NiFi leest het bericht uit Kafka, berekent de hash en kijkt op Message-ID of het er al is. Een verzonden bericht komt zo maar één keer binnen.":"NiFi reads the message from Kafka, calculates the hash and checks by Message-ID whether it is already there. This way a sent message only arrives once.","NiFi levert elk bericht bij de IMAP-server af, met een verwijzing naar het object in plaats van de inhoud.":"NiFi delivers each message to the IMAP server, with a reference to the object instead of the content.","NiFi levert het bericht af bij de IMAP-server (LMTP). De IMAP-server bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"NiFi delivers the message to the IMAP server (LMTP). The IMAP server keeps no second copy: it refers to the object and only tracks UID, folder and flags.","NiFi slaat het bericht real time op (binnen een seconde): metagegevens in het register, de inhoud in de objectopslag, de tekst in de zoekmachine.":"NiFi stores the message in real time (within a second): metadata in the register, the content in the object storage, the text in the search engine.","Niemand gevonden. Misschien staat deze collega niet in het adresboek: opname is vrijwillig.":"No one found. This colleague may not be in the address book: being listed is voluntary.","Niet doen":"Do not do","Niet toegestaan: weggooien, verplaatsen naar Persoonlijk, doorsturen naar een adres buiten de gemeenten.":"Not allowed: discarding, moving to Personal, forwarding to an address outside the municipalities.","Niet uit zichzelf. Wel vindbaar bij een Woo-verzoek.":"Not proactively. But findable in response to a Woo request.","Niets gevonden.":"Nothing found.","Niets in het mailprogramma. De Woo-coördinator zoekt al in het archief, en zakelijke berichten staan in Files.":"Nothing in the mail program. The Woo coordinator already searches the archive, and business messages are in Files.","Niets om te herzien.":"Nothing to revise.","Niets, als het goed gaat.":"Nothing, if all goes well.","Niets.":"Nothing.","Niets. Exchange houdt in deze stap nog een kopie in de postbus.":"Nothing. In this step Exchange still keeps a copy in the mailbox.","Niets. Voor de proefgroep laat de transport rule geen kopie meer achter.":"Nothing. For the pilot group the transport rule no longer leaves a copy.","Nieuw bericht":"New message","Nieuwe Outlook":"New Outlook","Nieuwe Outlook en Outlook op het web":"New Outlook and Outlook on the web","Nieuwe Outlook en Outlook op het web met een IMAP-account: geen paneel. Scheiden gaat dan door te verplaatsen naar de map Persoonlijk.":"New Outlook and Outlook on the web with an IMAP account: no pane. Separating is then done by moving the message to the Personal folder.","Nieuwe aanvraag omgevingsvergunning Kleverlaan 14":"New environmental permit application Kleverlaan 14","Nog 1 dag om te scheiden":"1 day left to sort","Nog geen favorieten. Open een vermelding en zet er een ster bij.":"No favourites yet. Open an entry and give it a star.","Nog te scheiden":"Still to sort","Nog {0} dagen om te scheiden":"{0} days left to sort","Object Lock zodra de bedenktijd voorbij is":"Object Lock once the cooling-off period has ended","Objectopslag":"Object storage","Objectopslag (S3)":"Object storage (S3)","Office Assistent":"Office Assistant","Office Assistent · E-mailarchivering":"Office Assistant · E-mail archiving","Om een persoonlijk bericht te tonen, moet de IMAP-server de sleutel van de gebruiker kunnen gebruiken, en alleen in diens sessie. Dat vraagt een koppeling
