<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="generator" content="ELSA (e-mailarchief), demo versie 15, 21-10-2026">
<title>ELSA</title>
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: demokader met tabbladen; in Postbus een mailprogramma in drie kolommen dat via IMAP uit ELSA leest, met de assistent boven het bericht. Vormtaal gelijk aan XENA, MIRA en TINA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5; --blue:#2c5c9c; --blue-soft:#e1eaf7;
  --app:#0f6cbd; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1360px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.regie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;font-size:12.5px;color:var(--muted)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .seg button{padding:3px 10px;font-size:12.5px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.page{padding:20px 22px 26px;display:grid;gap:16px}
.page h2{font-size:19px;font-weight:600;text-wrap:balance}
.lead{max-width:72ch;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.n-amber{background:var(--amber-soft);color:var(--amber)} .n-violet{background:var(--violet-soft);color:var(--violet)} .n-green{background:var(--green-soft);color:var(--green)} .n-grey{background:var(--surface2);color:var(--fg)} .n-red{background:var(--red-soft);color:var(--red)}
.note span{color:var(--fg)} .note svg{margin-top:2px}

/* mailprogramma */
.mc-top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--app);color:#fff;font-size:12.5px;flex-wrap:wrap}
.mc-top b{font-weight:600}.mc-top .acc{margin-left:auto;opacity:.92}
.mc-bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.tb{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;font-size:12.5px;color:var(--fg)}
.tb:hover:not(:disabled){background:var(--sel)} .tb:disabled{opacity:.45;cursor:default} .tb svg{color:var(--app)}
.mc-bar select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.mc-bar input[type=search]{flex:1 1 200px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mc{display:grid;grid-template-columns:190px 290px minmax(0,1fr) 340px;min-height:580px}.mc.nopane{grid-template-columns:190px 300px minmax(0,1fr)}
.tag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-violet{color:var(--violet)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ap{display:flex;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 30%,var(--surface));min-width:0;max-height:640px}
.ap.off{display:block;background:var(--surface2);overflow:auto}
.apm{flex:1;min-width:0;overflow:auto}
.aph{position:sticky;top:0;display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);z-index:1}
.aph h3{font-size:13.5px}.aph p{font-size:11.5px;color:var(--muted)}.aph svg{color:var(--accent)}
.apb{padding:12px 14px;display:grid;grid-template-columns:minmax(0,1fr);gap:10px;font-size:13px}.apb>*{min-width:0}.apb h3{font-size:14px}.apb h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px}.apb h4 b{color:var(--fg)}
.apl{display:grid;grid-template-columns:minmax(0,1fr);gap:4px}.apl li{min-width:0}.apl button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.apl button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apl button:hover{border-color:var(--accent)}
.apl .gn{display:grid;gap:1px;text-align:left}.apl .gn small{font-size:11.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.apl .gs{color:var(--amber);flex:none}
.gchips{display:flex;flex-wrap:wrap;gap:4px}.gchips button{padding:2px 9px;border:1px solid var(--line);border-radius:99px;background:var(--surface);font-size:12px}.gchips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.gme{display:flex;gap:9px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gme svg{color:var(--accent);flex:none}.gme div{flex:1;min-width:0;display:grid}.gme span{font-size:12px;color:var(--muted)}.gme .btn{padding:4px 10px;font-size:12.5px}
.gback{justify-self:start;color:var(--accent);font-size:12.5px;padding:2px 0}.gback:hover{text-decoration:underline}
.gcard{display:flex;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}.gav{width:40px;height:40px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);font-weight:600}
.gcard h3{font-size:14px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}.gcard p{font-size:12.5px;color:var(--muted)}
.gdl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;font-size:12.5px}.gdl dt{color:var(--muted)}.gdl dd{margin:0;overflow-wrap:anywhere}
.gact{display:flex;flex-wrap:wrap;gap:6px}.gact .btn{padding:5px 10px;font-size:12.5px}.gact [aria-pressed="true"] path{fill:currentColor}.gact [aria-pressed="true"]{color:var(--amber);border-color:var(--amber)}
.gsh{display:grid;gap:6px}.gsh label{display:flex;gap:8px;align-items:center;font-size:13px}.gsh input{accent-color:var(--accent)}
.apr{width:44px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:2px;padding:6px 0}
.apr button{position:relative;height:38px;display:grid;place-items:center;color:var(--accent)}.apr button:hover{background:var(--surface)}
.apr button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.apr i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9.5px;font-weight:600;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 4px}
.ap .el{border:0;background:none;padding:12px 14px}.ap .meta{grid-template-columns:minmax(0,1fr)}.ap .el .q{flex-direction:column;align-items:stretch}.ap .el .q .btn{justify-content:center}
.fold{border-right:1px solid var(--line);padding:8px 0;background:var(--surface2);font-size:13px}
.fold h4{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 14px 4px;font-weight:600}
.fold button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px}
.fold button:hover{background:var(--sel)} .fold button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fold button span{flex:1;min-width:0} .fold button b{font-size:11.5px;font-weight:600;color:var(--app)}
.fold .gr{padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.list{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.mi{display:grid;gap:2px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left}
.mi:hover{background:var(--surface2)} .mi[aria-current="true"]{background:var(--sel);border-left-color:var(--app)}
.mi .r1{display:flex;gap:6px;align-items:baseline}.mi .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mi.read .r1 b{font-weight:500}
.mi .r1 time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mi .sj{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.empty{padding:30px 16px;color:var(--muted);text-align:center;font-size:13px}
.read-p{overflow:auto;max-height:640px;display:flex;flex-direction:column}
.el{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));padding:10px 16px;display:grid;gap:8px}
.el .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.el .h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.el .q{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.el .q strong{font-weight:600}
.el .sug{font-size:12.5px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fld{display:grid;gap:3px;font-size:12.5px}
.fld label{font-weight:500}
.fld select,.fld input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.fld .ro{padding:5px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.msg{padding:16px 18px 22px;display:grid;gap:10px}
.msg h2{font-size:18px;font-weight:600;text-wrap:balance}
.mh{display:grid;grid-template-columns:70px minmax(0,1fr);gap:3px 10px;font-size:13px}
.mh dt{color:var(--muted)} .mh dd{overflow-wrap:anywhere}
.body{font-family:var(--serif);font-size:14.5px;line-height:1.6;max-width:66ch;display:grid;gap:8px}
.enc{border:1px dashed var(--violet);border-radius:8px;padding:16px;color:var(--violet);display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--violet-soft)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11px}
.ref{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}

/* doorstroom */
.fl{border:1px solid var(--line);border-radius:12px;background:linear-gradient(180deg,var(--surface2),var(--surface));padding:14px 14px 10px;display:grid;gap:8px;overflow:hidden}
.flh{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12.5px;color:var(--muted)}.flh b{color:var(--fg);font-size:13px}
.flt{position:relative;display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));padding-top:152px}
.flt::before{content:"";position:absolute;left:calc(50% / var(--n));right:calc(50% / var(--n));top:calc(152px + 17px);height:3px;border-radius:2px;background:repeating-linear-gradient(90deg,var(--line) 0 6px,transparent 6px 10px)}
.flp{position:absolute;left:calc(50% / var(--n));top:calc(152px + 17px);height:3px;border-radius:2px;background:var(--accent);width:calc((100% - 100% / var(--n)) * var(--p));transition:width 1s cubic-bezier(.45,.05,.25,1)}
.fls{position:relative;display:grid;justify-items:center;gap:5px;text-align:center;min-width:0}
.fls .si{width:37px;height:37px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:2px solid var(--line);color:var(--muted);transition:border-color .4s,background .4s,color .4s,transform .4s}
.fls small{font-size:11px;color:var(--muted);line-height:1.2;overflow-wrap:anywhere;padding:0 2px}
.fls.done .si{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.fls.now .si{border-color:var(--accent);background:var(--accent);color:var(--accent-fg);transform:scale(1.12);box-shadow:0 0 0 6px color-mix(in srgb,var(--accent) 22%,transparent);animation:flPulse 1s ease-out infinite}
.fls.now small{color:var(--fg);font-weight:600}
@keyframes flPulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--accent) 45%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
@property --x{syntax:'<length-percentage>';inherits:true;initial-value:0%}
.tok{position:absolute;top:0;left:0;right:0;height:0;pointer-events:none;z-index:2;--tw:230px}
.tok>.env{position:absolute;top:0;left:clamp(14px,calc(var(--x) - 32px),calc(100% - 96px))}
.tki{position:absolute;top:56px;width:var(--tw);left:clamp(0px,calc(var(--x) - var(--tw) / 2),calc(100% - var(--tw)));display:grid;justify-items:center;gap:4px}
.tok .env{position:relative;width:64px;height:48px;filter:drop-shadow(0 4px 8px rgba(10,40,46,.22))}
.tok .env>svg{width:64px;height:48px;overflow:visible}
.tok .bdg svg{width:12px;height:12px}

.tok .bdg{position:absolute;top:-8px;right:-14px;display:flex;gap:3px}
.tok .bdg span{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--surface);border:1.5px solid var(--accent);color:var(--accent);animation:flPop .45s cubic-bezier(.2,1.6,.4,1) both}
.tok .tags{display:flex;flex-wrap:wrap;justify-content:center;gap:3px;max-width:100%}
.tok .tags span{font-size:10.5px;font-weight:600;line-height:16px;padding:0 6px;border-radius:99px;white-space:nowrap;animation:flPop .45s cubic-bezier(.2,1.6,.4,1) both}
.tok .cap{max-width:100%;text-align:center;white-space:normal;font-size:11px;color:var(--fg);font-weight:500;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:1px 7px;animation:flFade .5s both}
.tok.mv{animation:flHop 1s cubic-bezier(.45,.05,.25,1)}
@keyframes flPop{0%{transform:scale(0);opacity:0}100%{transform:none;opacity:1}}
@keyframes flFade{0%{opacity:0;transform:translateY(4px)}100%{opacity:1;transform:none}}
@keyframes flHop{0%,100%{translate:0 0}50%{translate:0 -10px}}
.env .fl-up{transform-box:fill-box;transform-origin:50% 100%}
.env .fl-sheet{transform-box:view-box}
.tok.s2 .fl-up{animation:flFlap .5s ease both}.tok.s2 .fl-sheet{animation:flSheet .6s ease .25s both}.tok.s4 .fl-id{animation:flFade .5s both}.tok.s8 .fl-dot{animation:flPop .45s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
@keyframes flFlap{0%{transform:scaleY(-1)}100%{transform:none}}@keyframes flSheet{0%{transform:translateY(16px)}100%{transform:none}}
.flk{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:11.5px;color:var(--muted)}.flk span{display:inline-flex;gap:5px;align-items:center}.flk i{width:9px;height:9px;border-radius:2px;display:inline-block}
.stp.now{background:linear-gradient(90deg,var(--accent-soft),transparent);border-radius:6px}
.stp.done code{animation:flFade .5s both}
@media (max-width:760px){.fls small{display:none}.fls .si{width:28px;height:28px}.fls .si svg{width:14px;height:14px}.flt{padding-top:200px}.flt::before,.flp{top:calc(200px + 13px)}.fls.now .si{transform:none;box-shadow:none}.tok .tags{max-width:150px}.tok .cap{max-width:170px}}
@media (max-width:760px){.tok{--tw:180px}}
@media (prefers-reduced-motion:reduce){.flp,.fls .si{transition:none}.fl-up,.fl-sheet,.fl-id,.fl-dot,.fls.now .si,.tok.mv,.tok .bdg span,.tok .tags span,.tok .cap,.stp.done code{animation:none}}

chrift van een omwonende tegen de verleende omgevingsvergunning voor de Kleverlaan 12. Graag je reactie op de gronden vóór 20 oktober.":"Anbei der Widerspruch eines Anwohners gegen die erteilte Baugenehmigung für die Kleverlaan 12. Bitte um deine Stellungnahme zur Begründung bis zum 20. Oktober.","Binnen twee weken na vaststelling":"Innerhalb von zwei Wochen nach dem Feststellen","Binnen twee weken na verzending":"Innerhalb von zwei Wochen nach dem Senden","Blijvend bewaren":"Dauernd aufbewahren","Bron per gemeente: {0}.":"Quelle je Gemeinde: {0}.","Bron: het deel van {0}, via CardDAV. Een favoriet is een verwijzing, geen kopie. Trekt iemand zijn vermelding in, dan verdwijnt hij ook bij jou.":"Quelle: der Teil von {0}, über CardDAV. Ein Favorit ist ein Verweis, keine Kopie. Zieht jemand seinen Eintrag zurück, verschwindet er auch bei Ihnen.","Brug":"Brücke","Brug naar Nextcloud":"Brücke zu Nextcloud","Brug van Kafka naar Nextcloud":"Brücke von Kafka zu Nextcloud","Buffert en garandeert aflevering":"Puffert und garantiert die Zustellung","C":"C","COM-adapter van de Office Assistent, via de integratielaag":"COM-Adapter des Office-Assistenten, über die Integrationsschicht","COM-invoegtoepassing":"COM-Add-in","COM-invoegtoepassing van ELSA (REST, met het token van de gebruiker)":"COM-Add-in von ELSA (REST, mit dem Token des Benutzers)","CardDAV":"CardDAV","CardDAV, CalDAV, WebDAV":"CardDAV, CalDAV, WebDAV","CardDAV-server":"CardDAV-Server","Cassandra of PostgreSQL":"Cassandra oder PostgreSQL","Categorie uit documenttype, zaak of dossier; termijn uit vaststelling of ontvangst":"Kategorie aus Dokumentart, Vorgang oder Akte; Frist ab Feststellen oder Eingang","Classificatie":"Klassifikation","Colofon":"Impressum","Concept projectplan Houtplein, graag reactie vóór vrijdag":"Entwurf Projektplan Houtplein, bitte Rückmeldung bis Freitag","Concept. Dit is een volgorde, geen planning. Register en objectopslag staan er vanaf stap 1 en veranderen daarna niet meer: het archief verhuist nooit.":"Entwurf. Dies ist eine Reihenfolge, kein Zeitplan. Register und Objektspeicher stehen ab Schritt 1 und ändern sich danach nicht mehr: Das Archiv zieht nie um.","Contact":"Kontakt","Controle bij verzenden":"Prüfung beim Senden","Controle op volledigheid":"Vollständigkeitsprüfung","Convenanten":"Vereinbarungen (Convenanten)","Copyright":"Urheberrecht","Dan":"Dann","Dank je wel, Fatima":"Vielen Dank, Fatima","Dat is in feite een archiefstuk onttrekken. Het kan alleen op verzoek, met twee beoordelaars, en het register houdt vast dat het bericht bestond. Of dit past binnen de Archiefwet en de selectielijst, moet de archivaris beoordelen.":"Das bedeutet faktisch, ein Archivstück zu entziehen. Es ist nur auf Antrag möglich, mit zwei Prüfpersonen, und das Register hält fest, dass die Nachricht existierte. Ob dies mit dem Archiefwet und der Auswahlliste vereinbar ist, muss die Archivarin oder der Archivar beurteilen.","Dat kan nog 1 dag. Daarna wordt het bericht vergrendeld.":"Das ist noch 1 Tag möglich. Danach wird die Nachricht gesperrt.","Dat kan nog {0} dagen. Daarna wordt het bericht vergrendeld.":"Das ist noch {0} Tage möglich. Danach wird die Nachricht gesperrt.","Database":"Datenbank","Datum":"Datum","De API van ELSA achter de integratielaag van de Office Assistent, CardDAV, opzoeken in het register en via de Zaken API.":"Die API von ELSA hinter der Integrationsschicht des Office-Assistenten, CardDAV, Suche im Register und über die Zaken API.","De API van ELSA, CardDAV, opzoeken in het register en via de Zaken API.":"Die API von ELSA, CardDAV, Nachschlagen im Register und über die Zaken API.","De EML komt één keer in de objectopslag. Het object verandert daarna nooit meer.":"Die EML kommt einmal in den Objektspeicher. Das Objekt ändert sich danach nie mehr.","De IMAP-server bewaart zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Der IMAP-Server speichert seine Nachrichten als Dateien in Nextcloud Files, über WebDAV.","De IMAP-server heeft een eigen opslagkoppeling nodig.":"Der IMAP-Server braucht eine eigene Speicheranbindung.","De IMAP-server kent de UID en de map, en haalt de inhoud bij de opslag.":"Der IMAP-Server kennt die UID und den Ordner und holt den Inhalt aus dem Speicher.","De IMAP-server leest de inhoud uit de XENA-objectopslag, via het register. Bij Apache James is dat een eigen BlobStore.":"Der IMAP-Server liest den Inhalt aus dem XENA-Objektspeicher, über das Register. Bei Apache James ist das ein eigener BlobStore.","De IMAP-server leest en schrijft zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Der IMAP-Server liest und schreibt seine Nachrichten als Dateien in Nextcloud Files, über WebDAV.","De IMAP-server met de opslagkoppeling, afleveren vanuit NiFi, de toets op filters.":"Der IMAP-Server mit der Speicheranbindung, die Zustellung aus NiFi, die Prüfung der Filter.","De IMAP-server met de opslagkoppeling, de melding vanuit het register, de toets op filters.":"Der IMAP-Server mit der Speicheranbindung, die Meldung aus dem Register, die Prüfung der Filter.","De IMAP-server schrijft in Nextcloud":"Der IMAP-Server schreibt in Nextcloud","De IMAP-server werkt via Nextcloud":"Der IMAP-Server arbeitet über Nextcloud","De Office Assistent in Thunderbird en Outlook (klassiek), met de module E-mailarchivering: scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"Der Office-Assistent in Thunderbird und Outlook (klassisch), mit dem Modul E-Mail-Archivierung: zuordnen, ergänzen, mit Vorgang und Akte verknüpfen. Das Gemeindeadressbuch.","De Office Assistent roept ELSA aan via dezelfde integratielaag als in de kantoorpakketten. In het mailprogramma staat geen token.":"Der Office-Assistent ruft ELSA über dieselbe Integrationsschicht auf wie in den Office-Paketen. Im E-Mail-Programm liegt kein Token.","De Woo-coördinator zoekt in de samenwerkomgeving van de gemeente, of in Files.":"Die Woo-Koordinatorin sucht in der Kollaborationsumgebung der Gemeinde oder in Files.","De Woo-coördinator zoekt via SharePoint of Teams, of in Files.":"Die Woo-Koordinatorin sucht über SharePoint oder Teams oder in Files.","De architectuurvisie waarop deze demo is gebaseerd":"Die Architekturvision, auf der diese Demo beruht","De assistent is een uitbreiding van het mailprogramma. Hij praat rechtstreeks met ELSA en werkt naast IMAP, niet in plaats daarvan.":"Der Assistent ist eine Erweiterung des Mailprogramms. Er spricht direkt mit ELSA und arbeitet neben IMAP, nicht an seiner Stelle.","De bedenktijd loopt tot":"Die Bedenkzeit läuft bis","De bedenktijd loopt tot {0}; daarna gaat het bericht naar het publicatiedepot, na anonimiseren en beoordeling.":"Die Bedenkzeit läuft bis {0}; danach geht die Nachricht nach Anonymisierung und Prüfung in das Veröffentlichungsdepot.","De bedenktijd staat stil zolang je afwezig bent.":"Die Bedenkzeit ruht, solange Sie abwesend sind.","De brug leest het bericht uit Kafka en kijkt in het register of de Message-ID er al is. Een verzonden bericht komt zo maar één keer binnen.":"Die Brücke liest die Nachricht aus Kafka und prüft im Register, ob die Message-ID schon vorhanden ist. So kommt eine gesendete Nachricht nur einmal an.","De brug pakt het bericht uit: de EML, en elke bijlage als eigen object.":"Die Brücke packt die Nachricht aus: die EML und jeden Anhang als eigenes Objekt.","De brug schrijft het bericht en de bijlagen weg zoals een medewerker een bestand opslaat. Vanaf hier loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"Die Brücke schreibt die Nachricht und die Anhänge so weg, wie eine Mitarbeiterin eine Datei speichert. Ab hier nimmt eine Nachricht denselben Weg wie eine Datei auf einem Netzlaufwerk.","De brug schrijft ze in Nextcloud, langs dezelfde weg als een bestand op een netwerkschijf. Nextcloud maakt eerst het record in het register aan.":"Die Brücke schreibt sie in Nextcloud, auf demselben Weg wie eine Datei auf einem Netzlaufwerk. Nextcloud legt zuerst den Datensatz im Register an.","De datum volgt zodra de metagegevens zijn vastgelegd.":"Das Datum folgt, sobald die Metadaten festgehalten sind.","De datum volgt zodra het bericht is verzonden.":"Das Datum folgt, sobald die Nachricht gesendet ist.","De datum volgt zodra het stuk is vastgesteld.":"Das Datum folgt, sobald das Dokument festgestellt ist.","De hele gemeente":"Die ganze Gemeinde","De informatiebeheerder beoordeelt het verzoek, met een tweede beoordelaar. Je krijgt bericht.":"Der Records Manager prüft die Anfrage zusammen mit einer zweiten Prüfperson. Sie werden benachrichtigt.","De informatiebeheerder heeft het verzoek geweigerd. Het bericht blijft zakelijk.":"Der Records Manager hat die Anfrage abgelehnt. Die Nachricht bleibt dienstlich.","De koppeling met R-{0}-{1}.":"Die Verknüpfung mit R-{0}-{1}.","De koppeling met Z-{0}-{1}.":"Die Verknüpfung mit Z-{0}-{1}.","De mailstroom loopt door Nextcloud. Een piek mag de medewerker in Files niet raken. Stap 1 is ook de proef daarop.":"Der Mailstrom läuft durch Nextcloud. Eine Spitze darf die Mitarbeiterin in Files nicht treffen. Schritt 1 ist zugleich der Test dafür.","De mappen staan in ELSA. Het mailprogramma ziet ze via IMAP.":"Die Ordner liegen in ELSA. Das Mailprogramm sieht sie über IMAP.","De medewerker kiest Persoonlijk in het paneel, of sleept het bericht naar de map Persoonlijk.":"Die Mitarbeiterin wählt „Persönlich“ im Bereich oder zieht die Nachricht in den Ordner „Persönlich“.","De medewerker opent in Files de map E-mail, en daarin een dossier of een maand.":"Die Mitarbeiterin öffnet in Files den Ordner E-Mail und darin eine Akte oder einen Monat.","De nieuwe Outlook en Outlook op het web laden webinvoegtoepassingen alleen bij een Microsoft-account, en COM-invoegtoepassingen werken daar niet. Wat dan wel werkt:":"Das neue Outlook und Outlook im Web laden Web-Add-ins nur bei einem Microsoft-Konto, und COM-Add-ins funktionieren dort nicht. Was stattdessen funktioniert:","De nieuwe Outlook heeft geen paneel. Hoe langer Outlook (klassiek) blijft, hoe beter; daarna blijven Thunderbird en de webmail van ELSA.":"Das neue Outlook hat keinen Bereich. Je länger Outlook (klassisch) bleibt, desto besser; danach bleiben Thunderbird und die Webmail von ELSA.","De opslag levert de EML. Is het bericht persoonlijk, dan ontsleutelt de IMAP-server het met de sleutel van de gebruiker, die pas na aanmelding vrijkomt.":"Der Speicher liefert die EML. Ist die Nachricht persönlich, entschlüsselt der IMAP-Server sie mit dem Schlüssel des Benutzers, der erst nach der Anmeldung freigegeben wird.","De opslag van de e-mailarchivering komt in de nieuwe Nextcloud-stack. Nextcloud Files biedt WebDAV, geen IMAP. Er komt dus een IMAP-server naast. De vraag is waar de berichten dan staan.":"Der Speicher der E-Mail-Archivierung kommt in den neuen Nextcloud-Stack. Nextcloud Files bietet WebDAV, kein IMAP. Daneben kommt also ein IMAP-Server. Die Frage ist, wo die Nachrichten dann liegen.","De opsteller kiest of het stuk onder een Woo-categorie valt.":"Der Verfasser wählt, ob das Dokument unter eine Woo-Kategorie fällt.","De orchestrator pakt het EML-bestand uit: kop, tekst en bijlagen.":"Der Orchestrator packt die EML-Datei aus: Kopfzeilen, Text und Anhänge.","De persoonlijke sleutel komt pas vrij na aanmelding, alleen voor de sessie van de eigenaar.":"Der persönliche Schlüssel wird erst nach der Anmeldung freigegeben, nur für die Sitzung des Eigentümers.","De postbus in het mailprogramma":"Das Postfach im Mailprogramm","De prijs: een piek in de mailstroom komt bij Nextcloud terecht. Daarom draaien de achtergrondtaken op eigen servers, los van die voor de medewerkers. En wat NiFi per bericht zou vastleggen, controleert ELSA nu zelf.":"Der Preis: Eine Spitze im Mailstrom landet bei Nextcloud. Deshalb laufen die Hintergrundaufgaben auf eigenen Servern, getrennt von denen für die Beschäftigten. Und was NiFi je Nachricht festhalten würde, prüft ELSA jetzt selbst.","De sleutelkluis met vrijgave per sessie en een sleutel per object, de procedures van de gemeentesecretaris en de informatiebeheerder, de koppeling met de Woo-dossiers in XENA.":"Der Schlüsseltresor mit Freigabe je Sitzung und einem Schlüssel je Objekt, die Verfahren des Gemeindesekretärs und des Records Managers, die Verknüpfung mit den Woo-Akten in XENA.","De sleutelkluis met vrijgave per sessie, de procedure van de gemeentesecretaris, de koppeling met de Woo-dossiers in XENA.":"Der Schlüsseltresor mit Freigabe je Sitzung, das Verfahren des Gemeindesekretärs, die Verknüpfung mit den Woo-Akten in XENA.","De tekst gaat naar de zoekindex. Bijlagen worden eigen objecten, verbonden met het bericht.":"Der Text geht in den Suchindex. Anhänge werden eigene Objekte, verbunden mit der Nachricht.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"Der Zugriff gilt nur für den genannten Zeitraum und erlischt automatisch. Jedes Öffnen einer Nachricht mit diesem Schlüssel wird protokolliert.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"Die Arbeitsanweisung Gebühren 2026 ist freigegeben. Sie finden sie im Arbeitsordner des Teams.","De zaak komt uit het zaaksysteem, dat leidend blijft. ELSA legt alleen de koppeling vast, als kenmerk.":"Der Vorgang stammt aus dem Vorgangssystem, das maßgeblich bleibt. ELSA speichert nur die Verknüpfung, als Merkmal.","De zoekindex van ELSA geeft alleen zakelijke berichten. Vertrouwelijke berichten alleen aan wie daar recht op heeft.":"Der Suchindex von ELSA liefert nur dienstliche Nachrichten. Vertrauliche Nachrichten nur an Berechtigte.","De zoekindex volgt het register. Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"Der Suchindex folgt dem Register. Betreff, Text und Anhänge werden durchsuchbar, nur für Berechtigte.","Deel I legt de asynchrone verwerking in ADR-0005 bij NiFi, los van de laag die gebruikers bedient.":"Teil I weist die asynchrone Verarbeitung in ADR-0005 NiFi zu, getrennt von der Schicht, die die Nutzer bedient.","Delegeren aan de concerncontroller":"An den Konzerncontroller delegieren","Demo":"Demo","Demo: {0} dagen later":"Demo: {0} Tage später","Deze map is leeg.":"Dieser Ordner ist leer.","Dezelfde laag als voor de kantoorpakketten. Het mailprogramma zelf praat rechtstreeks IMAP; de assistent alleen via deze laag.":"Dieselbe Schicht wie für die Office-Pakete. Das E-Mail-Programm selbst spricht direkt IMAP; der Assistent nur über diese Schicht.","Dezelfde taal en dezelfde bouwstenen als de rest van XENA, een ruime licentie en een opslaglaag die bedoeld is om te vervangen. Het risico zit in Sieve: ManageSieve staat in de documentatie nog als experimenteel, en ELSA leunt op filters.":"Dieselbe Sprache und dieselben Bausteine wie der Rest von XENA, eine großzügige Lizenz und eine Speicherschicht, die zum Austauschen gedacht ist. Das Risiko liegt bei Sieve: ManageSieve gilt in der Dokumentation noch als experimentell, und ELSA stützt sich auf Filter.","Dit bericht":"Diese Nachricht","Dit bericht is automatisch verstuurd.":"Diese Nachricht wurde automatisch versendet.","Dit bericht is gekoppeld aan een zaak of dossier. Ontkoppel eerst.":"Diese Nachricht ist mit einem Vorgang oder einer Akte verknüpft. Lösen Sie zuerst die Verknüpfung.","Dit bericht is na de bedenktijd op verzoek persoonlijk gemaakt. Het register houdt vast dat het bestond, met afzender, datum en het besluit. De vergrendelde versie is onleesbaar.":"Diese Nachricht wurde nach der Bedenkzeit auf Antrag persönlich gemacht. Das Register hält fest, dass sie existierte, mit Absender, Datum und Entscheidung. Die gesperrte Fassung ist unlesbar.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"Diese Nachricht ist mit Ihrem persönlichen Schlüssel gespeichert. Im Speicher ist sie unlesbar, auch für Administratoren.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"Diese Nachricht kann sowohl dienstlich als auch persönlich sein.","Dit bericht valt onder een lopend Woo-verzoek en kan niet persoonlijk worden.":"Diese Nachricht fällt unter einen laufenden Woo-Antrag und kann nicht persönlich werden.","Dit bericht valt onder een lopend Woo-verzoek. Zolang dat loopt, kan het niet persoonlijk worden, ook niet op verzoek.":"Diese Nachricht fällt unter einen laufenden Woo-Antrag. Solange dieser läuft, kann sie nicht persönlich werden, auch nicht auf Antrag.","Dit is de Office Assistent in de mailomgeving, met de module E-mailarchivering. Het is dezelfde assistent als in de kantoorpakketten. Hij roept ELSA aan via de integratielaag en werkt naast IMAP, niet in plaats daarvan.":"Dies ist der Office-Assistent in der Mailumgebung, mit dem Modul E-Mail-Archivierung. Es ist derselbe Assistent wie in den Office-Paketen. Er ruft ELSA über die Integrationsschicht auf und arbeitet neben IMAP, nicht an dessen Stelle.","Dit is je eigen vermelding. Aanpassen doe je onder Mijn vermelding.":"Das ist Ihr eigener Eintrag. Ändern können Sie ihn unter Mein Eintrag.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"Wenn Sie nichts tun, gilt die Nachricht nach zehn Tagen als dienstlich. Persönlich bedeutet: in den Ordner Persönlich verschoben, mit Ihrem eigenen Schlüssel verschlüsselt und außerhalb des Suchbereichs für die Woo.","Doorgeven":"Weiterleiten","Doorstroom":"Weg","Doorstroom van een bericht":"Weg einer Nachricht","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Weiterleiten ist nur an eine Adresse einer angeschlossenen Gemeinde erlaubt.","Dossier R-{0}-{1}":"Akte R-{0}-{1}","Dossier of zaak":"Akte oder Vorgang","Dossiers":"Akten","Dossiersleutels en persoonlijke sleutels":"Aktenschlüssel und persönliche Schlüssel","Dubbele berichten":"Doppelte Nachrichten","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"E-Mails in XENA archivieren: jede Nachricht im Register, ganz normal lesbar im eigenen Mailprogramm.","E-mailadres":"E-Mail-Adresse","E-mailarchivering binnen XENA":"E-Mail-Archivierung in XENA","ELSA":"ELSA","ELSA bij dit bericht":"ELSA zu dieser Nachricht","ELSA registreert geen zaken. Het zaaksysteem blijft leidend; ELSA legt de koppeling vast als kenmerk, via de Zaken API.":"ELSA registriert keine Vorgänge. Das Vorgangssystem bleibt maßgeblich; ELSA speichert die Verknüpfung als Merkmal, über die Zaken API.","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA setzt nicht zugeordnete Nachrichten nach zehn Tagen auf dienstlich","EXPUNGE haalt het bericht uit de map van de medewerker. Het object blijft, zolang de bewaartermijn loopt.":"EXPUNGE nimmt die Nachricht aus dem Ordner der Mitarbeiterin. Das Objekt bleibt, solange die Aufbewahrungsfrist läuft.","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"Ein Adressbuch der Mitarbeitenden der angeschlossenen Gemeinden. Alle entscheiden selbst, ob und mit welchen Angaben sie darin stehen. Jede Gemeinde verwaltet ihren eigenen Teil und teilt ihn über CardDAV.","Een bericht kan in meer dossiers zitten. Het dossier verwijst naar het bericht; er wordt niets gekopieerd.":"Eine Nachricht kann in mehreren Akten liegen. Die Akte verweist auf die Nachricht; es wird nichts kopiert.","Een bericht komt binnen":"Eine Nachricht kommt an","Een bericht van een winkel over iets privés.":"Eine Nachricht eines Geschäfts zu etwas Privatem.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"Eine tägliche Übersicht von ELSA mit den Nachrichten, die noch zugeordnet werden müssen.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Eine Demo, kein Produkt. Alle Beispieldaten sind erfunden: Personen, Adressen, Akten und Vorgangsnummern existieren nicht. Die Demo zeigt, was die Architektur ermöglicht; ein Teil der Funktionen ist Zukunftsbild.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"Ein Filter darf nicht nach „Persönlich“ verschieben. Ob eine Nachricht persönlich ist, entscheiden Sie selbst, für jede Nachricht einzeln.","Een gewone IMAP-server met eigen opslag op schijf, en daarnaast een kopie van elk bericht in Nextcloud.":"Ein gewöhnlicher IMAP-Server mit eigenem Speicher auf der Festplatte und daneben eine Kopie jeder Nachricht in Nextcloud.","Een kleine dienst leest het bericht uit Kafka, kijkt in het register of de Message-ID er al is en pakt het uit: kop, tekst en bijlagen.":"Ein kleiner Dienst liest die Nachricht aus Kafka, prüft im Register, ob die Message-ID schon vorhanden ist, und packt sie aus: Kopfzeilen, Text und Anhänge.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"Ein Mailprogramm erwartet, dass Löschen gelingt. ELSA nimmt die Nachricht aus dem Ordner, das Objekt bleibt aber erhalten, solange die Aufbewahrungsfrist läuft.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"Ein Newsletter: dienstlich, mit kurzer Aufbewahrungsfrist.","Een opvolger voor agenda en vrij/bezet, en mailprogramma's die daarmee overweg kunnen.":"Ein Nachfolger für Kalender und Frei/Gebucht sowie Mailprogramme, die damit umgehen können.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"Eine persönliche Nachricht bleibt persönlich. Halten Sie sie doch für dienstlich, wählen Sie zuerst Dienstlich in ELSA.","Een postbus is iets anders dan een archief. Medewerkers verwachten snelheid, zoeken in de eigen mappen en offline werken. De proefgroep in stap 2 moet dat toetsen voordat iedereen overgaat.":"Ein Postfach ist etwas anderes als ein Archiv. Beschäftigte erwarten Geschwindigkeit, Suche in den eigenen Ordnern und Offline-Arbeit. Die Pilotgruppe in Schritt 2 muss das prüfen, bevor alle umsteigen.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"Eine Transportregel leitet jede Nachricht, ein- und ausgehend, als EML an Kafka weiter.","Een verzoek is niet mogelijk zolang er een Woo-verzoek loopt waar het bericht onder valt. Elk besluit, en elke vernietigde sleutel, staat in het logboek, dat de archivaris kan inzien.":"Eine Anfrage ist nicht möglich, solange ein Woo-Antrag läuft, unter den die Nachricht fällt. Jede Entscheidung und jeder vernichtete Schlüssel steht im Protokoll, das die Archivarin oder der Archivar einsehen kann.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"Eine gesendete Nachricht kommt zweimal an: über die Transportregel und als Kopie aus dem Mailprogramm. ELSA entfernt Duplikate anhand der Message-ID.","Een zaak of dossier met een Woo-categorie gaat voor op een eigen keuze.":"Ein Vorgang oder eine Akte mit Woo-Kategorie hat Vorrang vor einer eigenen Wahl.","Een zaak of dossier met een categorie gaat voor op een eigen keuze. Gelijk aan de demo over e-mailarchivering.":"Ein Vorgang oder eine Akte mit Kategorie hat Vorrang vor einer eigenen Wahl. Wie in der Demo zur E-Mail-Archivierung.","Een zaaksysteem dat op omschrijving kan zoeken, of een eigen index van zaken.":"Ein Vorgangssystem, das nach Beschreibung suchen kann, oder ein eigener Index der Vorgänge.","Eerst, naast de bestaande postbus":"Zuerst, neben dem bestehenden Postfach","Eerste beoordeling: toekennen":"Erste Prüfung: stattgeben","Eerste beoordeling: toekennen. Wacht op de tweede beoordelaar.":"Erste Prüfung: stattgeben. Warten auf die zweite Prüfperson.","Eerste kandidaat: Apache James.":"Erster Kandidat: Apache James.","Eigen keuze, vervangen door de categorie van de zaak of het dossier.":"Eigene Wahl, ersetzt durch die Kategorie des Vorgangs oder der Akte.","Eigen opslag aankoppelen":"Eigenen Speicher anbinden","Elk bericht als EML door, zonder kopie":"Jede Nachricht als EML weiter, ohne Kopie","Elk bericht als EML · bekijk de stappen":"Jede Nachricht als EML · Schritte ansehen","Elk bericht gaat via Exchange Online en Kafka naar een kleine brug, die het in Nextcloud wegschrijft. Daarna loopt het langs dezelfde weg als een bestand op een netwerkschijf. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Jede Nachricht gelangt über Exchange Online und Kafka zu einer kleinen Brücke, die sie in Nextcloud schreibt. Danach nimmt sie denselben Weg wie eine Datei auf einem Netzlaufwerk. Innerhalb einer Sekunde steht sie im Register, im Objektspeicher und im Suchindex. In Exchange bleibt keine Kopie zurück.","Elk bericht gaat via Exchange Online, Kafka en de orchestrator naar ELSA. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Jede Nachricht gelangt über Exchange Online, Kafka und den Orchestrator zu ELSA. Innerhalb einer Sekunde steht sie im Register, im Objektspeicher und im Suchindex. In Exchange bleibt keine Kopie zurück.","Elk zakelijk bericht krijgt een eigen sleutel in de sleutelkluis. Zo kan een vergrendelde versie onleesbaar worden gemaakt zonder hem te verwijderen, als een verzoek om hem persoonlijk te maken wordt toegekend.":"Jede dienstliche Nachricht erhält einen eigenen Schlüssel im Schlüsseltresor. So kann eine gesperrte Fassung unlesbar gemacht werden, ohne sie zu löschen, wenn einem Antrag auf Persönlich-Machen stattgegeben wird.","Elke IMAP-handeling wordt een WebDAV-aanroep: traag bij grote postbussen.":"Jede IMAP-Aktion wird ein WebDAV-Aufruf: langsam bei großen Postfächern.","Elke IMAP-server kan het, ook Dovecot zonder aanpassing.":"Jeder IMAP-Server kann das, auch Dovecot ohne Anpassung.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Jeder Anhang ist ein eigenes Objekt im Speicher, verbunden mit der Nachricht. So lässt sich ein Anhang einzeln finden, aufbewahren und veröffentlichen.","Elke dag: alles wat in Kafka stond, staat ook in het register. Dat vervangt de herkomstregistratie die NiFi zou bieden.":"Täglich: Alles, was in Kafka stand, steht auch im Register. Das ersetzt den Herkunftsnachweis, den NiFi bieten würde.","Elke ingang doet waar hij goed in is: IMAP voor de postbus, WebDAV voor het dossier.":"Jeder Zugang tut, was er gut kann: IMAP für das Postfach, WebDAV für die Akte.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"Für die Adresse Kleverlaan 14 wurde ein neuer Antrag eingereicht. Der Antrag und die Zeichnungen sind als Anhang beigefügt.","Er is één exemplaar van elk bericht. De ingangen verwijzen ernaar; geen ervan houdt een eigen kopie.":"Es gibt ein Exemplar jeder Nachricht. Die Zugänge verweisen darauf; keiner hält eine eigene Kopie.","Er is één exemplaar van elk bericht. Metagegevens, bewaartermijn en zoekindex gaan zoals bij de netwerkschijven, via het register en de apps rond Nextcloud. Er is geen aparte orchestrator.":"Es gibt ein Exemplar jeder Nachricht. Metadaten, Aufbewahrungsfrist und Suchindex laufen wie bei den Netzlaufwerken, über das Register und die Apps rund um Nextcloud. Es gibt keinen eigenen Orchestrator.","Evenementen":"Veranstaltungen","Evenementenbeleid kustgemeenten":"Veranstaltungspolitik Küstengemeinden","Evenementenvergunning":"Veranstaltungsgenehmigung","Evenementenvergunning circuit 2027":"Veranstaltungsgenehmigung Rennstrecke 2027","Exchange":"Exchange","Exchange Online":"Exchange Online","Exchange Online ontvangt het bericht via SMTP. Een transport rule stuurt het als EML door naar Kafka en laat geen kopie achter in de postbus.":"Exchange Online empfängt die Nachricht über SMTP. Eine Transportregel leitet sie als EML an Kafka weiter und lässt keine Kopie im Postfach zurück.","Exchange Online verzendt en ontvangt; ELSA bewaart. Alles na de aanvoer staat in de Nextcloud-stack van XENA. Zo kan de mailprovider later worden vervangen zonder dat het archief verhuist.":"Exchange Online sendet und empfängt; ELSA bewahrt auf. Alles nach der Zulieferung liegt im Nextcloud-Stack von XENA. So lässt sich der Mailanbieter später ersetzen, ohne dass das Archiv umzieht.","Extensie of COM-invoegtoepassing, via de API van ELSA":"Erweiterung oder COM-Add-in, über die API von ELSA","Eén EML per bericht, onveranderlijk, met bewaarvergrendeling":"Eine EML je Nachricht, unveränderlich, mit Aufbewahrungssperre","Eén bericht, drie plekken die ernaar kijken":"Eine Nachricht, drei Stellen, die darauf blicken","Eén exemplaar, onveranderlijk, met bewaarvergrendeling.":"Ein Exemplar, unveränderlich, mit Aufbewahrungssperre.","Eén keer verwerken · bekijk de stappen":"Einmal verarbeiten · Schritte ansehen","Eén keer wegschrijven · bekijk de stappen":"Einmal wegschreiben · Schritte ansehen","Eén object in de opslag, twee ingangen":"Ein Objekt im Speicher, zwei Zugänge","Eén object in de opslag, twee ingangen: IMAP en WebDAV":"Ein Objekt im Speicher, zwei Zugänge: IMAP und WebDAV","Eén opslag, die Nextcloud beheert.":"Ein Speicher, den Nextcloud verwaltet.","Favoriet":"Favorit","Favorieten":"Favoriten","Files toont een virtuele map. De inhoud komt uit het register, niet uit een eigen kopie (PROPFIND).":"Files zeigt einen virtuellen Ordner. Der Inhalt kommt aus dem Register, nicht aus einer eigenen Kopie (PROPFIND).","Filter toegevoegd.":"Filter hinzugefügt.","Filter toevoegen":"Filter hinzufügen","Filters":"Filter","Filters (Sieve)":"Filter (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Filter laufen in ELSA selbst, sobald eine Nachricht eingeht. Sie wirken also in jedem Mailprogramm und auf jedem Gerät. Manche Aktionen sind nicht erlaubt, weil sie die Trennung zwischen dienstlich und persönlich umgehen würden.","Filters van de medewerker":"Filter der Mitarbeitenden","Foto's van de vakantie":"Urlaubsfotos","Functie":"Funktion","Geachte aanvrager,":"Sehr geehrte Antragstellerin, sehr geehrter Antragsteller,","Gedelegeerd":"Delegiert","Geef een reden op.":"Geben Sie einen Grund an.","Geen":"Keine","Geen NiFi: een bewuste afwijking van XENA Deel I":"Kein NiFi: eine bewusste Abweichung von XENA Teil I","Geen assistent in Outlook":"Kein Assistent in Outlook","Geen assistent in de nieuwe Outlook":"Kein Assistent im neuen Outlook","Geen categorie":"Keine Kategorie","Geen categorie: alleen openbaar op verzoek":"Keine Kategorie: nur auf Antrag öffentlich","Geen dossier gevonden.":"Keine Akte gefunden.","Geen eigen IMAP-server: alleen de koppelingen eromheen.":"Kein eigener IMAP-Server: nur die Anbindungen drumherum.","Geen kopie meer in Exchange, voor de proefgroep":"Keine Kopie mehr in Exchange, für die Pilotgruppe","Geen verzoeken.":"Keine Anfragen.","Geen zaak gevonden. Zaken komen uit het zaaksysteem; een nieuwe zaak maak je daar aan.":"Kein Vorgang gefunden. Vorgänge kommen aus dem Vorgangssystem; einen neuen Vorgang legen Sie dort an.","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Daten an der Quelle: Die Nachricht liegt einmal vor, und wer sie braucht, verweist darauf.","Geheimen":"Geheimnisse","Gekoppeld aan een zaak":"Mit einem Vorgang verknüpft","Gekoppeld aan zaak {0}.":"Mit Vorgang {0} verknüpft.","Gekoppeld aan {0}. Ontkoppel eerst; ook dat wordt vastgelegd.":"Verknüpft mit {0}. Lösen Sie zuerst die Verknüpfung; auch das wird festgehalten.","Gekozen, nog te herzien":"Gewählt, noch änderbar","Gelezen, vlag en label staan alleen in de IMAP-server. Leesstatus is geen archiefgegeven en komt niet in het register.":"Gelesen, Markierung und Schlagwort liegen nur im IMAP-Server. Der Lesestatus ist keine Archivangabe und kommt nicht ins Register.","Gelezen, vlag, label":"Gelesen, Markierung, Schlagwort","Gemaakt door":"Erstellt von","Gemeente":"Gemeinde","Gemeente Bloemendaal":"Gemeinde Bloemendaal","Gemeente Haarlem":"Stadt Haarlem","Gemeente Heemstede":"Gemeinde Heemstede","Gemeente Velsen":"Gemeinde Velsen","Gemeente Zandvoort":"Gemeinde Zandvoort","Gemeentelijk adresboek":"Kommunales Adressbuch","Gemeentesecretaris":"Gemeindesekretär","Gevonden":"Gefunden","Gevonden berichten gaan per verwijzing naar het Woo-dossier in XENA. Er wordt niets gekopieerd.":"Gefundene Nachrichten gehen per Verweis in die Woo-Akte in XENA. Es wird nichts kopiert.","Geweigerd":"Abgelehnt","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Gute Nachricht: Die Reparatur ist fertig. Sie können Ihr Fahrrad bis 18:00 Uhr abholen.","Gooi weg":"Löschen","Groeipad":"Ausbaupfad","Groet, Lotte Visser":"Viele Grüße, Lotte Visser","Groet, Noor":"Gruß, Noor","Haal mij uit het adresboek":"Mich aus dem Adressbuch entfernen","Handeling":"Aktion","Help":"Hilfe","Herinrichting Houtplein":"Umgestaltung Houtplein","Herzien kan tot {0}.":"Ändern ist bis {0} möglich.","Het Common Ground-team en het samenwerkingsverband OWC":"Das Common-Ground-Team und den Verbund OWC","Het EML-bestand en de bijlagen gaan de objectopslag in, met versiebeheer.":"Die EML-Datei und die Anhänge gehen in den Objektspeicher, mit Versionsverwaltung.","Het Woo-dossier is in Files een map met dezelfde berichten. Na beoordeling gaat de openbare versie naar TINA.":"Die Woo-Akte ist in Files ein Ordner mit denselben Nachrichten. Nach der Prüfung geht die öffentliche Fassung an TINA.","Het adresboek staat ook in het paneel van de assistent.":"Das Adressbuch steht auch im Bereich des Assistenten.","Het bericht en elke bijlage krijgen een eigen identificatie. De metagegevens worden vastgelegd; de aard is nog open.":"Die Nachricht und jeder Anhang erhalten eine eigene Kennung. Die Metadaten werden festgehalten, die Art ist noch offen.","Het bericht gaat via Exchange Online de deur uit en komt via de transport rule terug in ELSA, onder Verzonden items.":"Die Nachricht verlässt das Haus über Exchange Online und kommt über die Transportregel zurück in ELSA, unter Gesendete Elemente.","Het bericht is vergrendeld. Persoonlijk maken kan alleen op verzoek, bij de informatiebeheerder.":"Die Nachricht ist gesperrt. Persönlich machen ist nur auf Antrag beim Records Manager möglich.","Het bericht komt binnen bij de mailprovider. Een transport rule stuurt het als EML door en houdt geen kopie.":"Die Nachricht kommt beim Mailanbieter an. Eine Transportregel leitet sie als EML weiter und behält keine Kopie.","Het bericht komt op een wachtrij. Zo gaat er niets verloren als een volgende stap even niet bereikbaar is.":"Die Nachricht landet in einer Warteschlange. So geht nichts verloren, wenn ein nächster Schritt kurz nicht erreichbar ist.","Het bericht staat in Postvak IN. Het mailprogramma ziet het bij de volgende synchronisatie.":"Die Nachricht liegt im Posteingang. Das Mailprogramm sieht sie bei der nächsten Synchronisierung.","Het bericht staat één keer in de objectopslag van XENA, beschreven in het register. De IMAP-server en Nextcloud Files verwijzen er allebei naar.":"Die Nachricht liegt einmal im Objektspeicher von XENA, beschrieben im Register. Der IMAP-Server und Nextcloud Files verweisen beide darauf.","Het bericht verdwijnt uit de virtuele mappen in Files, en de tekst uit de zoekindex.":"Die Nachricht verschwindet aus den virtuellen Ordnern in Files und der Text aus dem Suchindex.","Het bericht wordt één keer via Nextcloud weggeschreven, zoals een bestand, en staat dan in de objectopslag, beschreven in het register. De IMAP-server leest het via het register uit de opslag; Files toont het.":"Die Nachricht wird einmal über Nextcloud weggeschrieben, wie eine Datei, und liegt dann im Objektspeicher, beschrieben im Register. Der IMAP-Server liest sie über das Register aus dem Speicher; Files zeigt sie an.","Het bericht zelf, zoals het wordt bewaard":"Die Nachricht selbst, so wie sie aufbewahrt wird","Het documenttype bepaalt de Woo-categorie, tot de opsteller kiest of koppelt.":"Die Dokumentart bestimmt die Woo-Kategorie, bis der Verfasser wählt oder verknüpft.","Het enige onderdeel dat er voor de mail bij komt. Daarna loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"Der einzige Baustein, der für die E-Mail hinzukommt. Danach nimmt eine Nachricht denselben Weg wie eine Datei auf einem Netzlaufwerk.","Het gemeentelijk adresboek":"Das Gemeindeadressbuch","Het gemeentelijk adresboek gebruiken in de webmail van ELSA. De nieuwe Outlook kent geen CardDAV.":"Das Gemeindeadressbuch im Webmail von ELSA nutzen. Das neue Outlook unterstützt kein CardDAV.","Het gesprek over archiveren van e-mail aan de bron, zonder kopie bij de leverancier van de mailserver":"Das Gespräch über die Archivierung von E-Mail an der Quelle, ohne Kopie beim Anbieter des Mailservers","Het mailprogramma haalt berichten op via IMAP4. Inzien, verplaatsen en versleutelen gaan via ELSA; filters draaien als Sieve.":"Das Mailprogramm ruft Nachrichten über IMAP4 ab. Lesen, Verschieben und Verschlüsseln laufen über ELSA, Filter laufen als Sieve.","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Filters als Sieve.":"Das Mailprogramm holt die E-Mails über IMAP aus ELSA. Zuordnen innerhalb von zehn Tagen. Filter als Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Das Mailprogramm kann Filter auch selbst über ManageSieve verwalten. ELSA prüft jedes Skript, bevor es gespeichert wird.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"Das Mailprogramm sendet eine neue Nachricht über SMTP an Exchange Online.","Het meest compleet uit de doos, met CardDAV voor het adresboek erbij. Maar een eigen opslagkoppeling betekent werken in de code van één bedrijf, en een deel van de functies zit in de betaalde editie.":"Am vollständigsten ab Werk, mit CardDAV für das Adressbuch dazu. Aber eine eigene Speicheranbindung bedeutet Arbeit im Code eines einzigen Unternehmens, und ein Teil der Funktionen steckt in der kostenpflichtigen Edition.","Het object wordt opnieuw opgeslagen, versleuteld met de persoonlijke sleutel. De onversleutelde versie vervalt. Dat kan, omdat de bewaarvergrendeling pas ingaat als een bericht zakelijk is.":"Das Objekt wird neu gespeichert, verschlüsselt mit dem persönlichen Schlüssel. Die unverschlüsselte Fassung entfällt. Das ist möglich, weil die Aufbewahrungssperre erst greift, wenn eine Nachricht dienstlich ist.","Het onderwerp noemt een lopend Woo-verzoek.":"Der Betreff nennt einen laufenden Woo-Antrag.","Het paneel in Thunderbird en Outlook (klassiek): scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"Der Bereich in Thunderbird und Outlook (klassisch): zuordnen, ergänzen, mit Vorgang und Akte verknüpfen. Das Gemeindeadressbuch.","Het register geeft de berichten en de rechten. Alleen zakelijke berichten waar de medewerker bij mag. Persoonlijke berichten staan er nooit in.":"Das Register liefert die Nachrichten und die Rechte. Nur dienstliche Nachrichten, auf die die Mitarbeiterin Zugriff hat. Persönliche Nachrichten stehen nie darin.","Het register legt de aard persoonlijk vast, met wie en wanneer. Het bericht valt buiten het zoekbereik voor de Woo.":"Das Register hält die Art „persönlich“ fest, durch wen und wann. Die Nachricht fällt aus dem Suchbereich für die Woo.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd.":"Das Register hält die Nachricht fest: Message-ID, Absender, Empfänger, Datum und die Art „noch zuzuordnen“, mit zehn Tagen Bedenkzeit.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd. De zoekindex volgt het register.":"Das Register hält die Nachricht fest: Message-ID, Absender, Empfänger, Datum und die Art „noch zuzuordnen“, mit zehn Tagen Bedenkzeit. Der Suchindex folgt dem Register.","Het register meldt elk nieuw bericht aan de IMAP-server, die het in de juiste map zet met een verwijzing naar het object.":"Das Register meldet jede neue Nachricht an den IMAP-Server, der sie in den richtigen Ordner legt, mit einem Verweis auf das Objekt.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"Das Register meldet die neue Nachricht an den IMAP-Server. Dieser speichert keine zweite Kopie: Er verweist auf das Objekt und führt nur UID, Ordner und Markierungen.","Het register meldt het nieuwe bericht aan de IMAP-server. Die zet het in Postvak IN, met een verwijzing naar het object.":"Das Register meldet die neue Nachricht an den IMAP-Server. Dieser legt sie im Posteingang ab, mit einem Verweis auf das Objekt.","Hetzelfde bericht in Nextcloud Files":"Dieselbe Nachricht in Nextcloud Files","Hier zijn de foto's.":"Hier sind die Fotos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Anbei der Entwurf des Projektplans. Kannst du dir vor allem den Abschnitt über Genehmigungen für Terrassen ansehen?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Hallo San, bringst du am Samstag den Kuchen mit? Oma zählt auf dich. Liebe Grüße, Ellen","Hoi Sanne,":"Hallo Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP MOVE naar Persoonlijk. De IMAP-server meldt de keuze aan ELSA.":"IMAP MOVE nach „Persönlich“. Der IMAP-Server meldet die Wahl an ELSA.","IMAP en LMTP; SMTP via Postfix":"IMAP und LMTP; SMTP über Postfix","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP betrifft nur Mail. Der Kalender bleibt vorerst in Exchange, das Adressbuch läuft über CardDAV.","IMAP naast WebDAV":"IMAP neben WebDAV","IMAP, SMTP, LMTP":"IMAP, SMTP, LMTP","IMAP, uit ELSA":"IMAP, aus ELSA","IMAP-server":"IMAP-Server","IMAP-server naast Nextcloud Files, op dezelfde objectopslag":"IMAP-Server neben Nextcloud Files, auf demselben Objektspeicher","IMAP-trefwoorden":"IMAP-Keywords","IMAP4 en ManageSieve: mappen, vlaggen en filters per gebruiker":"IMAP4 und ManageSieve: Ordner, Markierungen und Filter je Benutzer","IMAP4 en Sieve":"IMAP4 und Sieve","IMAP4rev2":"IMAP4rev2","Iedereen over, en andere gemeenten in het adresboek":"Alle steigen um, und weitere Gemeinden im Adressbuch","Ik ben afwezig":"Ich bin abwesend","Ik ben afwezig tot maandag.":"Ich bin bis Montag abwesend.","Ik ben afwezig. Je bericht wordt na mijn terugkomst gelezen.":"Ich bin abwesend. Ihre Nachricht wird nach meiner Rückkehr gelesen.","Ik ben terug":"Ich bin zurück","Ik was op vakantie. Het gaat om een inzameling onder collega's, niet over werk.":"Ich war im Urlaub. Es geht um eine Sammlung unter Kolleginnen und Kollegen, nicht um die Arbeit.","In behandeling":"In Bearbeitung","In de Nextcloud-stack doen het register en de apps rond Nextcloud dat werk al voor de netwerkschijven. ELSA volgt de netwerkschijven: minder onderdelen, één beheerteam, en mail en bestanden langs dezelfde weg.":"Im Nextcloud-Stack erledigen das Register und die Apps rund um Nextcloud diese Arbeit bereits für die Netzlaufwerke. ELSA folgt den Netzlaufwerken: weniger Bausteine, ein Betriebsteam, und E-Mails und Dateien auf demselben Weg.","In de browser of de bureaubladapp, via WebDAV":"Im Browser oder in der Desktop-App, über WebDAV","In de schets staat GreenMail. Dat is een testserver. Voor productie ligt een volwaardige IMAP-server met Sieve voor de hand, bijvoorbeeld Dovecot met Pigeonhole.":"In der Skizze steht GreenMail. Das ist ein Testserver. Für den Produktivbetrieb liegt ein vollwertiger IMAP-Server mit Sieve nahe, zum Beispiel Dovecot mit Pigeonhole.","In deze nieuwsbrief: de nieuwe handreiking voor actieve openbaarmaking, een webinar over de Omgevingswet en het laatste nieuws uit de regio.":"In diesem Newsletter: die neue Handreichung zur aktiven Veröffentlichung, ein Webinar zum Umweltgesetz (Omgevingswet) und das Neueste aus der Region.","In het echte systeem opent hier de webmail van ELSA, met hetzelfde paneel.":"Im echten System öffnet sich hier die Webmail von ELSA, mit demselben Bereich.","In het paneel: zoeken, een bericht beginnen en je eigen vermelding beheren, in elk mailprogramma met de assistent.":"Im Bereich: suchen, eine Nachricht beginnen und den eigenen Eintrag verwalten, in jedem Mailprogramm mit dem Assistenten.","In stap 1 staat de mail nog in Exchange. Dat is een tussenstap, geen eindbeeld: hij is er om te leren zonder dat iemand anders hoeft te werken.":"In Schritt 1 liegen die E-Mails noch in Exchange. Das ist ein Zwischenschritt, kein Zielbild: Er dient zum Lernen, ohne dass jemand anders arbeiten muss.","In vijf stappen, waarvan vier zonder de markt":"In fünf Schritten, davon vier ohne den Markt","Informatiebeheer":"Records Management","Informatiebeheerder":"Records Manager","Inhoud (EML)":"Inhalt (EML)","Integratielaag, aan de serverkant":"Integrationsschicht, auf der Serverseite","Interactieve demo, versie {0}":"Interaktive Demo, Version {0}","Intergemeentelijke samenwerking":"Interkommunale Zusammenarbeit","Intern":"Intern","Interne bedrijfsvoering":"Interner Dienstbetrieb","Internet Message Format (EML)":"Internet Message Format (EML)","Is dit bericht zakelijk of persoonlijk?":"Ist diese Nachricht dienstlich oder persönlich?","JMAP":"JMAP","Jaarplannen en jaarverslagen":"Jahrespläne und Jahresberichte","Java (vanaf 3.9 Java 21)":"Java (ab 3.9 Java 21)","Java-interface in een modulair ontwerp":"Java-Schnittstelle in einem modularen Entwurf","Je eigen keuze vervalt.":"Ihre eigene Wahl entfällt.","Je fiets is klaar om op te halen":"Ihr Fahrrad ist abholbereit","Je kunt je vermelding altijd aanpassen of intrekken. De wijziging gaat via CardDAV naar de andere gemeenten.":"Sie können Ihren Eintrag jederzeit ändern oder zurückziehen. Die Änderung geht über CardDAV an die anderen Gemeinden.","Je kunt zelf kiezen, of koppelen aan een zaak of dossier met een categorie. Die gaat dan voor.":"Sie können selbst wählen oder mit einem Vorgang oder einer Akte mit Kategorie verknüpfen. Diese hat dann Vorrang.","Je staat in het adresboek":"Sie stehen im Adressbuch","Je staat in het gemeentelijk adresboek.":"Sie stehen im kommunalen Adressbuch.","Je staat niet in het adresboek":"Sie stehen nicht im Adressbuch","Je staat nog niet in het adresboek. Collega's van andere gemeenten kunnen je dan niet vinden.":"Sie stehen noch nicht im Adressbuch. Kolleginnen und Kollegen anderer Gemeinden können Sie dann nicht finden.","Je vermelding is ingetrokken.":"Ihr Eintrag wurde zurückgezogen.","Juridische Zaken":"Rechtsamt","Kafka":"Kafka","Kapvergunning Houtplein":"Fällgenehmigung Houtplein","Kies":"Wählen","Kies een bericht.":"Wählen Sie eine Nachricht.","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Wählen Sie eine Aktion. Die Schritte zeigen, welcher Baustein was tut.","Kies zelf, of koppel het bericht aan een zaak of dossier met een categorie. Die gaat dan voor.":"Wählen Sie selbst oder verknüpfen Sie die Nachricht mit einem Vorgang oder einer Akte mit Kategorie. Diese hat dann Vorrang.","Kies zelf, of koppel het stuk aan een zaak of dossier met een categorie. Die gaat dan voor.":"Wählen Sie selbst oder verknüpfen Sie das Dokument mit einem Vorgang oder einer Akte mit Kategorie. Diese hat dann Vorrang.","Klachtoordelen":"Beschwerdeentscheidungen","Kopieer adres":"Adresse kopieren","Koppelen aan een zaak; het zaaksysteem blijft leidend":"Mit einem Vorgang verknüpfen; das Vorgangssystem bleibt maßgeblich","Label van ELSA, als IMAP-trefwoord":"Schlagwort von ELSA, als IMAP-Keyword","Labels":"Labels","Labels uit het register":"Schlagwörter aus dem Register","Later":"Später","Later: een moderne opvolger van IMAP voor webmail en apps":"Später: ein moderner Nachfolger von IMAP für Webmail und Apps","Leest elk bericht uit Kafka, kijkt in het register of de Message-ID er al is, pakt het uit en schrijft de EML en de bijlagen in Nextcloud. Klein, zonder eigen opslag.":"Liest jede Nachricht aus Kafka, prüft im Register, ob die Message-ID schon vorhanden ist, packt sie aus und schreibt die EML und die Anhänge in Nextcloud. Klein, ohne eigenen Speicher.","Legesverordening 2026":"Gebührensatzung 2026","Lezen en werken: IMAP, WebDAV en API · bekijk de stappen":"Lesen und arbeiten: IMAP, WebDAV und API · Schritte ansehen","Lezen in het mailprogramma":"Lesen im Mailprogramm","Licentie":"Lizenz","Lieve Sanne, we gaan trouwen! Je bent van harte welkom op zaterdag 14 november. Laat je weten of je komt?":"Liebe Sanne, wir heiraten! Du bist am Samstag, 14. November, herzlich willkommen. Sagst du uns, ob du kommst?","Liever niet":"Lieber nicht","Logboek":"Protokoll","Loopt uitsluitend tussen backendsystemen, niet via de werkplek. Vervangt een andere dienst Exchange, dan verandert alleen deze laag.":"Läuft ausschließlich zwischen Backend-Systemen, nicht über den Arbeitsplatz. Ersetzt ein anderer Dienst Exchange, ändert sich nur diese Schicht.","Lunch vrijdag?":"Mittagessen am Freitag?","MIT en LGPL 2.1":"MIT und LGPL 2.1","Mail en bestanden lopen langs dezelfde weg, met dezelfde regels.":"E-Mails und Dateien nehmen denselben Weg, mit denselben Regeln.","Mailomgeving":"Mailumgebung","Mailprogramma":"Mailprogramm","Mailprovider vervangen zonder dat het archief verhuist":"Mailanbieter ersetzen, ohne dass das Archiv umzieht","Map":"Ordner","Mappen":"Ordner","Markeer":"Markieren","Medewerker":"Mitarbeiterin","Medewerkers, informatiebeheerders en architecten van de gemeenten Haarlem en Zandvoort":"Beschäftigte, Records Manager und Architekten der Gemeinden Haarlem und Zandvoort","Melding":"Meldung","Melding aan de IMAP-server":"Meldung an den IMAP-Server","Melding openbare ruimte Kleverlaan":"Meldung öffentlicher Raum Kleverlaan","Memo parkeerdruk voor het Woo-verzoek Houtplein":"Memo Parkdruck für den Woo-Antrag Houtplein","Met assistentie van":"Mit Unterstützung von","Met een Exchange-postbus werkt de webinvoegtoepassing in elke Outlook, maar dan staat de mail bij Microsoft. Dat past niet bij de keuze voor een postbus in eigen beheer. Met ELSA blijft voor Outlook alleen de COM-invoegtoepassing in Outlook (klassiek) over.":"Mit einem Exchange-Postfach funktioniert das Web-Add-in in jedem Outlook, aber dann liegt die Mail bei Microsoft. Das passt nicht zur Entscheidung für ein Postfach in eigener Hand. Mit ELSA bleibt für Outlook nur das COM-Add-in in Outlook (klassisch).","Met een proefgroep":"Mit einer Pilotgruppe","Met vriendelijke groet, Jeroen Kramer":"Mit freundlichen Grüßen, Jeroen Kramer","Met vriendelijke groet, Sanne de Vries, Team Vergunningen":"Mit freundlichen Grüßen, Sanne de Vries, Team Genehmigungen","Metagegevens":"Metadaten","Metagegevens (register)":"Metadaten (Register)","Metagegevens aangevuld":"Metadaten ergänzt","Metagegevens aanvullen in de webmail van ELSA.":"Metadaten in der Webmail von ELSA ergänzen.","Metagegevens, aard, zaak en dossiers, rechten":"Metadaten, Art, Vorgang und Akten, Rechte","Metagegevens, aard, zaak en dossiers, rechten. Zet de bewaartermijn op de opslag.":"Metadaten, Art, Vorgang und Akten, Rechte. Setzt die Aufbewahrungsfrist im Speicher.","Mijn sleutel":"Mein Schlüssel","Mijn vermelding":"Mein Eintrag","Momentopname, deels aanname. Dezelfde tabel staat in de demo van de Office Assistent.":"Momentaufnahme, teils Annahme. Dieselbe Tabelle steht in der Demo des Office-Assistenten.","Na de bedenktijd is een zakelijk bericht vergrendeld. Persoonlijk maken onttrekt het aan het archief en kan daarom alleen met twee beoordelaars. Het register houdt altijd vast dat het bericht bestond.":"Nach der Bedenkzeit ist eine dienstliche Nachricht gesperrt. Persönlich machen entzieht sie dem Archiv und ist daher nur mit zwei Prüfpersonen möglich. Das Register hält immer fest, dass die Nachricht existierte.","Na de bedenktijd kan dit alleen op verzoek. De informatiebeheerder beslist, met een tweede beoordelaar. Wordt het toegekend, dan wordt de vergrendelde versie onleesbaar gemaakt; het register houdt vast dat het bericht bestond.":"Nach der Bedenkzeit ist das nur auf Antrag möglich. Der Records Manager entscheidet, mit einer zweiten Prüfperson. Wird stattgegeben, wird die gesperrte Fassung unlesbar gemacht; das Register hält fest, dass die Nachricht existierte.","Na tien dagen automatisch zakelijk":"Nach zehn Tagen automatisch dienstlich","Na tien dagen wordt een bericht zakelijk. Vul daarna de classificatie aan, zodat de bewaartermijn vastligt.":"Nach zehn Tagen gilt eine Nachricht als dienstlich. Ergänzen Sie dann die Klassifikation, damit die Aufbewahrungsfrist feststeht.","Na verzoek persoonlijk gemaakt; de vergrendelde versie is onleesbaar":"Auf Antrag persönlich gemacht; die gesperrte Fassung ist unlesbar","Naam":"Name","Naam en e-mailadres zijn nodig om je te kunnen vinden. De rest kies je zelf.":"Name und E-Mail-Adresse sind nötig, damit man Sie finden kann. Den Rest wählen Sie selbst.","Naar de API van ELSA en het register":"Zur API von ELSA und zum Register","Neem mij op in het adresboek":"Mich in das Adressbuch aufnehmen","Nextcloud":"Nextcloud","Nextcloud Files":"Nextcloud Files","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Een andere toepassing kan die objecten dus niet zomaar delen. Daarom loopt het delen in optie C via het register, en niet via de opslag van Nextcloud zelf.":"Nextcloud speichert Dateien im Objektspeicher unter einer eigenen internen Nummer, nicht unter ihrem Namen. Eine andere Anwendung kann diese Objekte also nicht ohne Weiteres mitnutzen. Deshalb läuft die gemeinsame Nutzung in Option C über das Register und nicht über den Speicher von Nextcloud selbst.","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Het register kent dat nummer en het versie-id, omdat Nextcloud ze na elke schrijfactie terugmeldt. Zo vindt de IMAP-server het object zonder via Nextcloud te lezen.":"Nextcloud speichert Dateien im Objektspeicher unter einer eigenen internen Nummer, nicht unter ihrem Namen. Das Register kennt diese Nummer und die Versions-ID, weil Nextcloud sie nach jedem Schreibvorgang zurückmeldet. So findet der IMAP-Server das Objekt, ohne über Nextcloud zu lesen.","Nextcloud heeft een app nodig die de virtuele map E-mail uit het register toont.":"Nextcloud braucht eine App, die den virtuellen Ordner E-Mail aus dem Register anzeigt.","Nextcloud maakt eerst het record in het register aan. Het bericht en elke bijlage krijgen een eigen identificatie; de aard is nog open.":"Nextcloud legt zuerst den Datensatz im Register an. Die Nachricht und jeder Anhang erhalten eine eigene Kennung; die Art ist noch offen.","Nextcloud moet de mailstroom aankunnen naast het werk van de medewerkers.":"Nextcloud muss den Mailstrom neben der Arbeit der Beschäftigten bewältigen.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug aan het register.":"Nextcloud schreibt den Inhalt über S3 weg und meldet die Versions-ID an das Register zurück.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug. De EML staat er één keer en verandert daarna nooit meer.":"Nextcloud schreibt den Inhalt über S3 weg und meldet die Versions-ID zurück. Die EML liegt dort einmal und ändert sich danach nie mehr.","Nextcloud wordt een knelpunt voor de mail.":"Nextcloud wird zum Engpass für die E-Mail.","Nextcloud-app E-mail":"Nextcloud-App E-Mail","Nextcloud-stack van XENA":"Nextcloud-Stack von XENA","NiFi":"NiFi","NiFi leest het bericht uit Kafka, berekent de hash en kijkt op Message-ID of het er al is. Een verzonden bericht komt zo maar één keer binnen.":"NiFi liest die Nachricht aus Kafka, berechnet den Hash und prüft anhand der Message-ID, ob sie schon vorhanden ist. Eine gesendete Nachricht kommt so nur einmal an.","NiFi levert elk bericht bij de IMAP-server af, met een verwijzing naar het object in plaats van de inhoud.":"NiFi stellt jede Nachricht beim IMAP-Server zu, mit einem Verweis auf das Objekt statt des Inhalts.","NiFi levert het bericht af bij de IMAP-server (LMTP). De IMAP-server bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"NiFi stellt die Nachricht beim IMAP-Server zu (LMTP). Der IMAP-Server speichert keine zweite Kopie: Er verweist auf das Objekt und führt nur UID, Ordner und Markierungen.","NiFi slaat het bericht real time op (binnen een seconde): metagegevens in het register, de inhoud in de objectopslag, de tekst in de zoekmachine.":"NiFi speichert die Nachricht in Echtzeit (innerhalb einer Sekunde): Metadaten im Register, Inhalt im Objektspeicher, Text in der Suchmaschine.","Niemand gevonden. Misschien staat deze collega niet in het adresboek: opname is vrijwillig.":"Niemand gefunden. Vielleicht steht diese Person nicht im Adressbuch: Die Aufnahme ist freiwillig.","Niet doen":"Nicht tun","Niet toegestaan: weggooien, verplaatsen naar Persoonlijk, doorsturen naar een adres buiten de gemeenten.":"Nicht erlaubt: löschen, nach Persönlich verschieben, an eine Adresse außerhalb der Gemeinden weiterleiten.","Niet uit zichzelf. Wel vindbaar bij een Woo-verzoek.":"Nicht von sich aus. Aber auffindbar bei einem Woo-Antrag.","Niets gevonden.":"Nichts gefunden.","Niets in het mailprogramma. De Woo-coördinator
