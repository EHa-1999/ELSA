:"CardDAV, CalDAV, WebDAV","CardDAV-server":"Serveur CardDAV","Cassandra of PostgreSQL":"Cassandra ou PostgreSQL","Categorie uit documenttype, zaak of dossier; termijn uit vaststelling of ontvangst":"Catégorie selon le type de document, la procédure ou le dossier ; délai à compter de l’arrêt ou de la réception","Classificatie":"Classement","Colofon":"Colophon","Concept projectplan Houtplein, graag reactie vóór vrijdag":"Projet de plan de projet Houtplein, merci de réagir avant vendredi","Concept. Dit is een volgorde, geen planning. Register en objectopslag staan er vanaf stap 1 en veranderen daarna niet meer: het archief verhuist nooit.":"Projet. Ceci est un ordre, pas un calendrier. Le registre et le stockage objet sont en place dès l'étape 1 et ne changent plus ensuite : l'archive ne déménage jamais.","Contact":"Contact","Controle bij verzenden":"Contrôle à l'envoi","Controle op volledigheid":"Contrôle d'exhaustivité","Convenanten":"Conventions (convenanten)","Copyright":"Droits d'auteur","Dan":"Alors","Dank je wel, Fatima":"Merci beaucoup, Fatima","Dat is in feite een archiefstuk onttrekken. Het kan alleen op verzoek, met twee beoordelaars, en het register houdt vast dat het bericht bestond. Of dit past binnen de Archiefwet en de selectielijst, moet de archivaris beoordelen.":"Cela revient en fait à soustraire une pièce d'archives. Ce n'est possible que sur demande, avec deux évaluateurs, et le registre consigne que le message a existé. C'est à l'archiviste d'évaluer si cela est conforme à l'Archiefwet et à la liste de sélection.","Dat kan nog 1 dag. Daarna wordt het bericht vergrendeld.":"C'est encore possible pendant 1 jour. Ensuite, le message sera verrouillé.","Dat kan nog {0} dagen. Daarna wordt het bericht vergrendeld.":"C'est encore possible pendant {0} jours. Ensuite, le message sera verrouillé.","Database":"Base de données","Datum":"Date","De API van ELSA achter de integratielaag van de Office Assistent, CardDAV, opzoeken in het register en via de Zaken API.":"L'API d'ELSA derrière la couche d'intégration de l'Assistant Office, CardDAV, recherche dans le registre et via la Zaken API.","De API van ELSA, CardDAV, opzoeken in het register en via de Zaken API.":"L'API d'ELSA, CardDAV, la consultation du registre et l'API Zaken.","De EML komt één keer in de objectopslag. Het object verandert daarna nooit meer.":"L'EML est déposé une seule fois dans le stockage objet. L'objet ne change plus jamais ensuite.","De IMAP-server bewaart zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Le serveur IMAP conserve ses messages comme fichiers dans Nextcloud Files, via WebDAV.","De IMAP-server heeft een eigen opslagkoppeling nodig.":"Le serveur IMAP a besoin de son propre connecteur de stockage.","De IMAP-server kent de UID en de map, en haalt de inhoud bij de opslag.":"Le serveur IMAP connaît l'UID et le dossier, et récupère le contenu dans le stockage.","De IMAP-server leest de inhoud uit de XENA-objectopslag, via het register. Bij Apache James is dat een eigen BlobStore.":"Le serveur IMAP lit le contenu dans le stockage objet de XENA, via le registre. Avec Apache James, c'est un BlobStore propre.","De IMAP-server leest en schrijft zijn berichten als bestanden in Nextcloud Files, via WebDAV.":"Le serveur IMAP lit et écrit ses messages comme fichiers dans Nextcloud Files, via WebDAV.","De IMAP-server met de opslagkoppeling, afleveren vanuit NiFi, de toets op filters.":"Le serveur IMAP avec le connecteur de stockage, la remise depuis NiFi, le contrôle des filtres.","De IMAP-server met de opslagkoppeling, de melding vanuit het register, de toets op filters.":"Le serveur IMAP avec le connecteur de stockage, le signalement depuis le registre, le contrôle des filtres.","De IMAP-server schrijft in Nextcloud":"Le serveur IMAP écrit dans Nextcloud","De IMAP-server werkt via Nextcloud":"Le serveur IMAP passe par Nextcloud","De Office Assistent in Thunderbird en Outlook (klassiek), met de module E-mailarchivering: scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"L'Assistant Office dans Thunderbird et Outlook (classique), avec le module Archivage des e-mails : trier, compléter, lier à une procédure et à un dossier. Le carnet d'adresses communal.","De Office Assistent roept ELSA aan via dezelfde integratielaag als in de kantoorpakketten. In het mailprogramma staat geen token.":"L'Assistant Office appelle ELSA via la même couche d'intégration que dans les suites bureautiques. Aucun jeton ne se trouve dans le logiciel de messagerie.","De Woo-coördinator zoekt in de samenwerkomgeving van de gemeente, of in Files.":"Le coordinateur Woo recherche dans l'environnement collaboratif de la commune, ou dans Files.","De Woo-coördinator zoekt via SharePoint of Teams, of in Files.":"Le coordinateur Woo recherche via SharePoint ou Teams, ou dans Files.","De architectuurvisie waarop deze demo is gebaseerd":"La vision d'architecture sur laquelle repose cette démo","De assistent is een uitbreiding van het mailprogramma. Hij praat rechtstreeks met ELSA en werkt naast IMAP, niet in plaats daarvan.":"L'assistant est une extension du logiciel de messagerie. Il communique directement avec ELSA et fonctionne à côté d'IMAP, pas à sa place.","De bedenktijd loopt tot":"Le délai de réflexion court jusqu’au","De bedenktijd loopt tot {0}; daarna gaat het bericht naar het publicatiedepot, na anonimiseren en beoordeling.":"Le délai de réflexion court jusqu’au {0} ; ensuite, le message part vers le dépôt de publication, après anonymisation et vérification.","De bedenktijd staat stil zolang je afwezig bent.":"Le délai de réflexion est suspendu pendant votre absence.","De brug leest het bericht uit Kafka en kijkt in het register of de Message-ID er al is. Een verzonden bericht komt zo maar één keer binnen.":"La passerelle lit le message dans Kafka et vérifie dans le registre si le Message-ID existe déjà. Un message envoyé n'entre ainsi qu'une seule fois.","De brug pakt het bericht uit: de EML, en elke bijlage als eigen object.":"La passerelle décompose le message : l'EML, et chaque pièce jointe comme objet distinct.","De brug schrijft het bericht en de bijlagen weg zoals een medewerker een bestand opslaat. Vanaf hier loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"La passerelle écrit le message et les pièces jointes comme un agent enregistre un fichier. À partir d'ici, un message suit le même chemin qu'un fichier sur un lecteur réseau.","De brug schrijft ze in Nextcloud, langs dezelfde weg als een bestand op een netwerkschijf. Nextcloud maakt eerst het record in het register aan.":"La passerelle les écrit dans Nextcloud, par le même chemin qu'un fichier sur un lecteur réseau. Nextcloud crée d'abord l'enregistrement dans le registre.","De datum volgt zodra de metagegevens zijn vastgelegd.":"La date suivra dès que les métadonnées auront été enregistrées.","De datum volgt zodra het bericht is verzonden.":"La date suivra dès que le message aura été envoyé.","De datum volgt zodra het stuk is vastgesteld.":"La date suivra dès que le document aura été arrêté.","De hele gemeente":"Toute la commune","De informatiebeheerder beoordeelt het verzoek, met een tweede beoordelaar. Je krijgt bericht.":"Le gestionnaire de l'information examine la demande, avec un second évaluateur. Vous serez informé.","De informatiebeheerder heeft het verzoek geweigerd. Het bericht blijft zakelijk.":"Le gestionnaire de l'information a refusé la demande. Le message reste professionnel.","De koppeling met R-{0}-{1}.":"Le lien avec R-{0}-{1}.","De koppeling met Z-{0}-{1}.":"Le lien avec Z-{0}-{1}.","De mailstroom loopt door Nextcloud. Een piek mag de medewerker in Files niet raken. Stap 1 is ook de proef daarop.":"Le flux de courrier passe par Nextcloud. Un pic ne doit pas toucher l'agent dans Files. L'étape 1 sert aussi de test à cet égard.","De mappen staan in ELSA. Het mailprogramma ziet ze via IMAP.":"Les dossiers se trouvent dans ELSA. Le logiciel de messagerie les voit via IMAP.","De medewerker kiest Persoonlijk in het paneel, of sleept het bericht naar de map Persoonlijk.":"L'agent choisit Personnel dans le volet, ou fait glisser le message dans le dossier Personnel.","De medewerker opent in Files de map E-mail, en daarin een dossier of een maand.":"L'agent ouvre dans Files le dossier E-mail, puis un dossier de procédure ou un mois.","De nieuwe Outlook en Outlook op het web laden webinvoegtoepassingen alleen bij een Microsoft-account, en COM-invoegtoepassingen werken daar niet. Wat dan wel werkt:":"Le nouvel Outlook et Outlook sur le web ne chargent les compléments web que pour un compte Microsoft, et les compléments COM n'y fonctionnent pas. Ce qui fonctionne :","De nieuwe Outlook heeft geen paneel. Hoe langer Outlook (klassiek) blijft, hoe beter; daarna blijven Thunderbird en de webmail van ELSA.":"Le nouvel Outlook n'a pas de volet. Plus Outlook (classique) reste longtemps, mieux c'est ; ensuite restent Thunderbird et le webmail d'ELSA.","De opslag levert de EML. Is het bericht persoonlijk, dan ontsleutelt de IMAP-server het met de sleutel van de gebruiker, die pas na aanmelding vrijkomt.":"Le stockage fournit l'EML. Si le message est personnel, le serveur IMAP le déchiffre avec la clé de l'utilisateur, libérée seulement après connexion.","De opslag van de e-mailarchivering komt in de nieuwe Nextcloud-stack. Nextcloud Files biedt WebDAV, geen IMAP. Er komt dus een IMAP-server naast. De vraag is waar de berichten dan staan.":"Le stockage de l'archivage des e-mails rejoint la nouvelle pile Nextcloud. Nextcloud Files offre WebDAV, pas IMAP. Un serveur IMAP vient donc s'y ajouter. La question est de savoir où se trouvent alors les messages.","De opsteller kiest of het stuk onder een Woo-categorie valt.":"L’auteur choisit si le document relève d’une catégorie Woo.","De orchestrator pakt het EML-bestand uit: kop, tekst en bijlagen.":"L'orchestrateur décompose le fichier EML : en-tête, texte et pièces jointes.","De persoonlijke sleutel komt pas vrij na aanmelding, alleen voor de sessie van de eigenaar.":"La clé personnelle n'est libérée qu'après connexion, uniquement pour la session de son titulaire.","De postbus in het mailprogramma":"La boîte aux lettres dans le logiciel de messagerie","De prijs: een piek in de mailstroom komt bij Nextcloud terecht. Daarom draaien de achtergrondtaken op eigen servers, los van die voor de medewerkers. En wat NiFi per bericht zou vastleggen, controleert ELSA nu zelf.":"Le prix : un pic du flux de courrier retombe sur Nextcloud. C'est pourquoi les tâches de fond tournent sur leurs propres serveurs, séparés de ceux des agents. Et ce que NiFi consignerait pour chaque message, ELSA le contrôle désormais lui-même.","De sleutelkluis met vrijgave per sessie en een sleutel per object, de procedures van de gemeentesecretaris en de informatiebeheerder, de koppeling met de Woo-dossiers in XENA.":"Le coffre-fort de clés avec libération par session et une clé par objet, les procédures du secrétaire général et du gestionnaire de l'information, le lien avec les dossiers Woo dans XENA.","De sleutelkluis met vrijgave per sessie, de procedure van de gemeentesecretaris, de koppeling met de Woo-dossiers in XENA.":"Le coffre-fort de clés avec libération par session, la procédure du secrétaire général, le lien avec les dossiers Woo dans XENA.","De tekst gaat naar de zoekindex. Bijlagen worden eigen objecten, verbonden met het bericht.":"Le texte part dans l'index de recherche. Les pièces jointes deviennent des objets distincts, liés au message.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"L'accès ne vaut que pour la période indiquée et expire automatiquement. Chaque ouverture d'un message avec cette clé est consignée.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"Le mode opératoire redevances 2026 a été adopté. Vous le trouverez dans le dossier de travail de l'équipe.","De zaak komt uit het zaaksysteem, dat leidend blijft. ELSA legt alleen de koppeling vast, als kenmerk.":"La procédure vient du système de gestion des procédures, qui reste la référence. ELSA n'enregistre que le lien, comme attribut.","De zoekindex van ELSA geeft alleen zakelijke berichten. Vertrouwelijke berichten alleen aan wie daar recht op heeft.":"L'index de recherche d'ELSA ne renvoie que les messages professionnels. Les messages confidentiels, seulement à ceux qui y ont droit.","De zoekindex volgt het register. Onderwerp, tekst en bijlagen worden doorzoekbaar, alleen voor wie toegang heeft.":"L'index de recherche suit le registre. Objet, texte et pièces jointes deviennent consultables, uniquement pour ceux qui y ont accès.","Deel I legt de asynchrone verwerking in ADR-0005 bij NiFi, los van de laag die gebruikers bedient.":"Dans l'ADR-0005, la Partie I confie le traitement asynchrone à NiFi, séparément de la couche qui sert les utilisateurs.","Delegeren aan de concerncontroller":"Déléguer au contrôleur de gestion","Demo":"Démo","Demo: {0} dagen later":"Démo : {0} jours plus tard","Deze map is leeg.":"Ce dossier est vide.","Dezelfde laag als voor de kantoorpakketten. Het mailprogramma zelf praat rechtstreeks IMAP; de assistent alleen via deze laag.":"La même couche que pour les suites bureautiques. Le logiciel de messagerie parle directement IMAP ; l'assistant uniquement via cette couche.","Dezelfde taal en dezelfde bouwstenen als de rest van XENA, een ruime licentie en een opslaglaag die bedoeld is om te vervangen. Het risico zit in Sieve: ManageSieve staat in de documentatie nog als experimenteel, en ELSA leunt op filters.":"Le même langage et les mêmes briques que le reste de XENA, une licence permissive et une couche de stockage conçue pour être remplacée. Le risque est dans Sieve : ManageSieve figure encore comme expérimental dans la documentation, et ELSA repose sur les filtres.","Dit bericht":"Ce message","Dit bericht is automatisch verstuurd.":"Ce message a été envoyé automatiquement.","Dit bericht is gekoppeld aan een zaak of dossier. Ontkoppel eerst.":"Ce message est lié à une affaire ou à un dossier. Dissociez-le d'abord.","Dit bericht is na de bedenktijd op verzoek persoonlijk gemaakt. Het register houdt vast dat het bestond, met afzender, datum en het besluit. De vergrendelde versie is onleesbaar.":"Ce message a été rendu personnel sur demande après le délai de réflexion. Le registre consigne qu'il a existé, avec l'expéditeur, la date et la décision. La version verrouillée est illisible.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"Ce message est enregistré avec votre clé personnelle. Dans le stockage, il est illisible, même pour les administrateurs.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"Ce message peut être aussi bien professionnel que personnel.","Dit bericht valt onder een lopend Woo-verzoek en kan niet persoonlijk worden.":"Ce message relève d'une demande Woo en cours et ne peut pas devenir personnel.","Dit bericht valt onder een lopend Woo-verzoek. Zolang dat loopt, kan het niet persoonlijk worden, ook niet op verzoek.":"Ce message relève d'une demande Woo en cours. Tant que celle-ci est en cours, il ne peut pas devenir personnel, même sur demande.","Dit is de Office Assistent in de mailomgeving, met de module E-mailarchivering. Het is dezelfde assistent als in de kantoorpakketten. Hij roept ELSA aan via de integratielaag en werkt naast IMAP, niet in plaats daarvan.":"Voici l'Assistant Office dans l'environnement de messagerie, avec le module Archivage des e-mails. C'est le même assistant que dans les suites bureautiques. Il appelle ELSA via la couche d'intégration et fonctionne à côté d'IMAP, pas à sa place.","Dit is je eigen vermelding. Aanpassen doe je onder Mijn vermelding.":"C'est votre propre fiche. Vous la modifiez sous Ma fiche.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"Si vous ne faites rien, le message est considéré comme professionnel au bout de dix jours. Personnel signifie : déplacé dans le dossier Personnel, chiffré avec votre propre clé et exclu du périmètre de recherche Woo.","Doorgeven":"Transmettre","Doorstroom":"Parcours","Doorstroom van een bericht":"Parcours d'un message","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Le transfert n'est autorisé que vers une adresse d'une commune participante.","Dossier R-{0}-{1}":"Dossier R-{0}-{1}","Dossier of zaak":"Dossier ou affaire","Dossiers":"Dossiers","Dossiersleutels en persoonlijke sleutels":"Clés de dossier et clés personnelles","Dubbele berichten":"Messages en double","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"Archiver les e-mails dans XENA : chaque message dans le registre, lu tout simplement dans votre propre logiciel de messagerie.","E-mailadres":"Adresse e-mail","E-mailarchivering binnen XENA":"Archivage des e-mails dans XENA","ELSA":"ELSA","ELSA bij dit bericht":"ELSA pour ce message","ELSA registreert geen zaken. Het zaaksysteem blijft leidend; ELSA legt de koppeling vast als kenmerk, via de Zaken API.":"ELSA n'enregistre pas de procédures. Le système des procédures reste la référence ; ELSA consigne le lien comme attribut, via l'API Zaken.","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA passe les messages non triés en professionnel au bout de dix jours","EXPUNGE haalt het bericht uit de map van de medewerker. Het object blijft, zolang de bewaartermijn loopt.":"EXPUNGE retire le message du dossier de l'agent. L'objet demeure tant que court la durée de conservation.","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"Un annuaire des agents des communes participantes. Chacun décide s'il y figure et avec quelles informations. Chaque commune gère sa propre partie et la partage via CardDAV.","Een bericht kan in meer dossiers zitten. Het dossier verwijst naar het bericht; er wordt niets gekopieerd.":"Un message peut figurer dans plusieurs dossiers. Le dossier renvoie au message ; rien n'est copié.","Een bericht komt binnen":"Un message arrive","Een bericht van een winkel over iets privés.":"Un message d'un magasin sur une affaire privée.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"Un récapitulatif quotidien d'ELSA avec les messages qui restent à trier.","Een demo, geen product. Alle voorbeeldgegevens zijn verzonnen: personen, adressen, dossiers en zaaknummers bestaan niet. De demo toont wat de architectuur mogelijk maakt; een deel van de functies is toekomstbeeld.":"Une démo, pas un produit. Toutes les données d'exemple sont inventées : personnes, adresses, dossiers et numéros de procédure n'existent pas. La démo montre ce que l'architecture rend possible ; une partie des fonctions relève de la vision d'avenir.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"Un filtre ne peut pas déplacer vers Personnel. C'est vous qui décidez, message par message, si un message est personnel.","Een gewone IMAP-server met eigen opslag op schijf, en daarnaast een kopie van elk bericht in Nextcloud.":"Un serveur IMAP ordinaire avec son propre stockage sur disque, et en plus une copie de chaque message dans Nextcloud.","Een kleine dienst leest het bericht uit Kafka, kijkt in het register of de Message-ID er al is en pakt het uit: kop, tekst en bijlagen.":"Un petit service lit le message dans Kafka, vérifie dans le registre si le Message-ID existe déjà et le décompose : en-tête, texte et pièces jointes.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"Un logiciel de messagerie s'attend à ce que la suppression réussisse. ELSA retire le message du dossier, mais l'objet reste conservé tant que court la durée de conservation.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"Une lettre d'information : professionnelle, avec une durée de conservation courte.","Een opvolger voor agenda en vrij/bezet, en mailprogramma's die daarmee overweg kunnen.":"Un successeur pour l'agenda et les disponibilités, et des logiciels de messagerie compatibles.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"Un message personnel reste personnel. Si vous le jugez finalement professionnel, choisissez d'abord Professionnel dans ELSA.","Een postbus is iets anders dan een archief. Medewerkers verwachten snelheid, zoeken in de eigen mappen en offline werken. De proefgroep in stap 2 moet dat toetsen voordat iedereen overgaat.":"Une boîte aux lettres n'est pas une archive. Les agents attendent de la rapidité, la recherche dans leurs propres dossiers et le travail hors ligne. Le groupe pilote de l'étape 2 doit le vérifier avant que tout le monde bascule.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"Une règle de transport transfère chaque message, entrant et sortant, au format EML vers Kafka.","Een verzoek is niet mogelijk zolang er een Woo-verzoek loopt waar het bericht onder valt. Elk besluit, en elke vernietigde sleutel, staat in het logboek, dat de archivaris kan inzien.":"Une demande est impossible tant qu'une demande Woo dont relève le message est en cours. Chaque décision, et chaque clé détruite, figure dans le journal, que l'archiviste peut consulter.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"Un message envoyé arrive deux fois : via la règle de transport et comme copie depuis le logiciel de messagerie. ELSA dédoublonne sur le Message-ID.","Een zaak of dossier met een Woo-categorie gaat voor op een eigen keuze.":"Une procédure ou un dossier doté d’une catégorie Woo prime sur un choix personnel.","Een zaak of dossier met een categorie gaat voor op een eigen keuze. Gelijk aan de demo over e-mailarchivering.":"Une procédure ou un dossier doté d’une catégorie prime sur un choix personnel. Comme dans la démo sur l’archivage des e-mails.","Een zaaksysteem dat op omschrijving kan zoeken, of een eigen index van zaken.":"Un système des procédures capable de chercher sur la description, ou un index propre des procédures.","Eerst, naast de bestaande postbus":"D'abord, à côté de la boîte aux lettres existante","Eerste beoordeling: toekennen":"Premier examen : accorder","Eerste beoordeling: toekennen. Wacht op de tweede beoordelaar.":"Premier examen : accorder. En attente du second évaluateur.","Eerste kandidaat: Apache James.":"Premier candidat : Apache James.","Eigen keuze, vervangen door de categorie van de zaak of het dossier.":"Choix personnel, remplacé par la catégorie de la procédure ou du dossier.","Eigen opslag aankoppelen":"Brancher son propre stockage","Elk bericht als EML door, zonder kopie":"Chaque message transféré en EML, sans copie","Elk bericht als EML · bekijk de stappen":"Chaque message en EML · voir les étapes","Elk bericht gaat via Exchange Online en Kafka naar een kleine brug, die het in Nextcloud wegschrijft. Daarna loopt het langs dezelfde weg als een bestand op een netwerkschijf. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Chaque message passe par Exchange Online et Kafka jusqu'à une petite passerelle, qui l'écrit dans Nextcloud. Ensuite, il suit le même chemin qu'un fichier sur un lecteur réseau. En moins d'une seconde, il figure dans le registre, dans le stockage objet et dans l'index de recherche. Aucune copie ne reste dans Exchange.","Elk bericht gaat via Exchange Online, Kafka en de orchestrator naar ELSA. Binnen een seconde staat het in het register, in de objectopslag en in de zoekindex. In Exchange blijft geen kopie achter.":"Chaque message passe par Exchange Online, Kafka et l'orchestrateur pour arriver dans ELSA. En moins d'une seconde, il figure dans le registre, dans le stockage objet et dans l'index de recherche. Aucune copie ne reste dans Exchange.","Elk zakelijk bericht krijgt een eigen sleutel in de sleutelkluis. Zo kan een vergrendelde versie onleesbaar worden gemaakt zonder hem te verwijderen, als een verzoek om hem persoonlijk te maken wordt toegekend.":"Chaque message professionnel reçoit sa propre clé dans le coffre-fort de clés. Ainsi, une version verrouillée peut être rendue illisible sans être supprimée, si une demande pour la rendre personnelle est accordée.","Elke IMAP-handeling wordt een WebDAV-aanroep: traag bij grote postbussen.":"Chaque opération IMAP devient un appel WebDAV : lent pour les grandes boîtes aux lettres.","Elke IMAP-server kan het, ook Dovecot zonder aanpassing.":"Tout serveur IMAP en est capable, y compris Dovecot sans modification.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Chaque pièce jointe est un objet distinct dans le stockage, relié au message. Une pièce jointe peut ainsi être retrouvée, conservée et publiée séparément.","Elke dag: alles wat in Kafka stond, staat ook in het register. Dat vervangt de herkomstregistratie die NiFi zou bieden.":"Chaque jour : tout ce qui était dans Kafka figure aussi dans le registre. Cela remplace la traçabilité de provenance qu'offrirait NiFi.","Elke ingang doet waar hij goed in is: IMAP voor de postbus, WebDAV voor het dossier.":"Chaque point d'accès fait ce qu'il fait de mieux : IMAP pour la boîte aux lettres, WebDAV pour le dossier.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"Une nouvelle demande a été déposée pour l'adresse Kleverlaan 14. La demande et les plans sont joints.","Er is één exemplaar van elk bericht. De ingangen verwijzen ernaar; geen ervan houdt een eigen kopie.":"Il existe un seul exemplaire de chaque message. Les points d'accès y renvoient ; aucun n'en garde sa propre copie.","Er is één exemplaar van elk bericht. Metagegevens, bewaartermijn en zoekindex gaan zoals bij de netwerkschijven, via het register en de apps rond Nextcloud. Er is geen aparte orchestrator.":"Il existe un seul exemplaire de chaque message. Métadonnées, durée de conservation et index de recherche fonctionnent comme pour les lecteurs réseau, via le registre et les applis autour de Nextcloud. Il n'y a pas d'orchestrateur distinct.","Evenementen":"Manifestations","Evenementenbeleid kustgemeenten":"Politique événementielle des communes côtières","Evenementenvergunning":"Autorisation de manifestation","Evenementenvergunning circuit 2027":"Autorisation de manifestation circuit 2027","Exchange":"Exchange","Exchange Online":"Exchange Online","Exchange Online ontvangt het bericht via SMTP. Een transport rule stuurt het als EML door naar Kafka en laat geen kopie achter in de postbus.":"Exchange Online reçoit le message via SMTP. Une règle de transport le transfère au format EML vers Kafka et ne laisse aucune copie dans la boîte aux lettres.","Exchange Online verzendt en ontvangt; ELSA bewaart. Alles na de aanvoer staat in de Nextcloud-stack van XENA. Zo kan de mailprovider later worden vervangen zonder dat het archief verhuist.":"Exchange Online envoie et reçoit ; ELSA conserve. Tout ce qui suit l'alimentation se trouve dans la pile Nextcloud de XENA. Le fournisseur de messagerie peut ainsi être remplacé plus tard sans que l'archive déménage.","Extensie of COM-invoegtoepassing, via de API van ELSA":"Extension ou complément COM, via l'API d'ELSA","Eén EML per bericht, onveranderlijk, met bewaarvergrendeling":"Un EML par message, immuable, avec verrouillage de conservation","Eén bericht, drie plekken die ernaar kijken":"Un message, trois endroits qui le consultent","Eén exemplaar, onveranderlijk, met bewaarvergrendeling.":"Un seul exemplaire, immuable, avec verrouillage de conservation.","Eén keer verwerken · bekijk de stappen":"Traité une seule fois · voir les étapes","Eén keer wegschrijven · bekijk de stappen":"Écrit une seule fois · voir les étapes","Eén object in de opslag, twee ingangen":"Un objet dans le stockage, deux points d'accès","Eén object in de opslag, twee ingangen: IMAP en WebDAV":"Un objet dans le stockage, deux points d'accès : IMAP et WebDAV","Eén opslag, die Nextcloud beheert.":"Un seul stockage, géré par Nextcloud.","Favoriet":"Favori","Favorieten":"Favoris","Files toont een virtuele map. De inhoud komt uit het register, niet uit een eigen kopie (PROPFIND).":"Files affiche un dossier virtuel. Le contenu vient du registre, pas d'une copie propre (PROPFIND).","Filter toegevoegd.":"Filtre ajouté.","Filter toevoegen":"Ajouter un filtre","Filters":"Filtres","Filters (Sieve)":"Filtres (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Les filtres s'exécutent dans ELSA même, au moment où un message arrive. Ils fonctionnent donc dans tous les logiciels de messagerie et sur tous les appareils. Certaines actions ne sont pas autorisées, car elles contourneraient la séparation entre professionnel et personnel.","Filters van de medewerker":"Filtres de l'agent","Foto's van de vakantie":"Photos des vacances","Functie":"Fonction","Geachte aanvrager,":"Madame, Monsieur,","Gedelegeerd":"Délégué","Geef een reden op.":"Indiquez un motif.","Geen":"Aucun","Geen NiFi: een bewuste afwijking van XENA Deel I":"Pas de NiFi : un écart délibéré par rapport à XENA Partie I","Geen assistent in Outlook":"Pas d'assistant dans Outlook","Geen assistent in de nieuwe Outlook":"Pas d'assistant dans le nouvel Outlook","Geen categorie":"Aucune catégorie","Geen categorie: alleen openbaar op verzoek":"Aucune catégorie : public uniquement sur demande","Geen dossier gevonden.":"Aucun dossier trouvé.","Geen eigen IMAP-server: alleen de koppelingen eromheen.":"Pas de serveur IMAP propre : seulement les connecteurs autour.","Geen kopie meer in Exchange, voor de proefgroep":"Plus de copie dans Exchange, pour le groupe pilote","Geen verzoeken.":"Aucune demande.","Geen zaak gevonden. Zaken komen uit het zaaksysteem; een nieuwe zaak maak je daar aan.":"Aucune procédure trouvée. Les procédures viennent du système des procédures ; c'est là qu'on en crée une nouvelle.","Gegevens bij de bron: het bericht staat één keer, en wie het nodig heeft, verwijst ernaar.":"Données à la source : le message existe une fois, et qui en a besoin y renvoie.","Geheimen":"Secrets","Gekoppeld aan een zaak":"Lié à une procédure","Gekoppeld aan zaak {0}.":"Lié à la procédure {0}.","Gekoppeld aan {0}. Ontkoppel eerst; ook dat wordt vastgelegd.":"Lié à {0}. Dissociez-le d'abord ; cela aussi est consigné.","Gekozen, nog te herzien":"Choisi, encore modifiable","Gelezen, vlag en label staan alleen in de IMAP-server. Leesstatus is geen archiefgegeven en komt niet in het register.":"Lu, drapeau et étiquette ne sont que dans le serveur IMAP. L'état de lecture n'est pas une donnée d'archive et n'entre pas dans le registre.","Gelezen, vlag, label":"Lu, drapeau, étiquette","Gemaakt door":"Réalisé par","Gemeente":"Commune","Gemeente Bloemendaal":"Commune de Bloemendaal","Gemeente Haarlem":"Commune de Haarlem","Gemeente Heemstede":"Commune de Heemstede","Gemeente Velsen":"Commune de Velsen","Gemeente Zandvoort":"Commune de Zandvoort","Gemeentelijk adresboek":"Annuaire intercommunal","Gemeentesecretaris":"Secrétaire général","Gevonden":"Trouvés","Gevonden berichten gaan per verwijzing naar het Woo-dossier in XENA. Er wordt niets gekopieerd.":"Les messages trouvés sont ajoutés par référence au dossier Woo dans XENA. Rien n'est copié.","Geweigerd":"Refusé","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Bonne nouvelle : la réparation est terminée. Vous pouvez venir chercher votre vélo jusqu'à 18h00.","Gooi weg":"Jeter","Groeipad":"Trajectoire","Groet, Lotte Visser":"Cordialement, Lotte Visser","Groet, Noor":"Bien à toi, Noor","Haal mij uit het adresboek":"Me retirer de l'annuaire","Handeling":"Opération","Help":"Aide","Herinrichting Houtplein":"Réaménagement du Houtplein","Herzien kan tot {0}.":"Modifiable jusqu'au {0}.","Het Common Ground-team en het samenwerkingsverband OWC":"L'équipe Common Ground et le partenariat OWC","Het EML-bestand en de bijlagen gaan de objectopslag in, met versiebeheer.":"Le fichier EML et les pièces jointes entrent dans le stockage objet, avec gestion des versions.","Het Woo-dossier is in Files een map met dezelfde berichten. Na beoordeling gaat de openbare versie naar TINA.":"Dans Files, le dossier Woo est un répertoire contenant les mêmes messages. Après examen, la version publique part vers TINA.","Het adresboek staat ook in het paneel van de assistent.":"Le carnet d'adresses figure aussi dans le volet de l'assistant.","Het bericht en elke bijlage krijgen een eigen identificatie. De metagegevens worden vastgelegd; de aard is nog open.":"Le message et chaque pièce jointe reçoivent leur propre identifiant. Les métadonnées sont consignées ; la nature reste à déterminer.","Het bericht gaat via Exchange Online de deur uit en komt via de transport rule terug in ELSA, onder Verzonden items.":"Le message part via Exchange Online et revient dans ELSA via la règle de transport, sous Éléments envoyés.","Het bericht is vergrendeld. Persoonlijk maken kan alleen op verzoek, bij de informatiebeheerder.":"Le message est verrouillé. Le rendre personnel n'est possible que sur demande, auprès du gestionnaire de l'information.","Het bericht komt binnen bij de mailprovider. Een transport rule stuurt het als EML door en houdt geen kopie.":"Le message arrive chez le fournisseur de messagerie. Une règle de transport le transfère au format EML et n'en garde aucune copie.","Het bericht komt op een wachtrij. Zo gaat er niets verloren als een volgende stap even niet bereikbaar is.":"Le message est placé dans une file d'attente. Ainsi, rien ne se perd si une étape suivante est momentanément indisponible.","Het bericht staat in Postvak IN. Het mailprogramma ziet het bij de volgende synchronisatie.":"Le message se trouve dans la Boîte de réception. Le logiciel de messagerie le voit à la prochaine synchronisation.","Het bericht staat één keer in de objectopslag van XENA, beschreven in het register. De IMAP-server en Nextcloud Files verwijzen er allebei naar.":"Le message est stocké une seule fois dans le stockage objet de XENA, décrit dans le registre. Le serveur IMAP et Nextcloud Files y renvoient tous deux.","Het bericht verdwijnt uit de virtuele mappen in Files, en de tekst uit de zoekindex.":"Le message disparaît des dossiers virtuels de Files, et son texte de l'index de recherche.","Het bericht wordt één keer via Nextcloud weggeschreven, zoals een bestand, en staat dan in de objectopslag, beschreven in het register. De IMAP-server leest het via het register uit de opslag; Files toont het.":"Le message est écrit une seule fois via Nextcloud, comme un fichier, puis se trouve dans le stockage objet, décrit dans le registre. Le serveur IMAP le lit dans le stockage via le registre ; Files l'affiche.","Het bericht zelf, zoals het wordt bewaard":"Le message lui-même, tel qu'il est conservé","Het documenttype bepaalt de Woo-categorie, tot de opsteller kiest of koppelt.":"Le type de document détermine la catégorie Woo, jusqu’à ce que l’auteur choisisse ou établisse un lien.","Het enige onderdeel dat er voor de mail bij komt. Daarna loopt een bericht langs dezelfde weg als een bestand op een netwerkschijf.":"Le seul composant ajouté pour le courrier. Ensuite, un message suit le même chemin qu'un fichier sur un lecteur réseau.","Het gemeentelijk adresboek":"L'annuaire intercommunal","Het gemeentelijk adresboek gebruiken in de webmail van ELSA. De nieuwe Outlook kent geen CardDAV.":"Utiliser le carnet d'adresses communal dans le webmail d'ELSA. Le nouvel Outlook ne prend pas en charge CardDAV.","Het gesprek over archiveren van e-mail aan de bron, zonder kopie bij de leverancier van de mailserver":"La réflexion sur l'archivage des e-mails à la source, sans copie chez le fournisseur du serveur de messagerie","Het mailprogramma haalt berichten op via IMAP4. Inzien, verplaatsen en versleutelen gaan via ELSA; filters draaien als Sieve.":"Le logiciel de messagerie récupère les messages via IMAP4. La consultation, le déplacement et le chiffrement passent par ELSA ; les filtres s'exécutent en Sieve.","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Filters als Sieve.":"Le logiciel de messagerie récupère le courrier dans ELSA via IMAP. Tri sous dix jours. Filtres en Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Le logiciel de messagerie peut aussi gérer lui-même les filtres via ManageSieve. ELSA vérifie chaque script avant de l'enregistrer.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"Le logiciel de messagerie envoie un nouveau message via SMTP à Exchange Online.","Het meest compleet uit de doos, met CardDAV voor het adresboek erbij. Maar een eigen opslagkoppeling betekent werken in de code van één bedrijf, en een deel van de functies zit in de betaalde editie.":"Le plus complet clé en main, avec CardDAV pour l'annuaire en prime. Mais un connecteur de stockage propre implique de travailler dans le code d'une seule entreprise, et une partie des fonctions est réservée à l'édition payante.","Het object wordt opnieuw opgeslagen, versleuteld met de persoonlijke sleutel. De onversleutelde versie vervalt. Dat kan, omdat de bewaarvergrendeling pas ingaat als een bericht zakelijk is.":"L'objet est enregistré à nouveau, chiffré avec la clé personnelle. La version non chiffrée est supprimée. C'est possible parce que le verrouillage de conservation ne s'applique qu'une fois le message professionnel.","Het onderwerp noemt een lopend Woo-verzoek.":"L'objet mentionne une demande Woo en cours.","Het paneel in Thunderbird en Outlook (klassiek): scheiden, aanvullen, koppelen aan zaak en dossier. Het gemeentelijk adresboek.":"Le volet dans Thunderbird et Outlook (classique) : trier, compléter, lier à une procédure et à un dossier. L'annuaire intercommunal.","Het register geeft de berichten en de rechten. Alleen zakelijke berichten waar de medewerker bij mag. Persoonlijke berichten staan er nooit in.":"Le registre fournit les messages et les droits. Seulement les messages professionnels auxquels l'agent a accès. Les messages personnels n'y figurent jamais.","Het register legt de aard persoonlijk vast, met wie en wanneer. Het bericht valt buiten het zoekbereik voor de Woo.":"Le registre consigne la nature personnelle, par qui et quand. Le message sort du périmètre de recherche pour la Woo.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd.":"Le registre consigne le message : Message-ID, expéditeur, destinataires, date et la nature « à trier », avec dix jours de réflexion.","Het register legt het bericht vast: Message-ID, afzender, ontvangers, datum en de aard \"nog te scheiden\", met tien dagen bedenktijd. De zoekindex volgt het register.":"Le registre consigne le message : Message-ID, expéditeur, destinataires, date et la nature « à trier », avec dix jours de réflexion. L'index de recherche suit le registre.","Het register meldt elk nieuw bericht aan de IMAP-server, die het in de juiste map zet met een verwijzing naar het object.":"Le registre signale chaque nouveau message au serveur IMAP, qui le place dans le bon dossier avec un renvoi vers l'objet.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"Le registre signale le nouveau message au serveur IMAP. Celui-ci ne conserve pas de seconde copie : il renvoie vers l'objet et ne gère que l'UID, le dossier et les drapeaux.","Het register meldt het nieuwe bericht aan de IMAP-server. Die zet het in Postvak IN, met een verwijzing naar het object.":"Le registre signale le nouveau message au serveur IMAP. Celui-ci le place dans la Boîte de réception, avec un renvoi vers l'objet.","Hetzelfde bericht in Nextcloud Files":"Le même message dans Nextcloud Files","Hier zijn de foto's.":"Voici les photos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Voici le projet de plan de projet. Peux-tu regarder surtout le paragraphe sur les autorisations de terrasses ?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Coucou San, c'est toi qui apportes le gâteau samedi ? Mamie compte sur toi. Bisous, Ellen","Hoi Sanne,":"Bonjour Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP MOVE naar Persoonlijk. De IMAP-server meldt de keuze aan ELSA.":"IMAP MOVE vers Personnel. Le serveur IMAP signale le choix à ELSA.","IMAP en LMTP; SMTP via Postfix":"IMAP et LMTP ; SMTP via Postfix","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP ne concerne que la messagerie. L'agenda reste pour l'instant dans Exchange ; l'annuaire passe par CardDAV.","IMAP naast WebDAV":"IMAP à côté de WebDAV","IMAP, SMTP, LMTP":"IMAP, SMTP, LMTP","IMAP, uit ELSA":"IMAP, depuis ELSA","IMAP-server":"Serveur IMAP","IMAP-server naast Nextcloud Files, op dezelfde objectopslag":"Serveur IMAP à côté de Nextcloud Files, sur le même stockage objet","IMAP-trefwoorden":"mots-clés IMAP","IMAP4 en ManageSieve: mappen, vlaggen en filters per gebruiker":"IMAP4 et ManageSieve : dossiers, drapeaux et filtres par utilisateur","IMAP4 en Sieve":"IMAP4 et Sieve","IMAP4rev2":"IMAP4rev2","Iedereen over, en andere gemeenten in het adresboek":"Tout le monde bascule, et d'autres communes dans l'annuaire","Ik ben afwezig":"Je suis absent","Ik ben afwezig tot maandag.":"Je suis absent jusqu'à lundi.","Ik ben afwezig. Je bericht wordt na mijn terugkomst gelezen.":"Je suis absent. Votre message sera lu à mon retour.","Ik ben terug":"Je suis de retour","Ik was op vakantie. Het gaat om een inzameling onder collega's, niet over werk.":"J'étais en vacances. Il s'agit d'une collecte entre collègues, pas du travail.","In behandeling":"En cours","In de Nextcloud-stack doen het register en de apps rond Nextcloud dat werk al voor de netwerkschijven. ELSA volgt de netwerkschijven: minder onderdelen, één beheerteam, en mail en bestanden langs dezelfde weg.":"Dans la pile Nextcloud, le registre et les applis autour de Nextcloud font déjà ce travail pour les lecteurs réseau. ELSA suit les lecteurs réseau : moins de composants, une seule équipe d'exploitation, et courrier et fichiers par le même chemin.","In de browser of de bureaubladapp, via WebDAV":"Dans le navigateur ou l'application de bureau, via WebDAV","In de schets staat GreenMail. Dat is een testserver. Voor productie ligt een volwaardige IMAP-server met Sieve voor de hand, bijvoorbeeld Dovecot met Pigeonhole.":"Le schéma mentionne GreenMail. C'est un serveur de test. Pour la production, un serveur IMAP complet avec Sieve s'impose, par exemple Dovecot avec Pigeonhole.","In deze nieuwsbrief: de nieuwe handreiking voor actieve openbaarmaking, een webinar over de Omgevingswet en het laatste nieuws uit de regio.":"Dans cette lettre d'information : le nouveau guide sur la publication active, un webinaire sur l'Omgevingswet et les dernières nouvelles de la région.","In het echte systeem opent hier de webmail van ELSA, met hetzelfde paneel.":"Dans le vrai système, le webmail ELSA s'ouvre ici, avec le même panneau.","In het paneel: zoeken, een bericht beginnen en je eigen vermelding beheren, in elk mailprogramma met de assistent.":"Dans le volet : rechercher, commencer un message et gérer votre fiche, dans chaque logiciel de messagerie avec l'assistant.","In stap 1 staat de mail nog in Exchange. Dat is een tussenstap, geen eindbeeld: hij is er om te leren zonder dat iemand anders hoeft te werken.":"À l'étape 1, le courrier est encore dans Exchange. C'est une étape intermédiaire, pas la cible : elle sert à apprendre sans que quiconque change sa façon de travailler.","In vijf stappen, waarvan vier zonder de markt":"En cinq étapes, dont quatre sans le marché","Informatiebeheer":"Gestion de l'information","Informatiebeheerder":"Gestionnaire de l'information","Inhoud (EML)":"Contenu (EML)","Integratielaag, aan de serverkant":"Couche d'intégration, côté serveur","Interactieve demo, versie {0}":"Démo interactive, version {0}","Intergemeentelijke samenwerking":"Coopération intercommunale","Intern":"Interne","Interne bedrijfsvoering":"Fonctionnement interne","Internet Message Format (EML)":"Internet Message Format (EML)","Is dit bericht zakelijk of persoonlijk?":"Ce message est-il professionnel ou personnel ?","JMAP":"JMAP","Jaarplannen en jaarverslagen":"Plans annuels et rapports annuels","Java (vanaf 3.9 Java 21)":"Java (Java 21 à partir de 3.9)","Java-interface in een modulair ontwerp":"Interface Java dans une conception modulaire","Je eigen keuze vervalt.":"Votre choix personnel est annulé.","Je fiets is klaar om op te halen":"Votre vélo est prêt","Je kunt je vermelding altijd aanpassen of intrekken. De wijziging gaat via CardDAV naar de andere gemeenten.":"Vous pouvez à tout moment modifier ou retirer votre fiche. La modification est transmise aux autres communes via CardDAV.","Je kunt zelf kiezen, of koppelen aan een zaak of dossier met een categorie. Die gaat dan voor.":"Vous pouvez choisir vous-même, ou lier à une procédure ou un dossier doté d’une catégorie. Celle-ci prime alors.","Je staat in het adresboek":"Vous figurez dans l'annuaire","Je staat in het gemeentelijk adresboek.":"Vous figurez dans l'annuaire intercommunal.","Je staat niet in het adresboek":"Vous n'êtes pas dans le carnet d'adresses","Je staat nog niet in het adresboek. Collega's van andere gemeenten kunnen je dan niet vinden.":"Vous ne figurez pas encore dans l'annuaire. Les collègues d'autres communes ne peuvent donc pas vous trouver.","Je vermelding is ingetrokken.":"Votre fiche a été retirée.","Juridische Zaken":"Affaires juridiques","Kafka":"Kafka","Kapvergunning Houtplein":"Permis d'abattage Houtplein","Kies":"Choisir","Kies een bericht.":"Choisissez un message.","Kies een handeling. De stappen laten zien welk onderdeel wat doet.":"Choisissez une opération. Les étapes montrent quel composant fait quoi.","Kies zelf, of koppel het bericht aan een zaak of dossier met een categorie. Die gaat dan voor.":"Choisissez vous-même, ou liez le message à une procédure ou un dossier doté d’une catégorie. Celle-ci prime alors.","Kies zelf, of koppel het stuk aan een zaak of dossier met een categorie. Die gaat dan voor.":"Choisissez vous-même, ou liez le document à une procédure ou un dossier doté d’une catégorie. Celle-ci prime alors.","Klachtoordelen":"Avis sur les plaintes","Kopieer adres":"Copier l'adresse","Koppelen aan een zaak; het zaaksysteem blijft leidend":"Lier à une procédure ; le système des procédures reste la référence","Label van ELSA, als IMAP-trefwoord":"Étiquette ELSA, sous forme de mot-clé IMAP","Labels":"Étiquettes","Labels uit het register":"Étiquettes issues du registre","Later":"Plus tard","Later: een moderne opvolger van IMAP voor webmail en apps":"Plus tard : un successeur moderne d'IMAP pour le webmail et les applis","Leest elk bericht uit Kafka, kijkt in het register of de Message-ID er al is, pakt het uit en schrijft de EML en de bijlagen in Nextcloud. Klein, zonder eigen opslag.":"Lit chaque message dans Kafka, vérifie dans le registre si le Message-ID existe déjà, le décompose et écrit l'EML et les pièces jointes dans Nextcloud. Petit, sans stockage propre.","Legesverordening 2026":"Règlement des redevances 2026","Lezen en werken: IMAP, WebDAV en API · bekijk de stappen":"Lire et travailler : IMAP, WebDAV et API · voir les étapes","Lezen in het mailprogramma":"Lire dans le logiciel de messagerie","Licentie":"Licence","Lieve Sanne, we gaan trouwen! Je bent van harte welkom op zaterdag 14 november. Laat je weten of je komt?":"Chère Sanne, nous nous marions ! Tu es la bienvenue le samedi 14 novembre. Tu nous dis si tu viens ?","Liever niet":"Plutôt pas","Logboek":"Journal","Loopt uitsluitend tussen backendsystemen, niet via de werkplek. Vervangt een andere dienst Exchange, dan verandert alleen deze laag.":"Passe uniquement entre systèmes back-end, jamais par le poste de travail. Si un autre service remplace Exchange, seule cette couche change.","Lunch vrijdag?":"Déjeuner vendredi ?","MIT en LGPL 2.1":"MIT et LGPL 2.1","Mail en bestanden lopen langs dezelfde weg, met dezelfde regels.":"Courrier et fichiers suivent le même chemin, avec les mêmes règles.","Mailomgeving":"Environnement de messagerie","Mailprogramma":"Logiciel de messagerie","Mailprovider vervangen zonder dat het archief verhuist":"Remplacer le fournisseur de messagerie sans que l'archive déménage","Map":"Dossier","Mappen":"Dossiers","Markeer":"Marquer","Medewerker":"Agent","Medewerkers, informatiebeheerders en architecten van de gemeenten Haarlem en Zandvoort":"Les agents, gestionnaires de l'information et architectes des communes de Haarlem et Zandvoort","Melding":"Signalement","Melding aan de IMAP-server":"Signalement au serveur IMAP","Melding openbare ruimte Kleverlaan":"Signalement espace public Kleverlaan","Memo parkeerdruk voor het Woo-verzoek Houtplein":"Note sur la pression du stationnement pour la demande Woo Houtplein","Met assistentie van":"Avec l'assistance de","Met een Exchange-postbus werkt de webinvoegtoepassing in elke Outlook, maar dan staat de mail bij Microsoft. Dat past niet bij de keuze voor een postbus in eigen beheer. Met ELSA blijft voor Outlook alleen de COM-invoegtoepassing in Outlook (klassiek) over.":"Avec une boîte aux lettres Exchange, le complément web fonctionne dans tout Outlook, mais le courrier se trouve alors chez Microsoft. Cela ne cadre pas avec le choix d'une boîte aux lettres gérée en propre. Avec ELSA, il ne reste pour Outlook que le complément COM dans Outlook (classique).","Met een proefgroep":"Avec un groupe pilote","Met vriendelijke groet, Jeroen Kramer":"Cordialement, Jeroen Kramer","Met vriendelijke groet, Sanne de Vries, Team Vergunningen":"Cordialement, Sanne de Vries, Équipe Autorisations","Metagegevens":"Métadonnées","Metagegevens (register)":"Métadonnées (registre)","Metagegevens aangevuld":"Métadonnées complétées","Metagegevens aanvullen in de webmail van ELSA.":"Compléter les métadonnées dans le webmail ELSA.","Metagegevens, aard, zaak en dossiers, rechten":"Métadonnées, nature, procédure et dossiers, droits","Metagegevens, aard, zaak en dossiers, rechten. Zet de bewaartermijn op de opslag.":"Métadonnées, nature, procédure et dossiers, droits. Fixe la durée de conservation sur le stockage.","Mijn sleutel":"Ma clé","Mijn vermelding":"Ma fiche","Momentopname, deels aanname. Dezelfde tabel staat in de demo van de Office Assistent.":"Instantané, en partie hypothèse. Le même tableau figure dans la démo de l'Assistant Office.","Na de bedenktijd is een zakelijk bericht vergrendeld. Persoonlijk maken onttrekt het aan het archief en kan daarom alleen met twee beoordelaars. Het register houdt altijd vast dat het bericht bestond.":"Après le délai de réflexion, un message professionnel est verrouillé. Le rendre personnel le retire de l'archive et requiert donc deux évaluateurs. Le registre consigne toujours que le message a existé.","Na de bedenktijd kan dit alleen op verzoek. De informatiebeheerder beslist, met een tweede beoordelaar. Wordt het toegekend, dan wordt de vergrendelde versie onleesbaar gemaakt; het register houdt vast dat het bericht bestond.":"Après le délai de réflexion, ce n'est possible que sur demande. Le gestionnaire de l'information décide, avec un second évaluateur. Si la demande est accordée, la version verrouillée est rendue illisible ; le registre consigne que le message a existé.","Na tien dagen automatisch zakelijk":"Automatiquement professionnel au bout de dix jours","Na tien dagen wordt een bericht zakelijk. Vul daarna de classificatie aan, zodat de bewaartermijn vastligt.":"Après dix jours, un message devient professionnel. Complétez ensuite le classement, pour fixer la durée de conservation.","Na verzoek persoonlijk gemaakt; de vergrendelde versie is onleesbaar":"Rendu personnel sur demande ; la version verrouillée est illisible","Naam":"Nom","Naam en e-mailadres zijn nodig om je te kunnen vinden. De rest kies je zelf.":"Le nom et l'adresse e-mail sont nécessaires pour qu'on puisse vous trouver. Le reste, c'est vous qui choisissez.","Naar de API van ELSA en het register":"Vers l'API d'ELSA et le registre","Neem mij op in het adresboek":"M'inscrire dans l'annuaire","Nextcloud":"Nextcloud","Nextcloud Files":"Nextcloud Files","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Een andere toepassing kan die objecten dus niet zomaar delen. Daarom loopt het delen in optie C via het register, en niet via de opslag van Nextcloud zelf.":"Nextcloud conserve les fichiers dans le stockage objet sous un numéro interne propre, pas sous leur nom. Une autre application ne peut donc pas simplement partager ces objets. C'est pourquoi, dans l'option C, le partage passe par le registre, et non par le stockage de Nextcloud lui-même.","Nextcloud bewaart bestanden in de objectopslag onder een eigen intern nummer, niet onder hun naam. Het register kent dat nummer en het versie-id, omdat Nextcloud ze na elke schrijfactie terugmeldt. Zo vindt de IMAP-server het object zonder via Nextcloud te lezen.":"Nextcloud stocke les fichiers dans le stockage objet sous un numéro interne propre, et non sous leur nom. Le registre connaît ce numéro et l'identifiant de version, car Nextcloud les lui renvoie après chaque écriture. Le serveur IMAP trouve ainsi l'objet sans lire via Nextcloud.","Nextcloud heeft een app nodig die de virtuele map E-mail uit het register toont.":"Nextcloud a besoin d'une appli qui affiche le dossier virtuel E-mail à partir du registre.","Nextcloud maakt eerst het record in het register aan. Het bericht en elke bijlage krijgen een eigen identificatie; de aard is nog open.":"Nextcloud crée d'abord l'enregistrement dans le registre. Le message et chaque pièce jointe reçoivent leur propre identifiant ; la nature reste à déterminer.","Nextcloud moet de mailstroom aankunnen naast het werk van de medewerkers.":"Nextcloud doit absorber le flux de courrier en plus du travail des agents.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug aan het register.":"Nextcloud écrit le contenu via S3 et renvoie l'identifiant de version au registre.","Nextcloud schrijft de inhoud via S3 weg en meldt het versie-id terug. De EML staat er één keer en verandert daarna nooit meer.":"Nextcloud écrit le contenu via S3 et renvoie l'identifiant de version. L'EML y est déposé une seule fois et ne change plus jamais ensuite.","Nextcloud wordt een knelpunt voor de mail.":"Nextcloud devient un goulot d'étranglement pour le courrier.","Nextcloud-app E-mail":"Appli Nextcloud E-mail","Nextcloud-stack van XENA":"Pile Nextcloud de XENA","NiFi":"NiFi","NiFi leest het bericht uit Kafka, berekent de hash en kijkt op Message-ID of het er al is. Een verzonden bericht komt zo maar één keer binnen.":"NiFi lit le message dans Kafka, calcule le hash et vérifie sur le Message-ID s'il existe déjà. Un message envoyé n'entre ainsi qu'une seule fois.","NiFi levert elk bericht bij de IMAP-server af, met een verwijzing naar het object in plaats van de inhoud.":"NiFi remet chaque message au serveur IMAP, avec une référence à l'objet au lieu du contenu.","NiFi levert het bericht af bij de IMAP-server (LMTP). De IMAP-server bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij.":"NiFi remet le message au serveur IMAP (LMTP). Le serveur IMAP ne garde pas de seconde copie : il renvoie à l'objet et ne tient que l'UID, le dossier et les drapeaux.","NiFi slaat het bericht real time op (binnen een seconde): metagegevens in het register, de inhoud in de objectopslag, de tekst in de zoekmachine.":"NiFi enregistre le message en temps réel (en moins d'une seconde) : les métadonnées dans le registre, le contenu dans le stockage objet, le texte dans le moteur de recherche.","Niemand gevonden. Misschien staat deze collega niet in het adresboek: opname is vrijwillig.":"Personne trouvé. Ce collègue n'est peut-être pas dans le carnet d'adresses : l'inscription est volontaire.","Niet doen":"À éviter","Niet toegestaan: weggooien, verplaatsen naar Persoonlijk, doorsturen naar een adres buiten de gemeenten.":"Non autorisé : jeter, déplacer vers Personnel, transférer vers une adresse extérieure aux communes.","Niet uit zichzelf. Wel vindbaar bij een Woo-verzoek.":"Pas d’office. Mais retrouvable lors d’une demande Woo.","Niets gevonden.":"Aucun résultat.","Niets in het mailprogramma. De Woo-coördinator zoekt al in het archief, en zakelijke berichten staan in Files.":"Rien dans le logiciel de messagerie. Le coordinateur Woo cherche déjà dans l'archive, et les messages professionnels sont dans Files.","Niets om te herzien.":"Rien à modifier.","Niets, als het goed gaat.":"Rien, si tout va bien.","Niets.":"Rien.","Niets. Exchange houdt in deze stap nog een kopie in de postbus.":"Rien. À cette étape, Exchange garde encore une copie dans la boîte aux lettres.","Niets. Voor de proefgroep laat de transport rule geen kopie meer achter.":"Rien. Pour le groupe pilote, la règle de transport ne laisse plus de copie.","Nieuw bericht":"Nouveau message","Nieuwe Outlook":"Nouvel Outlook","Nieuwe Outlook en Outlook op het web":"Nouvel Outlook et Outlook sur le web","Nieuwe Outlook en Outlook op het web met een IMAP-account: geen paneel. Scheiden gaat dan door te verplaatsen naar de map Persoonlijk.":"Nouvel Outlook et Outlook sur le web avec un compte IMAP : pas de volet. La séparation se fait alors en déplaçant le message dans le dossier Personnel.","Nieuwe aanvraag omgevingsvergunning Kleverlaan 14":"Nouvelle demande de permis de construire Kleverlaan 14","Nog 1 dag om te scheiden":"Plus qu'un jour pour trier","Nog geen favorieten. Open een vermelding en zet er een ster bij.":"Pas encore de favoris. Ouvrez une fiche et ajoutez une étoile.","Nog te scheiden":"Encore à trier","Nog {0} dagen om te scheiden":"Plus que {0} jours pour trier","Object Lock zodra de bedenktijd voorbij is":"Object Lock dès la fin du délai de réflexion","Objectopslag":"Stockage objet","Objectopslag (S3)":"Stockage objet (S3)","Office Assistent":"Assistant Office","Office Assistent · E-mailarchivering":"Assistant Office · Archivage des e-mails","Om een persoonlijk bericht te tonen, moet de IMAP-server de sleutel van de gebruiker kunnen gebruiken, en alleen in diens sessie. Dat vraagt een koppeling met de sleutelkluis die nog moet worden ontworpen.":"Pour afficher un message personnel, le serveur IMAP doit pouvoir utiliser la clé de l'utilisateur, et uniquement dans sa session. Cela demande un lien avec le coffre-fort de clés, qui reste à concevoir.","Omdat een EML nooit verandert, kunnen twee ingangen hetzelfde object delen zonder dat ze elkaar in de weg zitten. Ze verschillen alleen in metagegevens, en die hebben elk een eigen eigenaar.":"Comme un EML ne change jamais, deux points d'accès peuvent partager le même objet sans se gêner. Ils ne diffèrent que par les métadonnées, qui on  of het dossier.":"Seule l'organisation définit une catégorie Woo par une règle. Vous la choisissez vous-même message par message, ou elle provient de la procédure ou du dossier.","Een regel van de organisatie raakt de mappen van medewerkers niet. Mappen zijn een persoonlijke ordening.":"Une règle de l'organisation ne touche pas aux dossiers des agents. Les dossiers sont un classement personnel.","Vul in waarop de regel moet letten.":"Indiquez ce que la règle doit examiner.","regel “{0}”":"règle “{0}”","alleen bij nieuwe berichten":"uniquement pour les nouveaux messages","wordt zakelijk":"devient professionnel","classificatie {0}":"classement {0}","zaak {0}":"procédure {0}","dossier {0}":"dossier {0}","vertrouwelijkheid {0}":"confidentialité {0}","Woo-categorie {0}":"catégorie Woo {0}","Aangevuld door een regel":"Complété par une règle","Gezet door {0}.":"Défini par {0}.","Gegenereerd door ELSA uit de regels in het register. Niet met de hand wijzigen.":"Généré par ELSA à partir des règles du registre. Ne pas modifier à la main.","Geen regels bij aflevering.":"Aucune règle à la remise.","Aflevering":"Remise","past op 1 bericht":"s'applique à 1 message","past op {0} berichten":"s'applique à {0} messages","naam@gemeente.org":"nom@gemeente.org","Een regel zet metagegevens zodra een bericht binnenkomt. Hij draait bij het register, niet in je mailprogramma, en werkt dus overal. Wat een regel zet, kun je binnen de bedenktijd herzien, net als je eigen keuze.":"Une règle définit les métadonnées dès qu'un message arrive. Elle s'exécute au niveau du registre, pas dans votre logiciel de messagerie, et fonctionne donc partout. Ce qu'une règle définit, vous pouvez le modifier pendant le délai de réflexion, comme votre propre choix.","Nieuwe regel":"Nouvelle règle","bijvoorbeeld bloemendaal.gemeente.org":"par exemple bloemendaal.gemeente.org","In het register":"Dans le registre","Bij aflevering":"À la remise","Kan niet":"Impossible","Waarde":"Valeur","Getest op je berichten":"Test als bron. Je ziet het bij het veld, en het valt onder dezelfde bedenktijd als je eigen keuze.":"Ce qu'une règle définit a la règle pour source. Vous le voyez à côté du champ, et cela relève du même délai de réflexion que votre propre choix.","Een regel vult aan wat leeg is. Wat je zelf hebt gekozen, overschrijft hij niet.":"Une règle complète ce qui est vide. Elle n'écrase pas ce que vous avez choisi vous-même.","Uitzetten of verwijderen verandert niets aan berichten die de regel al heeft aangevuld.":"Désactiver ou supprimer ne change rien aux messages que la règle a déjà complétés.","Zo staan ze in het register":"Voici comment elles figurent dans le registre","Zo staat het in de IMAP-server":"Voici comment cela figure dans le serveur IMAP","ManageSieve staat dicht voor mailprogramma's. Een filter dat buiten de assistent om doorstuurt of weggooit, kan dus niet bestaan. Regels in Outlook of Thunderbird zelf werken alleen zolang het programma openstaat.":"ManageSieve est fermé aux logiciels de messagerie. Un filtre qui transfère ou jette en contournant l'assistant ne peut donc pas exister. Les règles dans Outlook ou Thunderbird lui-même ne fonctionnent que tant que le programme est ouvert.","Het register voert de regels uit, van de organisatie, het team en de medewerker. Wat een regel zet, krijgt de regel als bron en valt onder dezelfde bedenktijd.":"Le registre exécute les règles de l'organisation, de l'équipe et de l'agent. Ce qu'une règle définit a la règle pour source et relève du même délai de réflexion.","Het register meldt het nieuwe bericht aan de IMAP-server. Die bewaart geen tweede kopie: hij verwijst naar het object en houdt alleen UID, map en vlaggen bij. Het Sieve-script dat ELSA uit de regels schrijft, zet het zo nodig in een andere map.":"Le registre signale le nouveau message au serveur IMAP. Celui-ci ne conserve pas de seconde copie : il renvoie à l'objet et ne tient à jour que l'UID, le dossier et les drapeaux. Le script Sieve qu'ELSA rédige à partir e la politique propre à chaque niveau et consigne la règle comme source de chaque valeur.","Sieve-script uit de regels":"Script Sieve issu des règles","Schrijft per postbus het script voor wat bij aflevering moet gebeuren: map, markering, doorsturen binnen de gemeenten en afwezigheid. ManageSieve staat dicht voor mailprogramma's.":"Rédige pour chaque boîte aux lettres le script de ce qui doit se passer à la remise : dossier, marquage, transfert au sein des communes et absence. ManageSieve est fermé aux logiciels de messagerie.","Sieve":"Sieve","Aflevering: map, markering en afwezigheid, geschreven door ELSA uit de regels":"Remise : dossier, marquage et absence, rédigés par ELSA à partir des règles","Het mailprogramma haalt de mail via IMAP uit ELSA. Scheiden binnen tien dagen. Regels in het paneel.":"Le logiciel de messagerie récupère le courrier dans ELSA via IMAP. Tri sous dix jours. Règles dans le volet.","De IMAP-server met de opslagkoppeling, de melding vanuit het register, de regels bij het register en het Sieve-script dat daaruit volgt.":"Le serveur IMAP avec le connecteur de stockage, le signalement depuis le registre, les règles au niveau du registre et le script Sieve qui en découle.","Aangevuld door een regel bij binnenkomst":"Complété par une règle à l'arrivée","{0} regels":"{0} règles","Sieve-script gegenereerd door ELSA":"Script Sieve généré par ELSA","Binnen de bedenktijd teruggezet naar persoonlijk":"Remis en personnel pendant le délai de réflexion","Sieve-script opnieuw gegenereerd":"Script Sieve régénéré","aangevulde berichten blijven zoals ze zijn":"les messages complétés restent tels quels","Regel verwijderd. Berichten die hij al heeft aangevuld, blijven zoals ze zijn.":"Règle supprimée. Les messages qu'elle a déjà complétés restent tels quels.","getoetst aan het beleid":"vérifiée au regard de la politique","{0} berichten aangevuld, met de regel als bron":"{0} messages complétés, avec la règle pour source","Regel aangezet. Hij geldt voor nieuwe berichten.":"Règle activée. Elle s'applique aux nouveaux messages.","Regel aangezet. 1 bericht aangevuld.":"Règle activée. 1 message complété.","Regel aangezet. {0} berichten aangevuld.":"Règle activée. {0} messages complétés.","Als {0} {1} “{2}”":"Si {0} {1} “{2}”","regel":"règle","Regels beheer je in het paneel van de Office Assistent. Het register voert ze uit zodra een bericht binnenkomt, want de meeste regels zetten metagegevens. Alleen wat bij de aflevering in de postbus moet gebeuren, gaat als Sieve-script naar de IMAP-server. Dat script schrijft ELSA zelf; mailprogramma's kunnen het niet wijzigen.":"Vous gérez les règles dans le volet de l'Office Assistent. Le registre les exécute dès qu'un message arrive, car la plupart des règles définissent des métadonnées. Seul ce qui doit se passer à la remise dans la boîte aux lettres part vers le serveur IMAP sous forme de script Sieve. ELSA rédige lui-même ce script ; les logiciels de messagerie ne peuvent pas le modifier.","Een regel die een zaak koppelt of een classificatie zet, bepaalt mee de bewaartermijn en soms de Woo-categorie. Daarom krijgt elke waarde de regel als bron en valt ze onder de bedenktijd. Of regels van de organisatie ook zonder bedenktijd mogen gelden, beslist de informatiebeheerder.":"Une règle qui lie une procédure ou définit un classement contribue à déterminer la durée de conservation et parfois la catégorie Woo. C'est pourquoi chaque valeur a la règle pour source et relève du délai de réflexion. Le gestionnaire de l'information décide si les règles de l'organisation peuvent aussi s'appliquer sans délai de réflexion.","regels o1, o2, t1, p2 · o1 van toepassing · classificatie: verg · aard: zakelijk · bron: regel o1":"règles o1, o2, t1, p2 · o1 applicable · classement : autor · nature : professionnel · source : règle o1","* 14 EXISTS · * 1 RECENT · Sieve (gegenereerd): geen regel bij aflevering · INBOX":"* 14 EXISTS · * 1 RECENT · Sieve (généré) : aucune règle à la remise · INBOX","Actief":"Act   R.forEach(function(r){var c=r.f==='body'?'body :text :'+r.op+' "'+r.v+'"':r.f==='subject'?'header :'+r.op+' "subject" "'+r.v+'"':'address :'+r.op+' "'+r.f+'" "'+r.v+'"';
