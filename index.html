<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="generator" content="ELSA (e-mailarchief), demo versie 2, 12-10-2026">
<title>ELSA</title>
<style>body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Serif:wght@400;600&display=swap">
<style>
/* Layout: demokader met tabbladen; in Postbus een mailprogramma in drie kolommen dat via IMAP uit ELSA leest, met de assistent boven het bericht. Vormtaal gelijk aan XENA, MIRA en TINA. */
:root{
  --bg:#eaeff0; --surface:#ffffff; --surface2:#f3f7f7; --line:#d3dcde; --fg:#15262b; --muted:#536970;
  --accent:#0d6470; --accent-fg:#ffffff; --accent-soft:#dcedef; --sel:#e2f0f2;
  --amber:#8f5400; --amber-soft:#fbefd6; --red:#a8261d; --red-soft:#fbe3e0;
  --violet:#5b3fa6; --violet-soft:#ebe5f8; --green:#1b6f3f; --green-soft:#def2e5; --blue:#2c5c9c; --blue-soft:#e1eaf7;
  --app:#0f6cbd; --shadow:0 10px 30px rgba(10,40,46,.18);
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --serif:'IBM Plex Serif',Georgia,'Times New Roman',serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0e1618; --surface:#162023; --surface2:#1c292d; --line:#2c3c41; --fg:#e4eced; --muted:#93a7ad;
  --accent:#58b9c7; --accent-fg:#06272c; --accent-soft:#17383e; --sel:#1b3a40;
  --amber:#f0b656; --amber-soft:#3a2c10; --red:#f28b82; --red-soft:#3d1c19;
  --violet:#b7a2f0; --violet-soft:#2a2244; --green:#6fcf97; --green-soft:#163322; --blue:#8fb6ec; --blue-soft:#1a2b45;
  --app:#6cb0f0; --shadow:0 10px 30px rgba(0,0,0,.5); color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3,h4,p,dl,dd,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
svg{display:block;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.shell{display:flex;flex-direction:column;gap:10px;padding-block:12px;padding-inline:16px;max-width:1360px;margin-inline:auto}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.ttl{flex:1 1 240px;min-width:0}
.ttl h1{font-size:17px;font-weight:600}
.ttl h1 small{font-size:12px;font-weight:500;color:var(--muted);margin-left:10px;white-space:nowrap}
.ttl .sub{color:var(--muted);font-size:12.5px}
.seg{display:flex;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px}
.seg button{padding:6px 12px;border-radius:6px;font-weight:500;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.lang{padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.linkbtn{color:var(--accent);font-weight:500;text-decoration:underline;text-underline-offset:2px}
.btn{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:6px;border:1px solid var(--line);font-weight:500;background:var(--surface);white-space:nowrap}
.btn:hover:not(:disabled){background:var(--sel)}
.btn:disabled{opacity:.5;cursor:default}
.btn.pri{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.pri:hover:not(:disabled){filter:brightness(1.08);background:var(--accent)}
.btn.sm{padding:3px 9px;font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:1px 8px;border-radius:99px;font-size:11.5px;font-weight:500;line-height:18px;white-space:nowrap}
.p-green{background:var(--green-soft);color:var(--green)} .p-amber{background:var(--amber-soft);color:var(--amber)}
.p-red{background:var(--red-soft);color:var(--red)} .p-violet{background:var(--violet-soft);color:var(--violet)}
.p-blue{background:var(--blue-soft);color:var(--blue)} .p-grey{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.hint{font-size:12.5px;color:var(--muted)}
.mono{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.regie{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:6px 12px;background:var(--surface);border:1px dashed var(--muted);border-radius:8px;font-size:12.5px;color:var(--muted)}
.regie b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;font-weight:600}
.regie .seg button{padding:3px 10px;font-size:12.5px}
.win{background:var(--surface);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:0 2px 10px rgba(10,40,46,.10)}
.page{padding:20px 22px 26px;display:grid;gap:16px}
.page h2{font-size:19px;font-weight:600;text-wrap:balance}
.lead{max-width:72ch;color:var(--muted)}
.note{border-radius:8px;padding:9px 12px;font-size:13px;display:flex;gap:8px;align-items:flex-start}
.n-amber{background:var(--amber-soft);color:var(--amber)} .n-violet{background:var(--violet-soft);color:var(--violet)} .n-green{background:var(--green-soft);color:var(--green)} .n-grey{background:var(--surface2);color:var(--fg)} .n-red{background:var(--red-soft);color:var(--red)}
.note span{color:var(--fg)} .note svg{margin-top:2px}

/* mailprogramma */
.mc-top{display:flex;align-items:center;gap:10px;padding:6px 12px;background:var(--app);color:#fff;font-size:12.5px;flex-wrap:wrap}
.mc-top b{font-weight:600}.mc-top .acc{margin-left:auto;opacity:.92}
.mc-bar{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--surface2)}
.mc-bar .sep{width:1px;height:20px;background:var(--line);margin-inline:4px}
.tb{display:inline-flex;align-items:center;gap:5px;padding:5px 9px;border-radius:5px;font-size:12.5px;color:var(--fg)}
.tb:hover:not(:disabled){background:var(--sel)} .tb:disabled{opacity:.45;cursor:default} .tb svg{color:var(--app)}
.mc-bar select{padding:4px 6px;border:1px solid var(--line);border-radius:5px;background:var(--surface);font-size:12.5px}
.mc-bar input[type=search]{flex:1 1 200px;min-width:0;padding:5px 9px;border:1px solid var(--line);border-radius:5px;background:var(--surface)}
.mc{display:grid;grid-template-columns:190px 290px minmax(0,1fr) 340px;min-height:580px}.mc.nopane{grid-template-columns:190px 300px minmax(0,1fr)}
.tag{font-size:11.5px;font-weight:600;display:inline-flex;align-items:center;gap:5px}.tag::before{content:"";width:8px;height:8px;border-radius:2px;background:currentColor}
.t-amber{color:var(--amber)}.t-green{color:var(--green)}.t-violet{color:var(--violet)}
.tb[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.ap{display:flex;border-left:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 30%,var(--surface));min-width:0;max-height:640px}
.ap.off{display:block;background:var(--surface2);overflow:auto}
.apm{flex:1;min-width:0;overflow:auto}
.aph{position:sticky;top:0;display:flex;gap:9px;align-items:center;padding:8px 12px;background:var(--accent-soft);border-bottom:1px solid var(--line);border-left:3px solid var(--accent);z-index:1}
.aph h3{font-size:13.5px}.aph p{font-size:11.5px;color:var(--muted)}.aph svg{color:var(--accent)}
.apb{padding:12px 14px;display:grid;gap:10px;font-size:13px}.apb h3{font-size:14px}.apb h4{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);display:flex;gap:6px}.apb h4 b{color:var(--fg)}
.apl{display:grid;gap:4px}.apl button{display:flex;gap:8px;align-items:center;justify-content:space-between;width:100%;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-size:12.5px}.apl button span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.apl button:hover{border-color:var(--accent)}
.apr{width:44px;flex:none;border-left:1px solid var(--line);background:var(--surface2);display:flex;flex-direction:column;gap:2px;padding:6px 0}
.apr button{position:relative;height:38px;display:grid;place-items:center;color:var(--accent)}.apr button:hover{background:var(--surface)}
.apr button[aria-selected="true"]{box-shadow:inset 3px 0 0 var(--accent);background:var(--accent-soft)}
.apr i{position:absolute;top:2px;right:4px;font-style:normal;font-size:9.5px;font-weight:600;background:var(--amber-soft);color:var(--amber);border-radius:99px;padding:0 4px}
.ap .el{border:0;background:none;padding:12px 14px}.ap .meta{grid-template-columns:minmax(0,1fr)}.ap .el .q{flex-direction:column;align-items:stretch}.ap .el .q .btn{justify-content:center}
.fold{border-right:1px solid var(--line);padding:8px 0;background:var(--surface2);font-size:13px}
.fold h4{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);padding:6px 14px 4px;font-weight:600}
.fold button{display:flex;align-items:center;gap:8px;width:100%;padding:5px 14px}
.fold button:hover{background:var(--sel)} .fold button[aria-current="true"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.fold button span{flex:1;min-width:0} .fold button b{font-size:11.5px;font-weight:600;color:var(--app)}
.fold .gr{padding:10px 14px 0;font-size:11.5px;color:var(--muted)}
.list{border-right:1px solid var(--line);overflow:auto;max-height:640px}
.mi{display:grid;gap:2px;width:100%;padding:9px 12px;border-bottom:1px solid var(--line);border-left:3px solid transparent;text-align:left}
.mi:hover{background:var(--surface2)} .mi[aria-current="true"]{background:var(--sel);border-left-color:var(--app)}
.mi .r1{display:flex;gap:6px;align-items:baseline}.mi .r1 b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mi.read .r1 b{font-weight:500}
.mi .r1 time{font-size:11.5px;color:var(--muted);white-space:nowrap}
.mi .sj{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .pv{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .st{display:flex;flex-wrap:wrap;gap:4px;margin-top:2px}
.empty{padding:30px 16px;color:var(--muted);text-align:center;font-size:13px}
.read-p{overflow:auto;max-height:640px;display:flex;flex-direction:column}
.el{border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--accent-soft) 45%,var(--surface));padding:10px 16px;display:grid;gap:8px}
.el .h{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.el .h b{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.el .q{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13.5px}
.el .q strong{font-weight:600}
.el .sug{font-size:12.5px;color:var(--muted)}
.meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.fld{display:grid;gap:3px;font-size:12.5px}
.fld label{font-weight:500}
.fld select,.fld input{padding:5px 8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.fld .ro{padding:5px 8px;border:1px dashed var(--line);border-radius:6px;color:var(--muted)}
.msg{padding:16px 18px 22px;display:grid;gap:10px}
.msg h2{font-size:18px;font-weight:600;text-wrap:balance}
.mh{display:grid;grid-template-columns:70px minmax(0,1fr);gap:3px 10px;font-size:13px}
.mh dt{color:var(--muted)} .mh dd{overflow-wrap:anywhere}
.body{font-family:var(--serif);font-size:14.5px;line-height:1.6;max-width:66ch;display:grid;gap:8px}
.enc{border:1px dashed var(--violet);border-radius:8px;padding:16px;color:var(--violet);display:flex;gap:10px;align-items:flex-start;font-size:13.5px;background:var(--violet-soft)}
.atts{display:flex;flex-wrap:wrap;gap:8px}
.att{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:12.5px;max-width:100%}
.att small{display:block;color:var(--muted);font-size:11px}
.ref{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 12px}

/* doorstroom */
.steps{display:grid;gap:0}
.stp{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 0;border-top:1px solid var(--line)}
.stp .dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px;font-weight:600;background:var(--surface)}
.stp.done .dot{border-color:var(--green);background:var(--green-soft);color:var(--green)}
.stp.now .dot{border-color:var(--accent);color:var(--accent)}
.stp b{font-size:14px}.stp p{font-size:12.5px;color:var(--muted)}
.stp time{font-family:var(--mono);font-size:11.5px;color:var(--muted);white-space:nowrap}
.stp code{display:block;margin-top:4px;font-family:var(--mono);font-size:11.5px;background:var(--surface2);border-radius:6px;padding:6px 8px;white-space:pre-wrap;overflow-wrap:anywhere;color:var(--fg)}
.cols{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:22px;align-items:start}

/* filters */
.rule{border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:6px}
.rule .r1{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.rule .r1 b{flex:1;min-width:0}
.rf{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;align-items:end;border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--surface2)}
pre.sv{margin:0;font-family:var(--mono);font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px 12px;overflow-x:auto;white-space:pre}
.rules{display:grid;gap:8px}
.lim{display:grid;gap:6px;font-size:13px}.lim li{display:flex;gap:8px;align-items:flex-start}

/* adresboek */
.ab{width:100%;border-collapse:collapse;font-size:13px}
.ab th{text-align:left;font-size:11.5px;color:var(--muted);font-weight:600;padding:6px 10px;background:var(--surface2);white-space:nowrap}
.ab td{padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.ab td small{display:block;color:var(--muted);font-size:11.5px}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.share{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;align-content:start}
.share label{display:flex;gap:8px;align-items:center;font-size:13px}
.share input{accent-color:var(--accent)}
.srch{display:flex;gap:8px;flex-wrap:wrap}.srch input{flex:1 1 220px;min-width:0;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}

/* sleutels */
.req{border:1px solid var(--line);border-radius:10px;padding:12px 14px;display:grid;gap:8px;justify-items:start}.req dl{justify-self:stretch}
.req dl{display:grid;grid-template-columns:110px minmax(0,1fr);gap:3px 10px;font-size:13px}.req dt{color:var(--muted)}
.log{display:grid;gap:4px;font-size:12.5px}.log li{display:flex;gap:10px;flex-wrap:wrap;padding:6px 10px;border:1px solid var(--line);border-radius:8px}.log time{color:var(--muted);font-family:var(--mono);font-size:11.5px}

/* architectuur */
.arch{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.zone{border:1.5px dashed var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;align-content:start}
.zone>span{font-size:11px;text-transform:uppercase;letter-spacing:.06em;font-weight:600;color:var(--muted)}
.bx{border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:var(--blue-soft);display:grid;gap:2px}
.bx b{font-size:13.5px}.bx small{font-size:12px;color:var(--muted)}
.bx.u{background:var(--surface2)}
.flow{display:grid;gap:6px;font-size:13px}.flow li{display:flex;gap:10px;align-items:baseline}.flow li i{font-style:normal;font-family:var(--mono);font-size:11.5px;color:var(--accent);flex:none;width:22px}
.open{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:10px}
.open div{border-left:3px solid var(--amber);padding:2px 0 2px 12px;display:grid;gap:3px}.open b{font-size:14px}.open span{font-size:13px;color:var(--muted)}

.hood{background:var(--surface);border:1px solid var(--line);border-radius:8px;font-size:12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;padding:6px 12px}
.hood b{font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;flex:none}
.hood code{flex:1 1 300px;min-width:0;font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.colo{font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
.toasts{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:grid;gap:6px;z-index:20;max-width:min(400px,calc(100% - 32px))}
.toast{background:var(--fg);color:var(--bg);padding:8px 12px;border-radius:8px;font-size:13px;box-shadow:var(--shadow)}
#layer:empty{display:none}
#layer{position:fixed;inset:0;background:rgba(8,24,28,.45);display:grid;place-items:center;padding:16px;z-index:10}
.dlg{background:var(--surface);border-radius:10px;box-shadow:var(--shadow);max-width:600px;width:100%;max-height:100%;overflow:auto;padding:18px 20px;display:grid;gap:12px}
.dlg h2{font-size:16px}
.dlg .rowb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.dlg textarea{width:100%;min-height:110px;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--surface);font-family:var(--serif)}
.to-list{display:grid;gap:2px;border:1px solid var(--line);border-radius:6px;max-height:150px;overflow:auto}
.to-list button{padding:5px 9px;text-align:left;font-size:13px}.to-list button:hover{background:var(--sel)}.to-list small{color:var(--muted)}

@media (max-width:1200px){.mc,.mc.nopane{grid-template-columns:170px 260px minmax(0,1fr)}.mc .ap{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);max-height:none}}
@media (max-width:1000px){
  .mc,.mc.nopane{grid-template-columns:minmax(0,1fr)}
  .fold{display:flex;flex-wrap:wrap;gap:2px;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .fold h4,.fold .gr{display:none}.fold button{width:auto;padding:5px 10px;border-radius:6px}
  .list{border-right:0;border-bottom:1px solid var(--line);max-height:300px}.read-p{max-height:none}
  .cols,.arch{grid-template-columns:minmax(0,1fr)}
  .page{padding:16px}
}
</style>

<div class="shell">
  <header class="top" id="top"></header>
  <div class="regie" id="regie"></div>
  <div id="win"></div>
  <div class="hood" id="hood"></div>
  <div class="colo" id="colo"></div>
</div>

aufen als Sieve.","Het mailprogramma kan filters ook zelf beheren via ManageSieve. ELSA toetst elk script voordat het wordt opgeslagen.":"Das Mailprogramm kann Filter auch selbst über ManageSieve verwalten. ELSA prüft jedes Skript, bevor es gespeichert wird.","Het mailprogramma verstuurt een nieuw bericht via SMTP naar Exchange Online.":"Das Mailprogramm sendet eine neue Nachricht über SMTP an Exchange Online.","Het onderwerp noemt een lopend Woo-verzoek.":"Der Betreff nennt einen laufenden Woo-Antrag.","Hier zijn de foto's.":"Hier sind die Fotos.","Hierbij het concept van het projectplan. Kun je vooral naar de paragraaf over vergunningen voor terrassen kijken?":"Anbei der Entwurf des Projektplans. Kannst du dir vor allem den Abschnitt über Genehmigungen für Terrassen ansehen?","Hoi San, neem jij zaterdag de taart mee? Oma rekent op je. Liefs, Ellen":"Hallo San, bringst du am Samstag den Kuchen mit? Oma zählt auf dich. Liebe Grüße, Ellen","Hoi Sanne,":"Hallo Sanne,","Houtplein":"Houtplein","IMAP":"IMAP","IMAP gaat alleen over mail. De agenda blijft voorlopig in Exchange; het adresboek gaat via CardDAV.":"IMAP betrifft nur Mail. Der Kalender bleibt vorerst in Exchange, das Adressbuch läuft über CardDAV.","IMAP-server":"IMAP-Server","IMAP4 en Sieve":"IMAP4 und Sieve","Ik ben afwezig tot maandag.":"Ich bin bis Montag abwesend.","In de schets staat GreenMail. Dat is een testserver. Voor productie ligt een volwaardige IMAP-server met Sieve voor de hand, bijvoorbeeld Dovecot met Pigeonhole.":"In der Skizze steht GreenMail. Das ist ein Testserver. Für den Produktivbetrieb liegt ein vollwertiger IMAP-Server mit Sieve nahe, zum Beispiel Dovecot mit Pigeonhole.","In deze nieuwsbrief: de nieuwe handreiking voor actieve openbaarmaking, een webinar over de Omgevingswet en het laatste nieuws uit de regio.":"In diesem Newsletter: die neue Handreichung zur aktiven Veröffentlichung, ein Webinar zum Umweltgesetz (Omgevingswet) und das Neueste aus der Region.","In het echte systeem op s.","De toegang geldt alleen voor de genoemde periode en vervalt vanzelf. Elke opening van een bericht met deze sleutel wordt vastgelegd.":"Access applies only to the period stated and expires automatically. Every time a message is opened with this key, it is recorded.","De werkinstructie leges 2026 is vastgesteld. Je vindt haar in de werkmap van het team.":"The work instruction on fees 2026 has been adopted. You can find it in the team's working folder.","Delegeren aan de concerncontroller":"Delegate to the corporate controller","Demo":"Demo","Demo: {0} dagen later":"Demo: {0} days later","Deze map is leeg.":"This folder is empty.","Dit bericht":"This message","Dit bericht is automatisch verstuurd.":"This message was sent automatically.","Dit bericht is opgeslagen met jouw persoonlijke sleutel. In de opslag is het onleesbaar, ook voor beheerders.":"This message is stored with your personal key. In storage it is unreadable, even to administrators.","Dit bericht kan zowel zakelijk als persoonlijk zijn.":"This message could be either business or personal.","Doe je niets, dan geldt het bericht na tien dagen als zakelijk. Persoonlijk betekent: verplaatst naar de map Persoonlijk, versleuteld met jouw eigen sleutel en buiten het zoekbereik voor de Woo.":"If you do nothing, the message counts as business after ten days. Personal means: moved to the Personal folder, encrypted with your own key and outside the search scope for the Woo.","Doorstroom":"Message flow","Doorstroom van een bericht":"How a message flows","Doorsturen mag alleen naar een adres van een aangesloten gemeente.":"Forwarding is only allowed to an address at a participating municipality.","Dossier of zaak":"Dossier or case","Dubbele berichten":"Duplicate messages","E-mail archiveren in XENA: elk bericht in het register, gewoon lezen in je eigen mailprogramma.":"E-mail archiving in XENA: every message in the register, read as usual in your own mail program.","E-mailadres":"E-mail address","ELSA bij dit bericht":"ELSA for this message","ELSA zet niet-gescheiden berichten na tien dagen op zakelijk":"ELSA marks unsorted messages as business after ten days","Een adresboek van medewerkers van de aangesloten gemeenten. Iedereen bepaalt zelf of en met welke gegevens hij erin staat. Elke gemeente beheert haar eigen deel en deelt het via CardDAV.":"An address book of staff at the participating municipalities. Everyone decides for themselves whether to be listed and with which details. Each municipality manages its own part and shares it via CardDAV.","Een bericht van een winkel over iets privés.":"A message from a shop about something private.","Een dagelijks overzicht van ELSA met de berichten die nog gescheiden moeten worden.":"A daily summary from ELSA of the messages that still need sorting.","Een filter mag niet naar Persoonlijk verplaatsen. Of een bericht persoonlijk is, kies je zelf, per bericht.":"A filter may not move messages to Personal. Whether a message is personal is your own choice, message by message.","Een mailprogramma verwacht dat verwijderen lukt. ELSA haalt het bericht uit de map, maar het object blijft bewaard zolang de bewaartermijn loopt.":"A mail program expects deletion to succeed. ELSA removes the message from the folder, but the object is kept for as long as the retention period runs.","Een nieuwsbrief: zakelijk, met een korte bewaartermijn.":"A newsletter: business, with a short retention period.","Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.":"A personal message stays personal. If you think it is business after all, first choose Business in ELSA.","Een transport rule stuurt elk bericht, in en uit, als EML door naar Kafka.":"A transport rule forwards every message, incoming and outgoing, as EML to Kafka.","Een verzonden bericht komt twee keer binnen: via de transport rule en als kopie uit het mailprogramma. ELSA ontdubbelt op Message-ID.":"A sent message arrives twice: via the transport rule t et dans l'index de recherche. Aucune copie ne reste dans Exchange.","Elke bijlage is een eigen object in de opslag, verbonden met het bericht. Zo is een bijlage apart te vinden, te bewaren en te publiceren.":"Chaque pièce jointe est un objet distinct dans le stockage, relié au message. Une pièce jointe peut ainsi être retrouvée, conservée et publiée séparément.","Er is een nieuwe aanvraag ingediend voor het adres Kleverlaan 14. De aanvraag en de tekeningen zijn als bijlage toegevoegd.":"Une nouvelle demande a été déposée pour l'adresse Kleverlaan 14. La demande et les plans sont joints.","Evenementen":"Manifestations","Exchange Online":"Exchange Online","Filter toegevoegd.":"Filtre ajouté.","Filter toevoegen":"Ajouter un filtre","Filters":"Filtres","Filters (Sieve)":"Filtres (Sieve)","Filters draaien in ELSA zelf, op het moment dat een bericht binnenkomt. Ze werken dus in elk mailprogramma en op elk apparaat. Sommige acties zijn niet toegestaan, omdat ze de scheiding tussen zakelijk en persoonlijk zouden omzeilen.":"Les filtres s'exécutent dans ELSA même, au moment où un message arrive. Ils fonctionnent donc dans tous les logiciels de messagerie et sur tous les appareils. Certaines actions ne sont pas autorisées, car elles contourneraient la séparation entre professionnel et personnel.","Foto's van de vakantie":"Photos des vacances","Functie":"Fonction","Geachte aanvrager,":"Madame, Monsieur,","Gedelegeerd":"Délégué","Geen":"Aucun","Geen assistent in Outlook":"Pas d'assistant dans Outlook","Gemeente":"Commune","Gemeente Bloemendaal":"Commune de Bloemendaal","Gemeente Haarlem":"Commune de Haarlem","Gemeente Heemstede":"Commune de Heemstede","Gemeente Velsen":"Commune de Velsen","Gemeente Zandvoort":"Commune de Zandvoort","Gemeentelijk adresboek":"Annuaire intercommunal","Gemeentesecretaris":"Secrétaire général","Geweigerd":"Refusé","Goed nieuws: de reparatie is klaar. Je kunt je fiets ophalen tot 18:00 uur.":"Bonne nouvelle : la réparation est terminée. Vous pouvez     else if(m.aard==='persoonlijk'){m.gone=true;w('IMAP EXPUNGE → '+wt('persoonlijk bericht verwijderd, ook uit de opslag'));toast(t('Verwijderd.'))}
    else{m.gone=true;w('IMAP UID STORE +FLAGS (\\Deleted) · EXPUNGE → OK · '+wt('uit de map gehaald')+' · '+wt('object blijft in de opslag onder bewaartermijn'));toast(t('Uit de map gehaald. Het bericht is zakelijk en blijft bewaard in het archief zolang de bewaartermijn loopt.'))}
    var L=S.q?[]:inFolder(S.folder);S.sel=L.length?L[0].id:null;render()},
  skip:function(e){S.skip=+e.dataset.v;w(S.skip?wt('Demo: {0} dagen later',S.skip)+' · '+wt('ELSA zet niet-gescheiden berichten na tien dagen op zakelijk'):'—');render()},
  compose:function(){S.modal={to:'',sj:'',bd:''};render()},
  cclose:function(){S.modal=null;render()},
  pick:function(e){S.modal.to=e.dataset.v;S.modal.focus='c-sj';render()},
  send:function(){var m=S.modal;['to','sj','bd'].forEach(function(k){var el=document.getElementById('c-'+k);if(el)m[k]=el.value});
    if(!m.to||m.to.indexOf('@')<0){toast(t('Vul een e-mailadres in.'));return}
    var g=GAB.filter(function(r){return r[1]===m.to})[0];
    var n=M({id:'s'+Date.now(),folder:'sent',age:0,from:ME,to:[P(g?g[0]:m.to,m.to)],subj:m.sj||t('(geen onderwerp)'),aard:'zakelijk',sorted:true,body:[m.bd||''],read:true});
    n.klass='';n.dos=0;n.vertr='Intern';n.enc=false;MAILS.push(n);BY[n.id]=n;S.modal=null;S.folder='sent';S.sel=n.id;
    w('SMTP → Exchange Online · transport rule → Kafka · NiFi → register '+n.pid+' · IMAP APPEND "Verzonden items" → '+wt('ontdubbeld op Message-ID'));toast(t('Verzonden. Het bericht staat in ELSA onder Verzonden items.'));render()},
  flow:function(){S.flow={step:-1};var go=function(){S.flow.step++;var s=FLOW[S.flow.step];w(t(s[0])+' · '+t(s[3]));render();if(S.flow.step<FLOW.length-1)setTimeout(go,matchMedia('(prefers-reduced-motion: reduce)').matches?0:450)};go()},
  rdel:function(e){S.rules.splice(+e.dataset.i,1);w('ManageSieve PUTSCRIPT "elsa" → OK');render()},

  role:function(e){S.role=e.dataset.v;render()},
  pm:function(e){S.pm=e.dataset.v;render()},
  pane:function(){S.pane=!S.pane;render()},
  client:function(e){S.client=e.dataset.v;w(S.client==='tb'?'Thunderbird: IMAP + '+wt('extensie van ELSA (REST, met het token van de gebruiker)'):'Outlook: IMAP · '+wt('geen invoegtoepassing mogelijk bij een IMAP-account'));render()},
  web:function(){toast(t('In het echte systeem opent hier de webmail van ELSA, met hetzelfde paneel.'))},
  kreq:function(e){var r=S.reqs[0],v=e.dataset.v;r.state=v;var tx=v==='ok'?'Toegang gegeven aan Juridische Zaken tot de persoonlijke sleutel van R. Hendriks, voor de periode 01-03-2026 tot 30-06-2026. Vervalt na 30 dagen.':v==='no'?'Verzoek van Juridische Zaken geweigerd.':'Bevoegdheid gedelegeerd aan de concerncontroller, voor dit ene verzoek.';
    S.keylog.push({t:now().toISOString(),who:'Gemeentesecretaris',what:tx});w('POST /keyvault/grants → '+(v==='ok'?'201 · '+wt('tijdelijke toegang, gelogd'):v==='no'?'200 · '+wt('geweigerd, gelogd'):'201 · '+wt('delegatie, gelogd')));render()}
};
document.addEventListener('click',function(ev){var e=ev.target.closest&&ev.target.closest('[data-act]');if(!e||e.disabled)return;var f=A[e.dataset.act];if(f)f(e)});

document.addEventListener('submit',function(ev){if(ev.target.id!=='rform')return;ev.preventDefault();var r=Object.assign({},S.nr),err=ruleCheck(r);
  if(err){w('ManageSieve PUTSCRIPT "elsa" → NO · '+t(err));render();return}
  r.id='r'+Date.now();S.rules.push(r);S.nr={f:'from',op:'contains',v:'',act:'fileinto',arg:'Houtplein'};w('ManageSieve CHECKSCRIPT → OK · PUTSCRIPT "elsa" → OK');toast(t('Filter toegevoegd.'));render()});
document.addEventListener('input',function(ev){var e=ev.target;
  if(e.id==='q'){S.q=e.value;var p=e.selectionStart;var L=MAILS.filter(function(m){return !m.gone&&m.folder!=='pers'&&hit(m,S.q)});w(S.q?'IMAP UID SEARCH TEXT "'+S.q+'" → '+wt('zoekindex van ELSA')+' · '+wt('{0} berichten',L.length):'IMAP SELECT INBOX → OK');render();var q=document.getElementById('q');q.focus();q.setSelectionRange(p,p);return}

  if(e.id==='nr-v'||e.id==='nr-arg'&&e.tagName==='INPUT'){S.nr[e.dataset.nr]=e.value;return}
  if(e.id==='c-to'){S.modal.to=e.value;S.modal.sj=(document.getElementById('c-sj')||{}).value||S.modal.sj;S.modal.bd=(document.getElementById('c-bd')||{}).value||S.modal.bd;S.modal.focus='c-to';render()}});
document.addEventListener('change',function(ev){var e=ev.target;
  if(e.id==='lang'){setLang(e.value,true);render();return}
  if(e.id==='mv'&&e.value){var m=BY[S.sel],v=e.value;if(v==='pers'){A.aard({dataset:{v:'persoonlijk'}});return}
    if(m.folder==='pers'){toast(t('Een persoonlijk bericht blijft persoonlijk. Vind je het toch zakelijk, kies dan eerst Zakelijk in ELSA.'));render();return}
    m.folder=v;w('IMAP UID MOVE → "'+t(FOLDERS.filter(function(f){return f[0]===v})[0][1])+'" · '+wt('alleen de map verandert, het object niet'));render();return}
  if(e.dataset&&e.dataset.f){var m2=BY[S.sel],k=e.dataset.f;m2[k]=k==='dos'?+e.value:e.value;m2.hist.push('Metagegevens aangevuld');w('PROPPATCH register '+m2.pid+' → '+k+' · '+wt('bijgewerkt'));render();return}
  if(e.dataset&&e.dataset.nr){S.nr[e.dataset.nr]=e.value;if(e.tagName==='INPUT')return;if(e.dataset.nr==='act')S.nr.arg=e.value==='fileinto'?'Houtplein':e.value==='redirect'?'':e.value==='vacation'?t('Ik ben afwezig tot maandag.'):'';render();return}
  if(e.dataset&&e.dataset.sh){S.share[e.dataset.sh]=e.checked;if(S.inGab)w('CardDAV PUT /gab/haarlem/s.devries.vcf → 204 · '+wt('alleen de gekozen velden'));render()}});
var EXTRA=['Na tien dagen automatisch zakelijk','Aangemerkt als persoonlijk en versleuteld','Aangemerkt als zakelijk','Versleuteld als vertrouwelijk','Metagegevens aangevuld','Toegang gegeven aan Juridische Zaken tot de persoonlijke sleutel van R. Hendriks, voor de periode 01-03-2026 tot 30-06-2026. Vervalt na 30 dagen.','Verzoek van Juridische Zaken geweigerd.','Bevoegdheid gedelegeerd aan de concerncontroller, voor dit ene verzoek.','Gemeentesecretaris'];

  Object.keys(CLASSES).forEach(function(k){o.push(CLASSES[k])});o=o.concat(DOSS.filter(Boolean),VERTR);FOLDERS.forEach(function(f){o.push(f[1])});
